name: level_up_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  # hive_ce / hive_ce_flutter removed 2026-08-15 (Wave 3). They were declared
  # but never imported: zero Dart references in lib/, no generated adapters, no
  # build.yaml. The only three matches in the codebase were comments explaining
  # that quiz data is deliberately NOT cached to Hive. There is no caching layer
  # in this app — Riverpod holds state in memory and that is the design.
  #
  # This is a removal of unused dependencies, not a storage migration. If
  # offline caching is added later, choose the package then, on its merits.
  url_launcher: ^6.3.2
  screen_protector: ^1.5.3
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter
  pinput: ^6.0.2
  device_info_plus: ^13.2.0
  flutter_svg: ^2.3.0
  country_flags: ^4.1.2
  # Profile avatars (GET /me → avatar.url). Cached so Home doesn't re-download
  # the same image on every tab switch on a metered Egyptian connection.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  # Generates every Android mipmap / iOS appiconset size from the single
  # master in assets/launcher_icon/. Regenerate with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  # hive_ce_generator removed with its runtime packages — it generated nothing
  # (no Hive adapters exist anywhere in the tree).

# App launcher icon — generated, never hand-edited.
#
# Source of truth: assets/launcher_icon/app_icon.svg, the designer's MARK-ONLY
# icon (wing + arrow, no wordmark or tagline, fill #040404, no background),
# delivered 2026-09-30 as "Object [Vectorized]2.svg" and vendored byte-for-byte.
# The full lockup it replaces was too thin to read at launcher size.
#
# The two PNG masters beside it are vector renders at 1024x1024. The designer's
# paths are never edited: they are wrapped in one translate+scale and placed by
# the ink's minimal enclosing circle, not its bounding box, because the mark has
# ink in three corners of its box.
#
#   app_icon.png             opaque white square, no alpha (iOS forbids it and
#                            masks its own corners). Enclosing circle = 66/72
#                            of the tile, the same visible proportion Android
#                            gets, so both platforms show the mark equally big.
#   app_icon_foreground.png  ink only, transparent. Enclosing circle = Android's
#                            documented 66dp-of-108dp safe circle, so no
#                            launcher mask (circle, squircle, teardrop) clips it.
#
# These masters are NOT listed under flutter: assets: on purpose — they are
# build-time inputs, not runtime assets, and must not ship in the bundle.
#
# Regenerate after any of them changes:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher_icon/app_icon.png"

  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon/app_icon_foreground.png"
  # The foreground master is already scaled to Android's safe circle, so the
  # package's default 16% inset would pad it a second time and leave the
  # mark floating small in the middle of the tile.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

  ios: true
  # Belt-and-braces: the master is already alpha-free, but App Store Connect
  # rejects any transparency in the 1024 marketing icon.
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate the typed AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  # All user-facing copy goes through AppLocalizations — zero hardcoded strings.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    # Flutter asset dirs are NOT recursive — nested folders need their own line.
    - assets/icons/nav/

  # Bundled fonts (NOT google_fonts) — no runtime fetch, works offline, and
  # Arabic renders from Tajawal/Cairo. Inter has NO Arabic glyphs, so Arabic
  # text falls back to Tajawal (configured in app_theme.dart).
  # Drop the .ttf files into assets/fonts/ — see assets/fonts/README.md.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
