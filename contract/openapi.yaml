  /me/deletion-request:
    post:
      tags: [profile]
      x-stability: stable
      operationId: requestAccountDeletion
      summary: Request account deletion — starts the 30-day grace window (adr-114)
      description: >
        Records a deletion request for the **caller's own** account (there is no id parameter) and
        returns the window. `effectiveAt` is `requestedAt` + 30 days, UTC, and is a **"no earlier
        than"** time: erasure runs from a daily job, so execution may lag `effectiveAt` by up to
        ~24 hours.


        **What happens immediately, at request time.** The caller's session and refresh chain are
        revoked — this `202` is the last thing that token does, so send the student to the login
        screen and purge the token pair; a retry with it will fail. The student is also removed
        from every peer-visible surface at once (leaderboards included).


        **Confirm-screen copy the app must show BEFORE calling this (adr-114 D3).** The request is
        reversible only inside the grace window, by logging in again and calling
        `DELETE /me/deletion-request`. **An active paid subscription is forfeited** — there is no
        partial refund, the remaining paid time is not restored by cancelling, and it does not
        carry to a future account. **A new account registered later with the same phone number
        starts from zero** — no points, no level, no badges, no quiz history. The phone stays
        blocked for the whole grace window (the account still exists) and is freed at execution.


        **During grace the account offers exactly one action**, enforced server-side: every
        authenticated `/api/v1` endpoint outside a four-endpoint allowlist answers `403`
        `account_pending_deletion`. The allowlist and the anonymous-recovery carve-out are in this
        document's top-level description.
      responses:
        '202':
          description: Deletion requested — the grace window has started and this session is dead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestedAt: { type: string, format: date-time, description: UTC — when the request was recorded. }
                  effectiveAt: { type: string, format: date-time, description: "UTC — `requestedAt` + 30 days. Erasure runs no EARLIER than this; the daily job may execute it up to ~24 h later." }
                required: [requestedAt, effectiveAt]
        '409':
          description: "`deletion_already_requested` — a request is already pending. This call did NOT start a new window and did not move `effectiveAt`; read the live window from `GET /me`'s `pendingDeletion`. Deliberately explicit rather than an idempotent `202`, so the client can never show a fresh 30 days that isn't real."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    delete:
      tags: [profile]
      x-stability: stable
      operationId: cancelAccountDeletion
      summary: Cancel the pending deletion request during the grace window
      description: >
        One of the four authenticated endpoints a pending-deletion student may reach. On `204` the
        account is fully usable again **on the next request with the same token** — the grace check
        is a live read, so nothing is cached and no token reissue is needed.


        Peer visibility returns too, but not necessarily instantly: the student is restored to the
        leaderboards no later than the next projection rebuild. The direction of that lag is
        over-hiding, never a leak.
      responses:
        '204': { description: The pending request is cancelled; the account is unrestricted again. }
        '404':
          description: "`no_pending_deletion` — nothing pending to cancel. Also returned once erasure has begun executing for this account: the grace window is over in fact, not just in wording, and the request can no longer be withdrawn."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/track-transfer:
    post:
      tags: [profile]
      x-stability: stable
      operationId: transferToUniversity
      summary: Track transfer — move the caller from the School track to the University track, once (spec-059)
      description: >
        Moves the **caller's own** account from the School track to the University track. There is
        no id parameter: the student is taken from the access token. The student picks the
        university, faculty and study year inside the transfer flow, from the same lists and with the
        same rules as University registration (`/reference/universities`), and confirms twice on the
        client. `acknowledgeIrreversible: true` is that confirmation on the wire.


        **Permanent, and once only.** There is no way back to the School track, not even through
        Customer Service or an Admin, and a student who has transferred can never transfer again.
        The confirm copy must say so plainly.


        **Who may transfer.** Only a School student whose current stage is `secondary3` (the final
        school year, for every education system). Every other School student gets
        `403 track_transfer_not_eligible`. Until year progression is built, only students who
        registered at `secondary3` can reach that stage, so only they can transfer — a stated
        launch limitation.


        **What changes, in one step.** The School enrolment closes and the University enrolment
        opens in the same server transaction, so no client ever observes the account between
        tracks. Points, level and badges are unchanged: `schoolPoints` stays, `universityPoints`
        starts where it is, `totalPoints` carries. The subscription and the privacy toggles carry.
        The friend list and pending friend requests start fresh (blocks stay). The student leaves
        the school leaderboards and joins their university cohort board and the global board. Show
        the University disclosure on the confirm screen: on the University track the parent number
        is kept only for account recovery, and the parent no longer receives reports.


        **Order of refusals.** `403 account_pending_deletion` first, then
        `409 track_transfer_not_allowed`, then `403 track_transfer_not_eligible`, then
        `400 validation_failed` for the body. A refused call changes nothing. An answer submitted
        after the transfer to a quiz that was started on the School track is refused by
        `submitAnswer` with `403 insufficient_scope`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                universityId: { $ref: '#/components/schemas/Uuid' }
                facultyId: { $ref: '#/components/schemas/Uuid', description: Must be a faculty of `universityId`. }
                studyYearId: { $ref: '#/components/schemas/Uuid', description: "Must be an `active` study year of `facultyId`, exactly as `UniversityRegistration` (`soon` → `validation_failed`). Any active year may be chosen, not only the first." }
                acknowledgeIrreversible: { type: boolean, const: true, description: "Must be `true` — the client's confirmation that the transfer is permanent. Missing or `false` → `validation_failed` naming this property." }
              required: [universityId, facultyId, studyYearId, acknowledgeIrreversible]
      responses:
        '200':
          description: Transferred. The caller's refreshed profile, now on the University track — the same schema as `getMyProfile`, so the client re-renders without a second call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '400':
          description: "`validation_failed` — `errors` names the field: an id that is missing or not a UUID, an unknown university, a faculty outside the university, a study year that is not an `active` year of that faculty, or `acknowledgeIrreversible` missing or not `true`. Nothing was written."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — the account is inside the 30-day deletion grace window (adr-114), and this operation is not on that window's allowlist. · `track_transfer_not_eligible` — the caller is on the School track but not at the final school stage (`secondary3`). **Read `code` to tell them apart.** Nothing was written."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`track_transfer_not_allowed` — the caller is already on the University track: registered there, or already transferred. A transfer happens once and never reverses. Nothing was written; re-read `GET /me`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/entitlements:
    get:
      tags: [entitlements]
      x-stability: stable
      operationId: getMyEntitlements
      summary: Subscription state — the entitlement source of truth (extensible set, adr-018)
      description: >
        Refetch on app resume. There is no `pending` state — an entitlement is active or it
        isn't. Also embedded read-only in GET /me for first paint. Types are additively
        extensible (future finalRevision — no version bump).
      responses:
        '200':
          description: All entitlement states for the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntitlementState' }
                required: [items]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/invite:
    get:
      tags: [profile]
      x-stability: stable
      operationId: getMyInvite
      summary: The caller's own Refer a Friend code and its two counts
      description: >
        spec-047. The caller's invite code — created on the first call, one per student, never
        changes and cannot be regenerated (R9) — and two counts (R8): how many new accounts
        registered with it (`friendsJoined`) and the points it has earned the caller
        (`pointsEarned`). The rule (adr-185 D9): the student who shares the code earns +10 points
        once for each new, OTP-verified account that registers with it, in their current Track's
        points; the new student earns no referral points; there is no credit while the sharer has
        no active enrolment. Never lists who joined. Takes no id — always the caller's own. Share the
        code however the app lets the student share text; there is no invite link and no web page.
      responses:
        '200':
          description: The caller's invite code and counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyInvite' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/mistakes:
    get:
      tags: [quiz]
      x-stability: stable
      operationId: getMyMistakes
      summary: The Mistakes overview — subjects the caller currently has wrong answers in
      description: >
        The first screen of the Mistakes flow. Returns ONE entry per subject the caller currently
        has at least one mistake in, with a live `mistakeCount`. Server-derived scope only: there is
        no scope parameter in the path, the query string or a header.


        **"Currently" is the point.** A mistake counts only while the student's MOST RECENT graded
        answer to that question was wrong. Answer it correctly in a later quiz and it stops counting
        here, immediately and with no further action. The count is computed on every read and is
        never cached, so it can differ between two requests seconds apart.


        🔴 **This is deliberately NOT the same set as `POST /quizzes` `mode: retakeWrong` draws
        from.** The retake pool is *ever wrong* and does not decay; this count is *currently wrong*
        and does. A question you answered wrongly and later got right is **absent from every
        `mistakeCount` and still present in a retake quiz**. That divergence is intentional (adr-133)
        — do not reconcile the two numbers in the client, and do not derive one from the other.


        **A subject with zero current mistakes is ABSENT, never present with `0`.** `[]` is therefore
        a NORMAL response — the record of a student who has nothing outstanding. Clients MUST NOT
        render empty-as-error.
      responses:
        '200':
          description: >
            Bare array (closed per-student set), possibly EMPTY. Ordered by `name` ascending, then
            `id` — a stable order the client can render without sorting. `name` is in the content
            language (adr-018). School subjects carry `termId: null`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    termId: { $ref: '#/components/schemas/TermId' }
                    termNumber: { $ref: '#/components/schemas/TermNumber' }
                    mistakeCount:
                      type: integer
                      minimum: 1
                      description: >
                        Always at least 1 — a subject with no current mistakes is absent from the
                        array rather than present with `0`.
                  required: [id, name, mistakeCount]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >
            `insufficient_scope` — the caller is authenticated but currently has **no active
            enrolment** to scope their history against, so there is no cohort in which a
            `mistakeCount` means anything. Reachable in ordinary use: a track transfer closes the
            old enrolment before the new one opens (adr-032). This is NOT a refusal about a
            subject — this operation takes no client-supplied id and refuses no id; the subject
            route's `403` is the membership answer and this one is not. Treat it as
            "your enrolment is between states", not as an authorization failure to retry or log out
            on. · `account_pending_deletion` — the caller's account is inside the 30-day deletion
            grace window, during which every authenticated endpoint but four is unavailable
            (adr-114); this operation is not on that allowlist, so the refusal happens before any
            mistake is counted. Route to the cancel screen from the same global interceptor that
            already handles this code elsewhere; do not log out and do not retry. **Read `code` to
            tell the two apart** — they are different states and only one of them is about your
            enrolment.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/mistakes/subjects/{subjectId}:
    get:
      tags: [quiz]
      x-stability: stable
      operationId: getMyMistakesForSubject
      summary: The Mistakes tree for ONE subject — school (units→chapters→lessons) or university (lectures)
      description: >
        The drill-down behind the Mistakes overview. Same decay rule as `GET /me/mistakes` — see that
        operation's description, including the deliberate divergence from `mode: retakeWrong`.


        🔴 **The tree is PRUNED, and it is not a clone of `getSubjectTree`.** A lesson (or lecture)
        appears only when its own `mistakeCount` is greater than zero; a chapter appears only when it
        has such a lesson; a unit only when it has such a chapter. Every parent's `mistakeCount` is
        the SUM of its descendants'. So there is no dead branch the student can tap into and find
        empty — and the shape is its own, which is why it has its own schemas.


        **An in-scope subject the caller has no current mistakes in returns `200` with an empty
        `units` (or `lectures`) array and `mistakeCount: 0`** — that is a normal response, not an
        error and not a `403`. A `subjectId` outside the caller's scope is `403 insufficient_scope`,
        exactly as `getSubjectTree` answers the same membership question about the same id. **The two
        cases are different and both are reachable with an empty history.**


        **University counts inherit the release gate** (adr-135): a subject whose term the admin
        un-releases for the caller's cohort drops out of the caller's scope, and its mistakes stop
        being counted, with no in-app explanation. Re-releasing restores them unchanged. School
        content is never release-gated (adr-073).
      parameters:
        - { name: subjectId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Track-shaped pruned tree.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SchoolMistakesTree'
                  - $ref: '#/components/schemas/UniversityMistakesTree'
                discriminator:
                  propertyName: track
                  mapping:
                    school: '#/components/schemas/SchoolMistakesTree'
                    university: '#/components/schemas/UniversityMistakesTree'
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope` — the `subjectId` is outside the caller's scope (a caller with no active enrolment at all gets the same answer here, deliberately: this route refuses an id you supplied, exactly as `getSubjectTree` answers the same membership question about the same id, and the two causes must stay indistinguishable). · `account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114); this operation is not on that allowlist, so the refusal happens before the `subjectId` is resolved at all. Route to the cancel screen from the same global interceptor that already handles this code elsewhere; do not log out and do not retry. **Read `code` to tell the two apart.**"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /catalog/subjects:
    get:
      tags: [catalog]
      x-stability: stable
      x-behaviour-changed: 2.3.0-m1
      operationId: listSubjects
      summary: Subjects scoped to the caller's registration (server-derived — no scope params)
      description: >
        School — scoped by (education system, stage); University — by (university, faculty, year, TERM).
        The client never sends scope; it comes from the authenticated student (adr-013 scoping).


        **BEHAVIOURAL CHANGE in 2.3.0-m1 (adr-091) — the schema is unchanged and the returned SET
        WIDENS.** The catalog is **browse-only and is NOT entitlement-gated**: a free student —
        school or university — sees the complete catalog they are permitted to browse. This read
        filters by enrolment scope and, for university, by release; **it does not consult
        entitlement state at all.** The `1.2.0-m1` "TWO independent gates" note is superseded:
        **Gate B (entitlement) is not weakened, it is RELOCATED** to quiz creation and question
        delivery, where the free tier expresses itself as an allowance (50 distinct questions per
        week) instead of as an empty screen. A subject's *name* is not the product; the bank of
        questions is.


        **Gate A — release — survives unchanged and remains UNIVERSITY-ONLY**, and it applies
        equally to free and to subscribed students: the subject's term is released for the student's
        cohort (`term_schedule.released_at IS NOT NULL OR starts_on <= today`; a cohort with NO
        schedule row is released — **fail-open is deliberate**, adr-036 §7). School subjects are
        never release-gated (adr-073). There is no per-student term state anywhere (adr-037).


        **An unreleased term is ABSENT, not flagged** (adr-038 §3). There is no release state on the
        wire and no terms endpoint by design; the client has no way to know an unreleased term exists.
        **Therefore `[]` is a NORMAL response** — a university student who registers before their
        Term 1 start date has an empty catalog. Clients MUST NOT render empty-as-error.


        **A year-long course is TWO subjects** (adr-036 §2) — e.g. `Anatomy` term 1 and `Anatomy`
        term 2 — with identical `name`. Group and order on `termNumber`; render the term label
        client-side (localized AR/EN). School subjects carry `termId: null`.
      responses:
        '200':
          description: >
            Bare array (closed per-student set), possibly EMPTY — see the behavioural note above.
            `name` is in the content language (adr-018).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    termId: { $ref: '#/components/schemas/TermId' }
                    termNumber: { $ref: '#/components/schemas/TermNumber' }
                    questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                  required: [id, name, questionCounter]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /catalog/subjects/{subjectId}/tree:
    get:
      tags: [catalog]
      x-stability: stable
      x-behaviour-changed: 2.3.0-m1
      operationId: getSubjectTree
      summary: The quiz-build tree — school (units→chapters→lessons) or university (lectures + quiz types)
      description: >
        Per-lesson/lecture `questionCounter` is the contract-v2 answered/total counter — DISPLAY
        ONLY, never locks retakes. University trees additionally list the quiz types available.


        **BEHAVIOURAL CHANGE in 2.3.0-m1 (adr-091).** The subject is gated by **release only** — see
