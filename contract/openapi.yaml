        and `acceptTerms` records — so what the student reads is what they accept.
        `contentMarkdown` is the approved text verbatim (Markdown, including its own `# ` title line);
        `title` is that heading's text. Cacheable: `Cache-Control: public, max-age=3600` and a strong
        `ETag`; send `If-None-Match` to get `304`. When no Terms version is configured the feature is
        inert and the answer is `404 legal_document_unavailable` — never an empty 200. Under the
        `/reference` per-address limit.
      security: []
