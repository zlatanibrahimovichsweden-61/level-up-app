          description: The cursor is at or past `lastReadMessageId`.
        '400':
          description: "`validation_failed` — `lastReadMessageId` missing or not a UUID (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`conversation_not_found` (as on `sendChatMessage`) · `message_not_found` — `lastReadMessageId` is not an unexpired message of this conversation."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 30 chat writes (edit, delete, read, reports) per student per 60 seconds. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /message-reports:
    post:
      tags: [chat]
      x-stability: stable
      x-behaviour-changed: '3.43.0-m1'
      operationId: reportChatMessage
      summary: Report a message the caller received
      description: >
        Recipient only: a student cannot report their own message. Messages deleted for everyone
        and edited messages are reportable — the server keeps an evidence copy of the stored text and
        every earlier version, which the message's own expiry and the conversation's deletion never
        remove (adr-196 D4). There are no reasons and no free text. Idempotent: a repeat report of
        the same message is also `202` and stores nothing new. **Report before block:** block
        deletes the conversation, so an app offering "report and block" calls this first.
        A forwarded-question card cannot be reported — its content comes from the question bank, not from the friend: `404 message_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportChatMessageRequest' }
      responses:
        '202':
          description: Reported (or already reported).
        '400':
          description: "`validation_failed` — `conversationId` or `messageId` missing or not a UUID (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`message_not_found` — no such unexpired message, received by the caller, in a conversation the caller is in (unknown, foreign, own and expired messages are indistinguishable). A forwarded-question card is also `message_not_found` (spec-056)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 30 chat writes (edit, delete, read, reports) per student per 60 seconds. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /student-reports:
    post:
      tags: [chat]
      x-stability: stable
      operationId: reportStudent
      summary: Report a student
      description: >
        🔴 **`202` for every well-formed id** — an unknown id, the caller's own id, a blocked student
        and a student on the other Track all get the identical answer, so this is not an existence
        oracle (adr-196 D4). A report is stored only for a real, different student, at most once per
        (reporter, reported); a repeat stores nothing. No content is attached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentIdBody' }
      responses:
        '202':
          description: Accepted.
        '400':
          description: "`validation_failed` — `studentId` missing or not a UUID (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 30 chat writes (edit, delete, read, reports) per student per 60 seconds. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /conversations/{conversationId}/forwarded-questions:
    post:
      tags: [chat]
      x-stability: stable
      x-behaviour-changed: '3.45.0-m1'
      operationId: forwardQuestion
      summary: Forward a question the caller has answered to the friend this conversation belongs to, as a card
      description: >
        spec-056 / adr-219. Creates ONE chat message of `kind: forwardedQuestion` in this
        conversation and returns it. Only a question the caller has already answered in one of their
        own quizzes, on their current Track, can be forwarded (FS-7); every other id is one identical
        `422 question_not_forwardable`. The card follows every chat rule: it expires like a text
        message (adr-196 D1), it disappears with the conversation when the friendship ends, the
        friend receives `messageCreated` on the `chat` hub, and a push request of kind
        `ChatMessageReceived` is made exactly as for a text message (inert until push delivery is
        enabled). 🔴 **A forward never reveals anything about the friend's plan:** it succeeds or
        fails the same way whether or not the friend holds a `baseSubscription` — a free-plan friend
        can open and answer the card too (Seif 2026-10-07; see `answerForwardedQuestion`).
        **Idempotent by `clientMessageId`**, with exactly `sendChatMessage`'s replay rule: a replay
        returns `200` with the message that `clientMessageId` originally created (the replayed
        `questionId` is not compared), never creates a second card and never counts against the
        daily limit; a replay of a message that has since expired or that you deleted for yourself
        is `400 validation_failed` on `clientMessageId`. Limits: at most 100 forwards per student
        per Africa/Cairo calendar day (FS-8); you cannot send the same question to the same friend
        again while YOUR earlier card for it is still unanswered (since 3.45.0-m1 this is per sender:
        another friend's unanswered card for the same question never blocks your forward, and the
        friend can then hold one card per forwarding friend); and each forward also spends one unit
        of the `sendChatMessage` budget (45 per 60 s, shared).
        Checked in this order: `400`, `404`, the replay `200`, `422`, `409`, `429`.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardQuestionRequest' }
      responses:
        '200':
          description: A replay of an already-stored `clientMessageId` — the original message, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '201':
          description: Forwarded. The card as the caller (the forwarder) sees it. No `Location` header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: "`validation_failed` — `clientMessageId` or `questionId` missing or not a UUID, or a replay of a message that is no longer visible to the caller (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`conversation_not_found` — unknown, malformed, not the caller's, ended, or read-only after the peer's erasure; all indistinguishable (adr-196 G-5)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`forwarded_question_already_pending` — you already sent this question to this friend and that card is still unanswered (since 3.45.0-m1 only YOUR own earlier card counts; another friend's card for the same question never causes this). Nothing was written."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '422':
          description: "`question_not_forwardable` — the question is unknown, not yet answered by the caller, or not on the caller's current Track; all indistinguishable. Nothing was written. (A `questionId` that is not a UUID is the `400` above.)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`forward_daily_limit_reached` — 100 forwards already today (Africa/Cairo day); `Retry-After` = seconds until the next Cairo midnight. · `rate_limited` — the shared 45-per-60-s chat send budget (adr-196 D8); honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /conversations/{conversationId}/messages/{messageId}/answer:
    post:
      tags: [chat]
      x-stability: stable
      operationId: answerForwardedQuestion
      summary: Answer a forwarded-question card the friend sent the caller
      description: >
        spec-056 / adr-203 / adr-204 / adr-219. Recipient only, one committed answer per card.
        Grading is server-side. The response carries the card in the caller's own view, now with
        `selectedOptionId`, `correct` and `correctOptionId` (FS-6: revealed only after the commit),
        and the pair's friend streak. **Any committed answer, right or wrong, advances the friend
        streak** — at most once per friend pair per Africa/Cairo day, in either direction (adr-203);
        a second answer the same day leaves the count unchanged. **Points (Seif 2026-10-07):** a
        correct answer earns **+1** into the pool of the card's Track, but only the FIRST time the
        caller answers that question correctly through any forwarded card — a question forwarded to
        the caller again, by the same or another friend, never pays twice; a wrong answer earns 0.
        The award is made server-side with an audit ledger row, after the answer is stored; the
        response carries no points field, so re-read the caller's standing where points are shown.
        **Free plan (Seif 2026-10-07):** a student without an active `baseSubscription` can open and
        answer a card; each answer spends one unit of the weekly 50-question allowance (nothing if
        that question was already delivered to them this week), and an exhausted allowance is
        `403 weekly_question_limit_reached` with nothing written. **Idempotent:** once the card is
        answered, every later call returns `200` with the ORIGINAL result and the current streak; the
        replayed `optionId` is not compared, the streak never moves twice, no allowance unit is
        spent again and no point is awarded twice. The friend receives `forwardedQuestionAnswered`
        (their own view: answered and right/wrong only) and both of you receive
        `friendStreakChanged` when the streak took today's step. Checked in this order: `400`
        (shape), `404 conversation_not_found`, `404 message_not_found`, replay `200`,
        `404 message_not_found` (the question can no longer be shown), `400` (option), `403
        weekly_question_limit_reached`, then the answer.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerForwardedQuestionRequest' }
      responses:
        '200':
          description: Answered (or the original result on a replay).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerForwardedQuestionResult' }
        '400':
          description: "`validation_failed` — `optionId` missing, not a UUID, or not one of this question's options (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`weekly_question_limit_reached` — the caller is on the free plan and this week's 50-question allowance is used up; nothing was written, and the card can be answered once the allowance resets at the start of the next Africa/Cairo week. · `account_pending_deletion` — inside the deletion grace window (adr-114). Read `code`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`conversation_not_found` — unknown, malformed, not the caller's, or ended (adr-196 G-5). · `message_not_found` — unknown id, not a forwarded-question card, a card the caller sent, deleted for everyone, expired, or its question can no longer be shown; all indistinguishable."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — the chat write budget (30 per 60 s per student). Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /friend-streaks:
    get:
      tags: [social]
      x-stability: stable
      operationId: listMyFriendStreaks
      summary: The caller's live friend streaks (cursor-paginated)
      description: >
        adr-203: one combined friend-streak counter per friend pair (the flame count on the
        conversation row). A forwarded-question answer by either friend takes the pair's step for
        the day; at most one step per pair per Africa/Cairo calendar day; a Cairo day with no step
        breaks the streak to 0 (no grace). **Only live streaks are listed:** a pair appears when its
        last step was today or yesterday (Cairo); every other friend has no streak — render none. A
        streak ends for good when the friendship ends (unfriend, block, Track transfer) and is not
        restored on re-friending. Only the two friends ever see their streak (FS-9); no other
        operation returns it. Ordered by `friendStudentId` ascending.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of the caller's live friend streaks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FriendStreak' }
        '400':
          description: "`validation_failed` — a malformed `cursor` or a `limit` outside 1–100 (field map in `errors`); request page one again"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (~15 min). 401 `authentication_required` → refresh; 401 `session_superseded` → forced logout.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque (base64 keyset). Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100, minimum: 1 }
  schemas:
    ProblemDetails:
      type: object
      description: >-
        RFC 9457 + Level Up extensions (ADR-026 §5). Error responses the API writes normally have
        this shape. Some failures carry no body, or a body without `code`: a failure while the
        response is being written, a host shutdown, a request whose `Accept` excludes JSON, a
        non-API endpoint such as `/health/ready`, or a proxy/edge response such as
        `502`/`503`/`504`. A non-2xx without a parsable body and `code` is an unknown outcome;
        treat it like `internal_error`. Send `Accept: application/json` (or
        `application/problem+json`).
      properties:
        type: { type: string }
        title: { type: string, description: Developer-facing English. Never shown to users. }
        status: { type: integer }
        detail: { type: string, description: Developer-facing English. Never shown to users. }
        code: { type: string, description: "Stable machine code from error-codes.md, e.g. otp_expired. The client maps this to AR/EN copy." }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Field → messages (validation_failed only)
        traceId: { type: string }
      required: [title, status, code]
    CursorPage:
      type: object
      description: The one open-ended-list wrapper (ADR-026 §6). items' type varies per endpoint.
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, "null"], description: Opaque. Absent/null = no more pages. }
        hasMore: { type: boolean }
      required: [items, hasMore]
    SupportTicketStatus:
      type: string
      description: >
        `open`, `in_progress`, `pending` or `closed` today. `in_progress` and `pending` are set only
        by Customer Service (spec-045 P-1); a student never chooses a status, and a reply from either
        side never changes it. `closed` is final: there is no reopen.


        **Clients MUST tolerate an unknown `status` value**: more statuses
        may be added later without a version break (spec-045 D4), so treat any value you do not
        recognise as "in progress — not closed" rather than failing to parse the ticket. Only
        `closed` means the ticket takes no reply.
      example: open
    SupportTicketReference:
      type: string
      description: >
        The human-readable ticket number the student can quote to Customer Service, formatted `TK-{n}`
        with no padding (spec-045 P-5). **A display label, never an id**: it is not accepted as a path
        parameter anywhere, and `ticketId` stays the only handle the API takes.
      example: TK-123
    SupportTicketSummary:
      type: object
      description: One row of the caller's ticket list.
      properties:
        ticketId: { $ref: '#/components/schemas/Uuid' }
        reference: { $ref: '#/components/schemas/SupportTicketReference' }
        subject: { type: string }
        status: { $ref: '#/components/schemas/SupportTicketStatus' }
        createdAt: { type: string, format: date-time }
        lastActivityAt:
          type: string
          format: date-time
          description: The ticket's creation or its latest reply, whichever is later — the list's sort key.
      required: [ticketId, reference, subject, status, createdAt, lastActivityAt]
    SupportTicket:
      type: object
      description: >
        One of the caller's tickets. `details` is the opening text. No category, priority or assignee is
        exposed (spec-045 D3); the human-readable `reference` is (spec-045 P-5). Any later field arrives
        additively.
      properties:
        ticketId: { $ref: '#/components/schemas/Uuid' }
        reference: { $ref: '#/components/schemas/SupportTicketReference' }
        subject: { type: string }
        details: { type: string }
        status: { $ref: '#/components/schemas/SupportTicketStatus' }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        closedAt:
          type: [string, "null"]
          format: date-time
          description: When the ticket was closed; `null` while it is not closed.
        attachments:
          type: array
          description: The ticket's OPENING photos (spec-067), oldest first; empty when none. Photos sent with replies are on those replies.
          items: { $ref: '#/components/schemas/SupportAttachment' }
      required: [ticketId, reference, subject, details, status, createdAt, lastActivityAt, closedAt, attachments]
    SupportTicketMessage:
      type: object
      description: >
        One reply in a ticket's thread. Carries no staff identity or role: a `staff` message is shown
        as "Customer support".
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        authorKind: { type: string, enum: [student, staff] }
        body: { type: string, description: "May be an empty string on a photo-only student reply (spec-067)." }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          description: The photos sent with this reply (spec-067), oldest first; empty when none, and always empty on a staff reply.
          items: { $ref: '#/components/schemas/SupportAttachment' }
      required: [messageId, authorKind, body, createdAt, attachments]
    CreateSupportTicketRequest:
      type: object
      properties:
        subject: { type: string, minLength: 1, maxLength: 120, description: Trimmed server-side; the limits apply after trimming. }
        details: { type: string, minLength: 1, maxLength: 4000, description: Trimmed server-side; the limits apply after trimming. }
        attachmentIds:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Optional (spec-067). Up to 3 of the caller's own `ready`, unattached photos, as their `attachmentId`s.
          items: { $ref: '#/components/schemas/Uuid' }
      required: [subject, details]
    PostSupportTicketMessageRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 4000
          description: >
            Trimmed server-side; the limits apply after trimming. 1–4000 characters, except that it may be
            an EMPTY string when `attachmentIds` holds at least one photo (spec-067 photo-only reply).
        attachmentIds:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Optional (spec-067). Up to 3 of the caller's own `ready`, unattached photos, as their `attachmentId`s.
          items: { $ref: '#/components/schemas/Uuid' }
      required: [body]
    SupportAttachment:
      type: object
      description: >
        One support photo (spec-067). No digest, storage key or URL is ever returned: read the bytes with
        `getMySupportAttachmentContent`. A student cannot delete a photo; they ask Customer Service in a reply.
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        contentType: { type: string, description: "`image/jpeg`, `image/png` or `image/webp` — the verified type." }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          description: >
            `ready`, `expired` (deleted 90 days after the ticket closed) or `removed` (removed by Customer
            Service, or failed its integrity check) today. **Clients MUST tolerate an unknown value** and treat
            it as "not available".
          example: ready
        createdAt: { type: string, format: date-time }
      required: [attachmentId, contentType, sizeBytes, status, createdAt]
    CreateSupportAttachmentUploadRequest:
      type: object
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp], description: The photo's real type; it is verified against the bytes. }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 7000000, description: "The exact byte length of what will be PUT. Above 7,000,000 is `413 image_too_large`." }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: The hex SHA-256 of exactly the bytes that will be PUT. }
      required: [contentType, sizeBytes, sha256]
    SupportAttachmentUpload:
      type: object
      description: The `createSupportAttachmentUpload` answer — the photo's id and where to PUT its bytes.
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        upload:
          type: object
          properties:
            method: { type: string, enum: [PUT] }
            url: { type: string, format: uri, description: A presigned, short-lived write URL for this one private object. Never log or share it. }
            headers:
              type: object
              additionalProperties: { type: string }
              description: >
                Send EVERY header here verbatim with the PUT (`Content-Type`, `Content-Length`,
                `x-amz-checksum-sha256`, `x-amz-acl`); they are part of the signature.
            expiresAt: { type: string, format: date-time, description: The URL stops working at this instant (at most 15 minutes after issue). }
          required: [method, url, headers, expiresAt]
      required: [attachmentId, upload]
    Uuid:
      type: string
      format: uuid
      description: UUIDv7, opaque to the client (ADR-026 §7).
      example: "0197b2f3-8a11-7cc3-9b4e-3f2a1d6e8c01"
    Phone:
      type: string
      description: E.164 with country code.
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: "+201001234567"
    DeviceInfo:
      type: object
      description: Client-generated STABLE id (survives app restarts, regenerated on reinstall) — the device-binding key (adr-019).
      properties:
        deviceId: { type: string, maxLength: 64 }
        platform: { type: string, enum: [android, ios] }
        model: { type: string, maxLength: 100, description: "Display label for eviction messaging, e.g. \"Redmi Note 12\"." }
      required: [deviceId, platform]
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: "JWT, ~15 min." }
        accessExpiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Rotates on every refresh; TTL 60 days. }
        refreshExpiresInSeconds: { type: integer, example: 5184000 }
      required: [accessToken, accessExpiresInSeconds, refreshToken, refreshExpiresInSeconds]
    AuthenticatedResult:
      type: object
      properties:
        result: { type: string, enum: [authenticated] }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        profile: { $ref: '#/components/schemas/StudentProfile' }
        inviteCodeApplied:
          type: boolean
          description: >
            Only on `completeRegistration`, and only when the request carried `inviteCode` — absent
            otherwise and absent on every other operation that returns this schema. `true`: the code was
            recognised and the student who shared it is recorded as your inviter. `false`: the code was
            not used; your account was created anyway. Never says why, and never names the inviter.
      required: [result, tokens, profile]
    RegistrationRequiredResult:
      type: object
      description: New phone — no account. Proceed to POST /auth/register within expiresInSeconds.
      properties:
        result: { type: string, enum: [registrationRequired] }
        registrationToken: { type: string }
        expiresInSeconds: { type: integer, example: 600 }
      required: [result, registrationToken, expiresInSeconds]
    EducationSystem:
      type: string
      description: Extensible — new values may appear additively (STEM future); clients must tolerate unknown values.
      enum: [nationalArabic, nationalLanguages, ig, american, ib]
    Stage:
      type: string
      enum: [prep1, prep2, prep3, secondary1, secondary2, secondary3]
    SchoolRegistration:
      type: object
      description: >
        City (adr-028 §1 — supersedes adr-010's rejection of free-text city): `cityId` (coded,
        from `/reference/cities`, preferred) OR `cityName` (free text, max 100 — the "my city
        isn't listed" fallback). At least one is required; supplying both → `validation_failed`.
        Registration is never blocked by a missing city row.


        School (adr-028 §2 — supersedes adr-010's Egypt-required schoolId): `schoolId` is
        OPTIONAL for every school-track student, Egypt included — pick from the coded list
        (`/reference/schools`) if the school is there, omit it if not. Free-text `schoolName`
        does not exist on this contract; unverifiable strings buy no feature.


        `governorateId` conditionality is unchanged from adr-010: required when `countryCode` is
        EG (`requiresGovernorate: true` on `/reference/countries`), forbidden otherwise.
        Violations → `validation_failed` with a field map.
      properties:
        track: { type: string, enum: [school] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string, example: "EG" }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        schoolId: { $ref: '#/components/schemas/Uuid', description: Optional for every school student (adr-028 §2 — no longer Egypt-required). Omit if the school isn't in the coded list — including when the student is outside Egypt. }
        stage: { $ref: '#/components/schemas/Stage' }
        educationSystem: { $ref: '#/components/schemas/EducationSystem' }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email, description: "Optional — receipts/notifications only, never login (adr-019)." }
        avatarId: { $ref: '#/components/schemas/Uuid', description: One of the 20 defaults; omit for server default. }
        inviteCode:
          type: string
          description: >
            OPTIONAL (spec-047; `stable` since 3.44.0-m1). The code a friend
            shared from their Refer a Friend screen (`getMyInvite`). Case, spaces and hyphens are
            ignored. It NEVER fails registration: an unknown, malformed or unusable code still creates
            the account, and `inviteCodeApplied: false` says so (with no reason). The friend who shared
            it is credited server-side; nothing about them is returned to you. Only a string is
            accepted (any other JSON type is `validation_failed`).
      required: [track, registrationToken, device, name, dateOfBirth, countryCode, stage, educationSystem, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    UniversityRegistration:
      type: object
      description: >
        Egypt-only by shape (no country field — adr-010). Years/faculties are data-driven ids
        from /reference/universities. City (adr-028 §1 — same rule as SchoolRegistration):
        `cityId` (coded, preferred) OR `cityName` (free text, max 100 — "my city isn't listed"
        fallback). At least one is required; supplying both → `validation_failed`.
      properties:
        track: { type: string, enum: [university] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        universityId: { $ref: '#/components/schemas/Uuid' }
        facultyId: { $ref: '#/components/schemas/Uuid' }
        studyYearId: { $ref: '#/components/schemas/Uuid', description: Must be an `active` year (soon → validation_failed). }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email }
        avatarId: { $ref: '#/components/schemas/Uuid' }
        inviteCode:
          type: string
          description: >
            OPTIONAL (spec-047; this field is `draft` — send it only once it is `stable`, because an
            older backend refuses unknown properties with `validation_failed`). The code a friend
            shared from their Refer a Friend screen (`getMyInvite`). Case, spaces and hyphens are
            ignored. It NEVER fails registration: an unknown, malformed or unusable code still creates
            the account, and `inviteCodeApplied: false` says so (with no reason). The friend who shared
            it is credited server-side; nothing about them is returned to you. Only a string is
            accepted (any other JSON type is `validation_failed`).
      required: [track, registrationToken, device, name, dateOfBirth, universityId, facultyId, studyYearId, governorateId, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    MyInvite:
      type: object
      properties:
        code:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{8}$'
          description: Eight characters (digits and capital letters without I, L, O, U). Show it exactly; input elsewhere is case-insensitive.
        friendsJoined:
          type: integer
          minimum: 0
          description: New accounts that registered with this code. Stays counted if that student later deletes their account.
        pointsEarned:
          type: integer
          minimum: 0
          description: >
            Points this code has earned the caller (10 per credited friend). It can be lower than
            10 × friendsJoined (no credit while the caller had no active enrolment), and a new credit
            appears a few moments after the friend registers (it is applied in the background).
      required: [code, friendsJoined, pointsEarned]
    NamedRef:
      type: object
      description: Generic bilingual reference row (governorate, city, school).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nameAr: { type: string }
        nameEn: { type: string }
      required: [id, nameAr, nameEn]
    StudentProfile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        track: { type: string, enum: [school, university] }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, "null"], format: email }
        dateOfBirth: { type: string, format: date }
        avatar:
          type: object
          properties:
            type: { type: string, enum: [default, custom] }
            id: { $ref: '#/components/schemas/Uuid', description: Present for default avatars; absent for `custom`. }
            url:
              type: string
              format: uri
              description: >
                For `custom` (spec-070) the student's own photo on the avatars CDN — a NEW url on every upload, so
                never cache by url across uploads; clients must not assume the default-avatar host.
          required: [type, url]
        geography:
          type: object
          properties:
            countryCode: { type: string, example: "EG" }
            governorate: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }] }
            city:
              description: >
                Union (adr-028 §1): a `NamedRef` (has `id`) when the student picked a coded
                city, or `{ name }` free text when they used the "my city isn't listed"
                fallback. Always present — every student has a city, one way or the other.
              oneOf:
                - $ref: '#/components/schemas/NamedRef'
                - type: object
                  properties:
                    name: { type: string, maxLength: 100 }
                  required: [name]
          required: [countryCode, city]
        school:
          type: [object, "null"]
          description: School-track block (null for university students).
          properties:
            school: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }], description: Coded school (adr-028 §2 — optional; null if the student didn't pick one — Egypt included). }
            stage: { $ref: '#/components/schemas/Stage' }
            educationSystem: { $ref: '#/components/schemas/EducationSystem' }
            parentReportStatus:
              type: string
              enum: [active, inactive]
              description: >
                adr-165 D7 — the ACTUAL parent-report status. `active` only once parent-report delivery is
                switched on AND the delivery mode is `Production`; `inactive` otherwise. An `Allowlisted`
                (staging) run reports `inactive` even with delivery switched on, so it can never tell a household
                that reports are live. There is deliberately no pending state: no parent-side opt-in exists, so
                there is nothing to pend on. School track only; the whole `school` block is null for university
                students.
          required: [stage, educationSystem]
        university:
          type: [object, "null"]
          description: University-track block (null for school students).
          properties:
            university: { $ref: '#/components/schemas/NamedRef' }
            faculty: { $ref: '#/components/schemas/NamedRef' }
            yearNumber: { type: integer }
            termId: { $ref: '#/components/schemas/TermId' }
            termNumber: { $ref: '#/components/schemas/TermNumber' }
          required: [university, faculty, yearNumber]
        points:
          type: object
          description: Server-authoritative (adr-003 dual pools). Never computed client-side.
          properties:
            school: { type: integer }
            university: { type: integer }
            total: { type: integer }
          required: [school, university, total]
        level: { type: integer, description: "1–12, thresholds every 500 points; static, not configurable." }
        badges: { type: integer, description: "Post-level-12 badges (every 5,000 points; first at 11,000)." }
        privacy:
          type: object
          description: adr-023 toggles; defaults preserve visible behavior.
          properties:
            leaderboardVisible: { type: boolean, default: true }
            scoreHidden: { type: boolean, default: false }
          required: [leaderboardVisible, scoreHidden]
        entitlements:
          type: array
          description: Read-only embed for first paint; the entitlement-state source of truth is GET /me/entitlements.
          items: { $ref: '#/components/schemas/EntitlementState' }
        createdAt: { type: string, format: date-time }
        pendingDeletion:
          type: object
          description: >
            Present ONLY while an account-deletion request is pending (adr-114). **Absent
            otherwise — never `null`**, so presence is the flag: if the key is there, draw the
            cancel screen. Not in `required`, and adding it does not change any existing field.
          properties:
            effectiveAt: { type: string, format: date-time, description: "UTC — erasure runs no earlier than this. Cancel with DELETE /me/deletion-request before then." }
          required: [effectiveAt]
      required: [id, track, name, phone, dateOfBirth, avatar, geography, points, level, badges, privacy, entitlements, createdAt]
    EntitlementType:
      type: string
      description: Extensible set (adr-018) — clients must tolerate unknown values additively.
      enum: [baseSubscription, flashcardSubscription]
    EntitlementState:
      type: object
      properties:
        type: { $ref: '#/components/schemas/EntitlementType' }
        active: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
        inGrace: { type: boolean, description: 2-day grace after expiry (requirements §5). }
        graceEndsAt: { type: [string, "null"], format: date-time }
      required: [type, active, inGrace]
    TermId:
      type: [string, "null"]
      format: uuid
      description: >
        Opaque id of the term (adr-036). **Nullable, and null is normal** — null for every
        school-track resource, and null on a university profile during the summer gap or when the
        cohort has no schedule row. Opaque per adr-026 §7: do NOT hardcode term ids or derive an
        order from them — order and label on `termNumber`.
    TermNumber:
      type: [integer, "null"]
      description: >
        The term's ordinal within the academic year — `1` or `2` today (adr-036 §1 keeps the door
        open to more). Null exactly when `termId` is null. This is the ONLY orderable/labellable
        term signal on the wire: term NAMES are never sent, so the client renders its own localized
        AR/EN label, per adr-026 §5. Needed because a year-long course is two subjects with the same
        `name` (adr-036 §2).
    FlashcardSelfGrade:
      type: string
      description: >
        The two self-grades. **A CLOSED set, unlike `EntitlementType`** — the server stores the
        latest value per (student, card) and the client filters on `again`; a third value would
        render as neither and decides product behaviour nobody has specified.
      enum: [gotIt, again]
    FlashcardCard:
      type: object
      description: One flashcard as the study surface serves it (spec-028).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        front: { type: string, description: The prompt side. }
        back:
          type: string
          description: >
            The answer side. **Free multi-line text, and it may hold several answers** — render it as
            a block, not as a single label.
        imageUrl:
          type: [string, "null"]
          description: >
            Absolute CDN URL for the card's image, or `null`. **`null` is normal and is the answer in
            every environment today** — no card-image CDN origin is provisioned anywhere. Do not treat
            it as an error or as a missing image. When a value does appear it is content-addressed and
            immutable: a corrected image produces a DIFFERENT URL, never new bytes at the same one, so
            it is safe to cache forever.
        selfGrade:
          oneOf:
            - $ref: '#/components/schemas/FlashcardSelfGrade'
            - type: "null"
          description: >
            YOUR latest grade for this card, or `null` if you have never graded it. It is a property
            of the reader, not of the card — two students holding the same page see different values.
      required: [id, front, back, imageUrl, selfGrade]
    QuestionCounter:
      type: object
      description: Contract-v2 per-lesson/lecture counter — display only, never locks retakes.
      properties:
        answered: { type: integer, description: Distinct questions this student has ever answered in scope. }
        total: { type: integer }
      required: [answered, total]
    SchoolSubjectTree:
      type: object
      properties:
        track: { type: string, enum: [school] }
        units:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                        required: [id, name, questionCounter]
                  required: [id, name, lessons]
            required: [id, name, chapters]
      required: [track, units]
    UniversitySubjectTree:
      type: object
      properties:
        track: { type: string, enum: [university] }
        quizTypes:
          type: array
          items: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision] }
        lectures:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
              hasFlashcards:
                type: boolean
                description: >
                  Whether this lecture has at least one active flashcard — the signal that decides
                  whether to draw the Flashcards affordance. **Content presence, never subscription
                  state**: it is `true` for a free student too, and tapping through then hits the
                  weekly preview or `403 flashcard_subscription_required` on
                  `getFlashcardsForLecture`. A faculty whose whole tree returns `false` everywhere
                  has no flashcard content, and the surface should not be offered at all.


                  Added additively in `3.12.0-m1`. **It is NOT on `SchoolSubjectTree` and never will
                  be** — flashcards are university-track only, and a school tree carries no signal
                  that they exist.
              flashcardCount:
                type: integer
                minimum: 0
                description: >
                  The number of ACTIVE flashcards this lecture holds at read time (archived cards
                  excluded). Informational and uncharged: it is not a reservation, not the student's
                  remaining weekly allowance, not a round size, and it is independent of
                  subscription state. `hasFlashcards` is exactly `flashcardCount > 0`. The study
                  round still follows `getFlashcardsForLecture`'s `hasMore`. University track only;
                  never on `SchoolSubjectTree`.


                  Added additively in `3.27.0-m1` (spec-049).
            required: [id, name, questionCounter, hasFlashcards, flashcardCount]
      required: [track, quizTypes, lectures]
    SchoolMistakesTree:
      type: object
      description: >
        The school Mistakes tree — PRUNED and SUMMED. Deliberately not `SchoolSubjectTree`: that one
        is the whole catalogue with an answered/total counter, this one is only the branches the
        student currently has mistakes in.
      properties:
        track: { type: string, enum: [school] }
        mistakeCount:
          type: integer
          minimum: 0
          description: Sum over the whole subject. `0` exactly when `units` is empty.
        units:
          type: array
          description: >
            Only units containing at least one mistake. May be EMPTY — that is a normal response for
            an in-scope subject the student has nothing outstanding in.
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              mistakeCount: { type: integer, minimum: 1, description: Sum over this unit's chapters. }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    mistakeCount: { type: integer, minimum: 1, description: Sum over this chapter's lessons. }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          mistakeCount: { type: integer, minimum: 1 }
                        required: [id, name, mistakeCount]
                  required: [id, name, mistakeCount, lessons]
            required: [id, name, mistakeCount, chapters]
      required: [track, mistakeCount, units]
    UniversityMistakesTree:
      type: object
      description: >
        The university Mistakes tree — PRUNED. There is deliberately no `quizTypes` here, unlike
        `UniversitySubjectTree`: a mistakes tree is a history view, not a quiz-build tree.
      properties:
        track: { type: string, enum: [university] }
        mistakeCount:
          type: integer
          minimum: 0
          description: Sum over the whole subject. `0` exactly when `lectures` is empty.
        lectures:
          type: array
          description: Only lectures containing at least one mistake. May be EMPTY.
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              mistakeCount: { type: integer, minimum: 1 }
            required: [id, name, mistakeCount]
      required: [track, mistakeCount, lectures]
    QuizQuestion:
      type: object
      description: NO correct answer here — grading is server-side on submit.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        text: { type: string, description: Plain text; only <u>…</u> markup allowed. }
        imageUrl: { type: [string, "null"], format: uri, description: "Full image (DO Spaces CDN, WebP). Composed from the configured CDN origin and a content-addressed object key; null when the question has no published image or the environment has no CDN origin configured." }
        thumbnailUrl: { type: [string, "null"], format: uri, description: "Deliberately null in every environment: no thumbnail rendition is generated yet. A value appears only after a future contract change announces it." }
        options:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              text: { type: string }
            required: [id, text]
        isFavorite: { type: boolean }
      required: [id, order, text, options, isFavorite]
    Quiz:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        quizType: { type: [string, "null"], enum: [normal, midTermRevision, finalRevision, practicalRevision, null], description: University only. }
        scopeName: { type: string, description: Lesson/lecture display name (or "Retake wrong"/"Favorites" client-side by mode). }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        createdAt: { type: string, format: date-time }
      required: [id, mode, scopeName, questions, createdAt]
    AnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        correctOptionId: { $ref: '#/components/schemas/Uuid' }
        pointsDelta: { type: integer, description: "0 or 1 (server-side award; 0 on retry replay or free-plan edge)." }
        explanationAvailable:
          type: boolean
          description: >-
            Whether an AI explanation surface exists for this question — i.e. whether GET
            /questions/{questionId}/explanation would answer 200 or 202. Render the Explain
            affordance when true; when false, do not render it and do not call the endpoint.
            INDEPENDENT OF SUBSCRIPTION STATE (the hasFlashcards pattern): a free student sees true
            too, and the tap yields 403 subscription_required with the approved popup copy. It is
            true after correct AND incorrect answers alike. It reads false wherever the feature is
            not enabled for the question's track, and false everywhere while the surface is
            withdrawn.
      required: [correct, correctOptionId, pointsDelta, explanationAvailable]
    QuizSummary:
      type: object
      properties:
        quizId: { $ref: '#/components/schemas/Uuid' }
        score: { type: integer, description: Correct answers. }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        pointsAwarded: { type: integer }
        leveledUp:
          type: boolean
          description: >
            Whether THIS attempt's awards crossed a level threshold. An EVENT, frozen on the attempt
            when it happened — it never changes afterwards, and a later quiz cannot turn it on or off.
            The student's CURRENT level and total are state, not events: read them from GET /me.
        newBadge:
          type: boolean
          description: >
            Whether THIS attempt's awards earned a badge. Frozen at the moment it happened, on the
            same rule as leveledUp.
        questions:
          type: array
          description: Recap rows (full review at GET /quizzes/{id}).
          items:
            type: object
            properties:
              questionId: { $ref: '#/components/schemas/Uuid' }
              answered: { type: boolean }
              correct: { type: [boolean, "null"], description: null when unanswered. }
            required: [questionId, answered]
      required: [quizId, score, totalQuestions, answeredCount, pointsAwarded, leveledUp, newBadge, questions]
    QuizHistoryItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string, description: "The CURRENT subject name for a normal-mode quiz; an empty string for retakeWrong and favorites quizzes (they span subjects) and when the subject can no longer be resolved." }
        scopeName: { type: string }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
      required: [id, subjectName, scopeName, mode, score, totalQuestions, finishedAt]
    QuizReview:
      type: object
      description: Post-completion review — the student's answer per question, and the correct answer for each question they answered (adr-017, adr-178).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: [string, "null"], description: "The CURRENT subject name for a normal-mode quiz; null for retakeWrong and favorites quizzes (they span subjects) and when the subject can no longer be resolved." }
        scopeName: { type: string }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuizQuestion'
              - type: object
                properties:
                  selectedOptionId: { type: [string, "null"], description: null = unanswered. }
                  correctOptionId: { type: [string, "null"], format: uuid, description: "The current correct option — present ONLY when the student answered this question (selectedOptionId != null); null on every unanswered question (adr-178 D1)." }
                  correct: { type: [boolean, "null"], description: "The verdict recorded at submit time, never recomputed; null when unanswered." }
                  explanationAvailable: { type: boolean, description: "The same value AnswerResult.explanationAvailable carries for this question and track. Always false on an unanswered question: an explanation is only served for a question the caller answered." }
                required: [correctOptionId, explanationAvailable]
      required: [id, subjectName, scopeName, score, totalQuestions, finishedAt, questions]
    LeaderboardEntry:
      type: object
      description: >-
        Privacy-filtered (adr-023, adr-111): neither invisible students, score-hidden students,
        nor students blocked in either direction with the caller (adr-185 D8) ever appear. Every row that IS emitted shows points — suppression removes the row, not the
        score — which is why `points` is required.
      properties:
        rank:
          type: integer
          description: >-
            Dense rank over VISIBLE students, where *visible* means NEITHER `leaderboardVisible:
            false` NOR `scoreHidden: true` (adr-111), and not blocked in either direction with the caller
            (adr-185 D8). Excluded students are removed from the rank
            population, so the ranks around them close and leave no gap. It is the student's exact
            position in that population, NOT a position within the page — so on a board with more
            than 200 visible students the last row this endpoint will ever render is `rank: 200`.
            Since 3.2.0-m1 it AGREES with `GET /leaderboard/me`'s `rank` by construction; the two
            are computed over the same population and cannot differ.
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
        points: { type: integer }
        isMe: { type: boolean }
      required: [rank, studentId, name, avatarUrl, points, isMe]
    StudentCard:
      type: object
      description: >
        Another student as the friend-graph surfaces show them — suggestions, phone lookup, requests
        and blocks. Name and avatar only: never points, level or any phone digits (adr-185 D4/D5).
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
      required: [studentId, name, avatarUrl]
    Friend:
      type: object
      description: One of the caller's friends.
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
        level:
          type: integer
          description: The friend's level — the same number the friend sees as `level` on their own `GET /me`.
        points:
          type: integer
          description: >
            The friend's points on their current Track (`school` or `university` pool, as their own
            `GET /me` shows it). OMITTED when the friend has `scoreHidden` (adr-023/111/113), and
            omitted whenever that setting cannot be read.
        friendsSince: { type: string, format: date-time }
      required: [studentId, name, avatarUrl, level, friendsSince]
    FriendRequest:
      type: object
      description: One pending friend request, seen from the caller's side.
      properties:
        requestId: { $ref: '#/components/schemas/Uuid' }
        direction:
          type: string
          enum: [incoming, outgoing]
          description: "`incoming` — sent to the caller; `outgoing` — sent by the caller."
        student: { $ref: '#/components/schemas/StudentCard' }
        createdAt: { type: string, format: date-time }
      required: [requestId, direction, student, createdAt]
    SendFriendRequestResult:
      type: object
      description: >
        `pending` — the request was created and `request` is present. `accepted` — the other student
        had already asked, so the two are now friends and `friend` is present (adr-185 D7).
      properties:
        status: { type: string, enum: [pending, accepted] }
        request: { $ref: '#/components/schemas/FriendRequest' }
        friend: { $ref: '#/components/schemas/Friend' }
      required: [status]
    PhoneLookupRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          description: The full E.164 number, e.g. `+201001234567`. Exact match only.
      required: [phone]
    PhoneLookupResult:
      type: object
      properties:
        student:
          oneOf:
            - $ref: '#/components/schemas/StudentCard'
            - type: 'null'
          description: The matching student, or `null` (see `lookupStudentByPhone`).
      required: [student]
    StudentIdBody:
      type: object
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
      required: [studentId]
    ChatPeer:
      type: object
      description: >
        The other participant of a conversation — the `StudentCard` shape, so never any phone digits
        (adr-185 D4). `studentId: null` means the peer's account was erased (adr-196 D3); `name` and
        `avatarUrl` are then null too, and the conversation is read-only (`canSend: false`). `name`
        and `avatarUrl` are also null while the peer cannot be shown (for example, their account is
        pending deletion); `studentId` is still set and sending still works.
      properties:
        studentId: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
      required: [studentId, name, avatarUrl]
    ChatMessage:
      type: object
      description: >
        One message: a text message (`kind: text`) or a forwarded-question card
        (`kind: forwardedQuestion`, spec-056, `stable` since 3.44.0-m1). `body` is null when
        `deletedForEveryone` is true (a tombstone) and is ALWAYS null for a card. A message is also
        a tombstone, with the same shape, when Support removed it after a report (spec-062
        `removeContent`); the client cannot tell the two apart and must not try. A message the caller
        no longer receives from `listConversationMessages` has expired — drop it.
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid' }
        sentByMe: { type: boolean }
        kind:
          type: string
          enum: [text, forwardedQuestion]
          description: >
            Branch on this first. New values may be added; render an unknown `kind` as a neutral
            "this message isn't supported in your version of the app" bubble — never as text and never
            as a crash.
        body:
          type: [string, "null"]
          maxLength: 500
          description: At most 500 Unicode scalar values (the server's count; `maxLength` is advisory — see `sendChatMessage`). Null for a tombstone and for every card.
        forwardedQuestion:
          oneOf:
            - $ref: '#/components/schemas/ForwardedQuestionCard'
            - type: 'null'
          description: Set exactly when `kind` is `forwardedQuestion` and the message is not deleted for everyone; null otherwise.
        sentAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        deletedForEveryone: { type: boolean }
      required: [messageId, conversationId, sentByMe, kind, body, forwardedQuestion, sentAt, editedAt, deletedForEveryone]
    ForwardQuestionRequest:
      type: object
      properties:
        clientMessageId:
          $ref: '#/components/schemas/Uuid'
          description: Generated by the app, one per forward, and re-sent unchanged on every retry (idempotency key; the same key space as `sendChatMessage`).
        questionId:
          $ref: '#/components/schemas/Uuid'
          description: A question the caller has already answered in one of their own quizzes (e.g. from a quiz review), on their current Track.
      required: [clientMessageId, questionId]
    AnswerForwardedQuestionRequest:
      type: object
      properties:
        optionId: { $ref: '#/components/schemas/Uuid' }
      required: [optionId]
    AnswerForwardedQuestionResult:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
          description: The answered card in the caller's own view (`selectedOptionId`, `correct` and `correctOptionId` set).
        friendStreak:
          oneOf:
            - $ref: '#/components/schemas/FriendStreak'
            - type: 'null'
          description: >
            The pair's live friend streak. Always set on a first answer (the answer took today's step,
            or the pair had already taken it). Null only on a replay made after the streak has since
            broken (no step on a later Cairo day).
      required: [message, friendStreak]
    ForwardedQuestionCard:
      type: object
      description: >
        A question a friend forwarded (spec-056). VIEWER-SPECIFIC — computed for the student reading
        it. Both friends see the question whenever `contentState` is `visible` (a free-plan student
        too — Seif 2026-10-07). The FORWARDER (`sentByMe: true`) sees, after the friend answers, only
        `answered`, `answeredAt` and `correct` (FS-6). The RECIPIENT sees `selectedOptionId` and
        `correctOptionId` only after their own committed answer. No field ever carries the correct
        answer before that.
      properties:
        questionId: { $ref: '#/components/schemas/Uuid' }
        contentState:
          type: string
          enum: [visible, unavailable]
          description: >
            `visible` — `question` is present. `unavailable` — the question can no longer be shown;
            render a neutral placeholder (answering it gives `404 message_not_found`). New values may
            be added; render an unknown value as `unavailable`.
        question:
          oneOf:
            - $ref: '#/components/schemas/ForwardedQuestionContent'
            - type: 'null'
          description: Present exactly when `contentState` is `visible`.
        answered: { type: boolean }
        answeredAt: { type: [string, "null"], format: date-time }
        correct:
          type: [boolean, "null"]
          description: Null until the recipient answers; then whether that answer was right. Visible to both friends.
        selectedOptionId:
          type: [string, "null"]
          format: uuid
          description: The recipient's own choice — only in the recipient's view, only after answering. Always null in the forwarder's view.
        correctOptionId:
          type: [string, "null"]
          format: uuid
          description: The correct option — only in the recipient's view, only after their committed answer (spec-038 reveal rule). Always null in the forwarder's view.
      required: [questionId, contentState, question, answered, answeredAt, correct, selectedOptionId, correctOptionId]
    ForwardedQuestionContent:
      type: object
      description: The question as the quiz shows it, WITHOUT the answer. Option ids are the ones `answerForwardedQuestion` accepts.
      properties:
        text: { type: string, description: Plain text; only <u>…</u> markup allowed. }
        imageUrl: { type: [string, "null"], format: uri, description: "Same rule as `QuizQuestion.imageUrl`." }
        options:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              text: { type: string }
            required: [id, text]
      required: [text, imageUrl, options]
    FriendStreak:
      type: object
      description: >
        The one combined friend streak (adr-203) between the caller and one friend. Only the two
        friends ever see it (FS-9).
      properties:
        friendStudentId: { $ref: '#/components/schemas/Uuid' }
        conversationId: { $ref: '#/components/schemas/Uuid', description: The pair's conversation — match it to `ConversationSummary.conversationId` to draw the flame. }
        count: { type: integer, minimum: 1, description: Consecutive Africa/Cairo days with a step, including today if `stepTakenToday`. }
        stepTakenToday:
          type: boolean
          description: True when the pair already took today's step (Cairo). False means the streak is alive from yesterday and breaks at the next Cairo midnight without a step today.
      required: [friendStudentId, conversationId, count, stepTakenToday]
    ConversationSummary:
      type: object
      description: One conversation in the caller's list. No streak counter (adr-196 G-3).
      properties:
        conversationId: { $ref: '#/components/schemas/Uuid' }
        peer: { $ref: '#/components/schemas/ChatPeer' }
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/ChatMessage'
            - type: 'null'
          description: The newest message the caller can still see, or null when there is none.
        unreadCount:
          type: integer
          minimum: 0
          description: The peer's unexpired messages the caller has not read yet.
        peerLastReadMessageId:
          type: [string, "null"]
          format: uuid
          description: The peer's read cursor — every message up to and including this id is "Seen". Null when the peer has read nothing.
        canSend:
          type: boolean
          description: False only when the peer's account was erased (read-only until the messages expire).
        lastActivityAt:
          type: string
          format: date-time
          description: The newest message's `sentAt`, or when the conversation began if it has never had one. The list's sort key.
      required: [conversationId, peer, lastMessage, unreadCount, peerLastReadMessageId, canSend, lastActivityAt]
    SendChatMessageRequest:
      type: object
      properties:
        clientMessageId:
          $ref: '#/components/schemas/Uuid'
          description: Generated by the app, one per message, and re-sent unchanged on every retry (idempotency key).
        body:
          type: string
          maxLength: 500
          description: 1–500 Unicode scalar values after trimming.
      required: [clientMessageId, body]
    EditChatMessageRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 500
          description: 1–500 Unicode scalar values after trimming.
      required: [body]
    MarkConversationReadRequest:
      type: object
      properties:
        lastReadMessageId: { $ref: '#/components/schemas/Uuid' }
      required: [lastReadMessageId]
    ReportChatMessageRequest:
      type: object
      properties:
        conversationId: { $ref: '#/components/schemas/Uuid' }
        messageId: { $ref: '#/components/schemas/Uuid' }
      required: [conversationId, messageId]
