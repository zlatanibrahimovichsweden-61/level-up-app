  /quizzes:
    post:
      tags: [quiz]
      x-stability: stable
      x-behaviour-changed: 3.11.0-m1
      operationId: createQuiz
      summary: Build a quiz — returns questions WITHOUT correct answers (per-question submit model)
      description: >
        Correct answers never ship with questions (content protection — the bank is the product).
        `mode: normal` requires a lessonId (school) or lectureId+quizType (university).
        `retakeWrong` builds from the student's own wrong answers and accepts **one optional leaf
        id** — `lessonId` on the school track, `lectureId` on the university track, never both and
        never the other track's — which **narrows** the pool to that leaf; omit it and the pool is
        the student's whole history, exactly as before. `favorites` builds from the student's own
        favourites and accepts **no leaf id at all**. `quizType` is refused on both pool modes.
        Both pool modes may return fewer than `length`. Free plan: 50 questions/WEEK — creation
        that would exceed it fails with `weekly_question_limit_reached`.


        **BEHAVIOURAL CHANGE in 2.3.0-m1 (adr-091).** `mode: normal` with a university `lectureId`
        is subject to **release AND entitlement/quota** — which is **no longer "the same two gates
        as the catalog"**, because after adr-091 the catalog applies release alone. A lecture whose
        term is not released for the caller's cohort is **not buildable** and returns
        `403 insufficient_scope` — the same code, reachable for a `lectureId` that was valid before.
        No new error code: an unreleased term is absent, not nameable (adr-038 §7).


        **Entitlement is enforced HERE, not on the catalog read** (adr-091 §1). A student without an
        active `baseSubscription` may still browse the whole catalog and build quizzes, drawing on
        the free allowance above; creation that would exceed it fails with
        `403 weekly_question_limit_reached`.


        **BEHAVIOURAL CHANGE in 3.11.0-m1 (adr-136).** `mode: retakeWrong` now accepts an optional
        leaf id, and a request that reliably returned `400 validation_failed` now returns `201` or
        `403`. The request and response SCHEMAS do not move — `lessonId` and `lectureId` already
        exist on this body for `mode: normal` — so a regenerated client is byte-identical and your
        build will not tell you. There are exactly **three outcomes**, and they must be told apart
        by status, never by emptiness. **One** — the leaf is inside the caller's closed set (their
        enrolment scope, and on the university track the release gate too) but they have no wrong
        answers in it: `201` with `questions: []`, which is a NORMAL response and must not be
        rendered as an error. **Two** — the leaf is outside that closed set for ANY reason: another
        school or stage, not enrolled, non-existent, or a university term that is not released for
        the caller's cohort: `403` `insufficient_scope`, with a body **identical**
        to the one `mode: normal` returns for an out-of-scope leaf belonging to the same caller.
        The four causes are deliberately indistinguishable and always will be — do not attempt to
        tell them apart, and do not report the identical bodies as a defect. **Three** — the shape
        is malformed (`lessonId` and `lectureId` together, the other track's id — a `school` caller
        sending `lectureId` or a `university` caller sending `lessonId`, which is a `400` and NOT a
        `403` because it is judged from the caller's own track and says nothing about whether the id
        names anything — `quizType` on either pool mode, or any leaf id on `mode: favorites`):
        `400` `validation_failed`, unchanged, same message. No error code is added; `validation_failed` and
        `insufficient_scope` are already registered.


        **`mode: retakeWrong` with NO leaf id is byte-identical to before** and is not part of this
        change. `mode: favorites` is not changed in any way — it accepts no leaf id, and asking for
        one is the same `400` it has always been.


        **The question of whether the two gates filter the pool modes is now ANSWERED (adr-135),
        and it replaces the "not yet specified — do not infer either answer" note this operation
        used to carry.** `retakeWrong`'s pool **is** release-gated: a university lecture whose term
        is not released for the caller's cohort is out of the closed set, so it is refused as
        outcome two above, and its questions do not appear in the unscoped pool either.
        `favorites`' pool is **not** release-gated. School content is never release-gated at all
        (adr-073). Re-releasing a term restores the retake pool unchanged; nothing is lost, because
        adr-017 keeps every attempt forever — the gate filters what is drawable, it does not delete
        history. There is no release state on the wire and no way to distinguish the cause of a
        refusal, by design (adr-038 §3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [normal, retakeWrong, favorites], default: normal }
                lessonId: { $ref: '#/components/schemas/Uuid', description: 'School track. Required on `mode: normal`; optional on `mode: retakeWrong`, where it narrows the pool to that lesson. Refused on `mode: favorites`.' }
                lectureId: { $ref: '#/components/schemas/Uuid', description: 'University track. Required on `mode: normal`; optional on `mode: retakeWrong`, where it narrows the pool to that lecture, after the release gate. Refused on `mode: favorites`.' }
                quizType: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision], description: 'University `mode: normal` only; default normal. Refused on both pool modes.' }
                length: { type: integer, enum: [10, 30, 50] }
              required: [mode, length]
      responses:
        '201':
          description: Quiz created (questions in serving order).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quiz' }
        '400':
          description: "`validation_failed` (mode/track/scope mismatch)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`weekly_question_limit_reached` (free plan) · `subscription_required` · `insufficient_scope`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '422':
          description: "`not_enough_questions` (normal mode: scope pool < length)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
