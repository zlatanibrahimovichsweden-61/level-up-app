  /me/avatar:
    put:
      tags: [profile]
      x-stability: stable
      operationId: uploadCustomAvatar
      summary: Upload a custom avatar (verified, metadata-stripped and safety-checked before it is public)
      description: >
        spec-070. Replaces the student's avatar with their own photo, published as a PUBLIC image behind the
        CDN and shown wherever avatars show: the profile, friends, the leaderboard and chat. Send exactly ONE
        multipart part named `image` — JPEG, PNG or WebP, at most 2,097,152 bytes (2 MiB), each side 128 to
        4,096 px, at most 16,000,000 pixels, not animated, nothing after the image's end. The part's
        Content-Type and file name are ignored: the bytes decide. Crop to a square and upload it upright
        (PNG and WebP orientation metadata is not kept).


        Before anything is stored the server checks the image, strips its metadata WITHOUT re-encoding the
        pixels (no GPS, device, time, thumbnail or XMP survives; a JPEG keeps only its orientation) and runs
        a safety check. If any step refuses, nothing is stored and the previous avatar stays. On success the
        answer is the new public URL — **every upload gets a NEW URL** (never cache by the old one) — and the
        previous custom photo is deleted. Clients must not assume the default-avatar host: the URL is on the
        avatars CDN host.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: "JPEG/PNG/WebP, at most 2,097,152 bytes, 128–4,096 px a side, not animated." }
              required: [image]
      responses:
        '200':
          description: Accepted, published and set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string, format: uri, description: "The new public CDN URL. Contains no identity; changes on every upload." }
                required: [avatarUrl]
        '400':
          description: "`validation_failed` — not exactly one multipart part named `image` (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114). · `terms_acceptance_required` — the caller has not accepted the current Terms; photo uploads need it."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '413':
          description: "`image_too_large` — the image part is over 2,097,152 bytes. The server stops reading at the limit."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '422':
          description: "`image_content_invalid` — not an acceptable still JPEG, PNG or WebP within the limits (one answer for every cause). · `image_rejected_by_moderation` — the safety check refused the photo: show \"this photo can't be used\". Either way nothing was stored and the avatar is unchanged."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 5 uploads per student per hour, and after 3 refused photos in an hour every upload is refused until the hour clears. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '503':
          description: "`image_upload_unavailable` — storage or the safety check is not configured, down, timed out or gave no usable answer (never treated as a pass). Nothing was stored; the avatar is unchanged. Try later."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    delete:
      tags: [profile]
      x-stability: stable
      operationId: removeCustomAvatar
      summary: Remove the custom avatar (back to the chosen default)
      description: >
        spec-070. Removes the student's custom photo; the profile, friends, leaderboard and chat show the
        default avatar the student last chose (or the server default). The public file is deleted (CDN edge
        copies expire within an hour). **Idempotent:** `204` when there is no custom avatar.
      responses:
        '204':
          description: Removed (or there was none).
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — shares the profile-write budget. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
