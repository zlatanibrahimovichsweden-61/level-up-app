        The concrete board is derived from the CALLER's registration — no cross-picking.
        School scopes: `system` (own education system + country) · `governorate` (Egypt-only
        sub-scope). University scopes: `cohort` (الدفعة — university+faculty+year) · `global`.
        Invisible students (adr-023) are excluded before ranking is returned; therefore peer
        ranks are DENSE over visible students and may differ from self-rank. Entries on a board
        inherently show points; `scoreHidden` affects profiles/friends, not board rows.
        Cursor = opaque rank position; a page may shift between calls (live sets) — the client
        should tolerate duplicates/gaps at page seams.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
          description: Must be valid for the caller's track — else `validation_failed`.
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of ranked entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
        '400':
          description: "`validation_failed` (scope invalid for track, e.g. governorate for non-EG or university caller)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard/me:
    get:
      tags: [leaderboard]
      x-stability: draft
      operationId: getMyRank
      summary: Self-rank — computed against the UNFILTERED board (adr-023 private rank)
      description: >
        The only path that sees the caller's position on the full board (including while
        invisible). May differ from the peer-visible dense ranking on /leaderboard.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
      responses:
        '200':
          description: The caller's own rank.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rank: { type: integer, example: 1234 }
                  points: { type: integer }
                  boardSize: { type: integer, description: Total ranked students on the unfiltered board. }
                required: [rank, points, boardSize]
        '400':
          description: "`validation_failed` (scope invalid for track)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (~15 min). 401 `authentication_required` → refresh; 401 `session_superseded` → forced logout.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque (base64 keyset). Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100, minimum: 1 }
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 + Level Up extensions (ADR-026 §5). EVERY non-2xx body has this shape.
      properties:
        type: { type: string }
        title: { type: string, description: Developer-facing English. Never shown to users. }
        status: { type: integer }
        detail: { type: string, description: Developer-facing English. Never shown to users. }
        code: { type: string, description: "Stable machine code from error-codes.md, e.g. otp_expired. The client maps this to AR/EN copy." }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Field → messages (validation_failed only)
        traceId: { type: string }
      required: [title, status, code]
    CursorPage:
      type: object
      description: The one open-ended-list wrapper (ADR-026 §6). items' type varies per endpoint.
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, "null"], description: Opaque. Absent/null = no more pages. }
        hasMore: { type: boolean }
      required: [items, hasMore]
    Uuid:
      type: string
      format: uuid
      description: UUIDv7, opaque to the client (ADR-026 §7).
      example: "0197b2f3-8a11-7cc3-9b4e-3f2a1d6e8c01"
    Phone:
      type: string
      description: E.164 with country code.
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: "+201001234567"
    DeviceInfo:
      type: object
      description: Client-generated STABLE id (survives app restarts, regenerated on reinstall) — the device-binding key (adr-019).
      properties:
        deviceId: { type: string, maxLength: 64 }
        platform: { type: string, enum: [android, ios] }
        model: { type: string, maxLength: 100, description: "Display label for eviction messaging, e.g. \"Redmi Note 12\"." }
      required: [deviceId, platform]
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: "JWT, ~15 min." }
        accessExpiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Rotates on every refresh; TTL 60 days. }
        refreshExpiresInSeconds: { type: integer, example: 5184000 }
      required: [accessToken, accessExpiresInSeconds, refreshToken, refreshExpiresInSeconds]
    AuthenticatedResult:
      type: object
      properties:
        result: { type: string, enum: [authenticated] }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        profile: { $ref: '#/components/schemas/StudentProfile' }
      required: [result, tokens, profile]
    RegistrationRequiredResult:
      type: object
      description: New phone — no account. Proceed to POST /auth/register within expiresInSeconds.
      properties:
        result: { type: string, enum: [registrationRequired] }
        registrationToken: { type: string }
        expiresInSeconds: { type: integer, example: 600 }
      required: [result, registrationToken, expiresInSeconds]
    EducationSystem:
      type: string
      description: Extensible — new values may appear additively (STEM future); clients must tolerate unknown values.
      enum: [nationalArabic, nationalLanguages, ig, american, ib]
    Stage:
      type: string
      enum: [prep1, prep2, prep3, secondary1, secondary2, secondary3]
    SchoolRegistration:
      type: object
      description: >
        City (adr-028 §1 — supersedes adr-010's rejection of free-text city): `cityId` (coded,
        from `/reference/cities`, preferred) OR `cityName` (free text, max 100 — the "my city
        isn't listed" fallback). At least one is required; supplying both → `validation_failed`.
        Registration is never blocked by a missing city row.


        School (adr-028 §2 — supersedes adr-010's Egypt-required schoolId): `schoolId` is
        OPTIONAL for every school-track student, Egypt included — pick from the coded list
        (`/reference/schools`) if the school is there, omit it if not. Free-text `schoolName`
        does not exist on this contract; unverifiable strings buy no feature.


        `governorateId` conditionality is unchanged from adr-010: required when `countryCode` is
        EG (`requiresGovernorate: true` on `/reference/countries`), forbidden otherwise.
        Violations → `validation_failed` with a field map.
      properties:
        track: { type: string, enum: [school] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string, example: "EG" }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        schoolId: { $ref: '#/components/schemas/Uuid', description: Optional for every school student (adr-028 §2 — no longer Egypt-required). Omit if the school isn't in the coded list — including when the student is outside Egypt. }
        stage: { $ref: '#/components/schemas/Stage' }
        educationSystem: { $ref: '#/components/schemas/EducationSystem' }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email, description: "Optional — receipts/notifications only, never login (adr-019)." }
        avatarId: { $ref: '#/components/schemas/Uuid', description: One of the 20 defaults; omit for server default. }
      required: [track, registrationToken, device, name, dateOfBirth, countryCode, stage, educationSystem, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    UniversityRegistration:
      type: object
      description: >
        Egypt-only by shape (no country field — adr-010). Years/faculties are data-driven ids
        from /reference/universities. City (adr-028 §1 — same rule as SchoolRegistration):
        `cityId` (coded, preferred) OR `cityName` (free text, max 100 — "my city isn't listed"
        fallback). At least one is required; supplying both → `validation_failed`.
      properties:
        track: { type: string, enum: [university] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        universityId: { $ref: '#/components/schemas/Uuid' }
        facultyId: { $ref: '#/components/schemas/Uuid' }
        studyYearId: { $ref: '#/components/schemas/Uuid', description: Must be an `active` year (soon → validation_failed). }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email }
        avatarId: { $ref: '#/components/schemas/Uuid' }
      required: [track, registrationToken, device, name, dateOfBirth, universityId, facultyId, studyYearId, governorateId, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    NamedRef:
      type: object
      description: Generic bilingual reference row (governorate, city, school).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nameAr: { type: string }
        nameEn: { type: string }
      required: [id, nameAr, nameEn]
    StudentProfile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        track: { type: string, enum: [school, university] }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, "null"], format: email }
        dateOfBirth: { type: string, format: date }
        avatar:
          type: object
          properties:
            type: { type: string, enum: [default, custom] }
            id: { $ref: '#/components/schemas/Uuid', description: Present for default avatars. }
            url: { type: string, format: uri }
          required: [type, url]
        geography:
          type: object
          properties:
            countryCode: { type: string, example: "EG" }
            governorate: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }] }
            city:
              description: >
                Union (adr-028 §1): a `NamedRef` (has `id`) when the student picked a coded
                city, or `{ name }` free text when they used the "my city isn't listed"
                fallback. Always present — every student has a city, one way or the other.
              oneOf:
                - $ref: '#/components/schemas/NamedRef'
                - type: object
                  properties:
                    name: { type: string, maxLength: 100 }
                  required: [name]
          required: [countryCode, city]
        school:
          type: [object, "null"]
          description: School-track block (null for university students).
          properties:
            school: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }], description: Coded school (adr-028 §2 — optional; null if the student didn't pick one — Egypt included). }
            stage: { $ref: '#/components/schemas/Stage' }
            educationSystem: { $ref: '#/components/schemas/EducationSystem' }
          required: [stage, educationSystem]
        university:
          type: [object, "null"]
          description: University-track block (null for school students).
          properties:
            university: { $ref: '#/components/schemas/NamedRef' }
            faculty: { $ref: '#/components/schemas/NamedRef' }
            yearNumber: { type: integer }
            termId: { $ref: '#/components/schemas/TermId' }
            termNumber: { $ref: '#/components/schemas/TermNumber' }
          required: [university, faculty, yearNumber]
        points:
          type: object
          description: Server-authoritative (adr-003 dual pools). Never computed client-side.
          properties:
            school: { type: integer }
            university: { type: integer }
            total: { type: integer }
          required: [school, university, total]
        level: { type: integer, description: "1–12, thresholds every 500 points; static, not configurable." }
        badges: { type: integer, description: "Post-level-12 badges (every 5,000 points; first at 11,000)." }
        privacy:
          type: object
          description: adr-023 toggles; defaults preserve visible behavior.
          properties:
            leaderboardVisible: { type: boolean, default: true }
            scoreHidden: { type: boolean, default: false }
          required: [leaderboardVisible, scoreHidden]
        entitlements:
          type: array
          description: Read-only embed for first paint; the entitlement-state source of truth is GET /me/entitlements.
          items: { $ref: '#/components/schemas/EntitlementState' }
        createdAt: { type: string, format: date-time }
      required: [id, track, name, phone, dateOfBirth, avatar, geography, points, level, badges, privacy, entitlements, createdAt]
    EntitlementType:
      type: string
      description: Extensible set (adr-018) — clients must tolerate unknown values additively.
      enum: [baseSubscription, flashcardSubscription]
    EntitlementState:
      type: object
      properties:
        type: { $ref: '#/components/schemas/EntitlementType' }
        active: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
        inGrace: { type: boolean, description: 2-day grace after expiry (requirements §5). }
        graceEndsAt: { type: [string, "null"], format: date-time }
      required: [type, active, inGrace]
    TermId:
      type: [string, "null"]
      format: uuid
      description: >
        Opaque id of the term (adr-036). **Nullable, and null is normal** — null for every
        school-track resource, and null on a university profile during the summer gap or when the
        cohort has no schedule row. Opaque per adr-026 §7: do NOT hardcode term ids or derive an
        order from them — order and label on `termNumber`.
    TermNumber:
      type: [integer, "null"]
      description: >
        The term's ordinal within the academic year — `1` or `2` today (adr-036 §1 keeps the door
        open to more). Null exactly when `termId` is null. This is the ONLY orderable/labellable
        term signal on the wire: term NAMES are never sent, so the client renders its own localized
        AR/EN label, per adr-026 §5. Needed because a year-long course is two subjects with the same
        `name` (adr-036 §2).
    QuestionCounter:
      type: object
      description: Contract-v2 per-lesson/lecture counter — display only, never locks retakes.
      properties:
        answered: { type: integer, description: Distinct questions this student has ever answered in scope. }
        total: { type: integer }
      required: [answered, total]
    SchoolSubjectTree:
      type: object
      properties:
        track: { type: string, enum: [school] }
        units:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                        required: [id, name, questionCounter]
                  required: [id, name, lessons]
            required: [id, name, chapters]
      required: [track, units]
    UniversitySubjectTree:
      type: object
      properties:
        track: { type: string, enum: [university] }
        quizTypes:
          type: array
          items: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision] }
        lectures:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
            required: [id, name, questionCounter]
      required: [track, quizTypes, lectures]
    QuizQuestion:
      type: object
      description: NO correct answer here — grading is server-side on submit.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        text: { type: string, description: Plain text; only <u>…</u> markup allowed. }
        imageUrl: { type: [string, "null"], format: uri, description: "Full image (DO Spaces CDN, WebP)." }
        thumbnailUrl: { type: [string, "null"], format: uri }
        options:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              text: { type: string }
            required: [id, text]
        isFavorite: { type: boolean }
      required: [id, order, text, options, isFavorite]
    Quiz:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        quizType: { type: [string, "null"], enum: [normal, midTermRevision, finalRevision, practicalRevision, null], description: University only. }
        scopeName: { type: string, description: Lesson/lecture display name (or "Retake wrong"/"Favorites" client-side by mode). }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        createdAt: { type: string, format: date-time }
      required: [id, mode, scopeName, questions, createdAt]
    AnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        correctOptionId: { $ref: '#/components/schemas/Uuid' }
        pointsDelta: { type: integer, description: "0 or 1 (server-side award; 0 on retry replay or free-plan edge)." }
        explanationAvailable: { type: boolean, description: "If true, GET /questions/{questionId}/explanation returns 200/202." }
      required: [correct, correctOptionId, pointsDelta, explanationAvailable]
    QuizSummary:
      type: object
      properties:
        quizId: { $ref: '#/components/schemas/Uuid' }
        score: { type: integer, description: Correct answers. }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        pointsAwarded: { type: integer }
        leveledUp:
          type: boolean
          description: >
            Whether THIS attempt's awards crossed a level threshold. An EVENT, frozen on the attempt
            when it happened — it never changes afterwards, and a later quiz cannot turn it on or off.
            The student's CURRENT level and total are state, not events: read them from GET /me.
        newBadge:
          type: boolean
          description: >
            Whether THIS attempt's awards earned a badge. Frozen at the moment it happened, on the
            same rule as leveledUp.
        questions:
          type: array
          description: Recap rows (full review at GET /quizzes/{id}).
          items:
            type: object
            properties:
              questionId: { $ref: '#/components/schemas/Uuid' }
              answered: { type: boolean }
              correct: { type: [boolean, "null"], description: null when unanswered. }
            required: [questionId, answered]
      required: [quizId, score, totalQuestions, answeredCount, pointsAwarded, leveledUp, newBadge, questions]
    QuizHistoryItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
      required: [id, subjectName, scopeName, mode, score, totalQuestions, finishedAt]
    QuizReview:
      type: object
      description: Post-completion review — includes the student's answer AND the correct answer per question (adr-017).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuizQuestion'
              - type: object
                properties:
                  selectedOptionId: { type: [string, "null"], description: null = unanswered. }
                  correctOptionId: { $ref: '#/components/schemas/Uuid' }
                  correct: { type: [boolean, "null"] }
                  explanationAvailable: { type: boolean }
                required: [correctOptionId, explanationAvailable]
      required: [id, subjectName, scopeName, score, totalQuestions, finishedAt, questions]
    LeaderboardEntry:
      type: object
      description: "Privacy-filtered (adr-023): invisible students never appear; board rows inherently show points."
      properties:
        rank: { type: integer, description: Dense rank over VISIBLE students (may differ from self-rank). }
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
        points: { type: integer }
        isMe: { type: boolean }
      required: [rank, studentId, name, avatarUrl, points, isMe]
