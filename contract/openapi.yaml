  /support/tickets:
    post:
      tags: [support]
      x-stability: stable
      operationId: createSupportTicket
      summary: File a support ticket (subject + details, optionally up to 3 photos)
      description: >
        Opens a ticket owned by the caller, status `open`. `details` is the ticket's opening text; it
        is NOT repeated as the first thread message (the thread holds replies only). Both fields are
        trimmed server-side, and the limits apply to the trimmed value: `subject` 1–120 characters,
        `details` 1–4000. No category or priority is accepted (spec-045 D3).


        **Photos (spec-067, additive).** The optional `attachmentIds` (at most 3, no repeats) attaches
        photos the caller uploaded and completed with `createSupportAttachmentUpload` +
        `completeSupportAttachment`; they become the ticket's opening photos and are returned in
        `attachments`. Every id must be the caller's own, `ready`, not yet attached and younger than 24
        hours — otherwise NOTHING is written (no ticket) and the answer is `404 attachment_not_found`.
        Photos are gated on the current Terms (`403 terms_acceptance_required`); a text-only ticket never is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportTicketRequest' }
      responses:
        '201':
          description: Created. No `Location` header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400':
          description: "`validation_failed` — `subject` or `details` missing, empty after trimming, or over its limit; or `attachmentIds` holds more than 3 ids or repeats one (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114). Support is NOT one of the four: route to the cancel screen, do not log out and do not retry. · `terms_acceptance_required` (spec-067) — the request carries `attachmentIds` and the caller has not accepted the current Terms; send it again without photos, or accept the Terms first. Never returned for a text-only ticket."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`attachment_not_found` (spec-067) — an id in `attachmentIds` is unknown, malformed, another student's, not `ready`, already attached or older than 24 hours (one answer for all). No ticket was created."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`attachment_limit_reached` (spec-067) — the photos would take the ticket over 10. No ticket was created."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 5 ticket creates per student per day. Honour `Retry-After`. Replies have their own, separate budget."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    get:
      tags: [support]
