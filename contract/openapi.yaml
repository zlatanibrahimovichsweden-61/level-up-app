  /questions/{questionId}/explanation:
    get:
      tags: [quiz]
      x-stability: stable
      operationId: getExplanation
      summary: AI explanation (GPT-4o-mini, generated once, cached — subscription-gated, only after answering)
      description: |
        Explains the CORRECT answer to one question, in the question's own language. The text is
        generated once per question and cached server-side forever, so the common case is an
        instant `200`.

        Available after **both correct and incorrect** submitted answers — the gate is
        answered-vs-not, never wrong-vs-right. The explanation is not specific to the option you
        chose.

        **Render the affordance from `AnswerResult.explanationAvailable`, and call this endpoint
        only when it is `true`.** That field is independent of subscription state (the
        `hasFlashcards` pattern): a free student sees the button, and the tap produces the
        `subscription_required` popup below. When it is `false`, do not render the affordance and
        do not call this endpoint.

        **Polling.** On `202`, show a loading state and re-issue the same GET on ~2s backoff.
        There is deliberately **no terminal failure status on the wire** — a generation that fails
        keeps answering `202`. Your poll cap IS the failure UX: after roughly 10 polls (~20s), stop
        and show a "try again" affordance. Re-tapping simply re-issues the GET; the server side is
        idempotent, so a retry never causes a duplicate generation.

        **This operation is rate limited per student** — it is the one endpoint you poll, so an
        unbounded loop is refused with `429`. The documented backoff and poll cap stay comfortably
        inside the limit; see the `429` response below.
      parameters:
        - { name: questionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Ready (cached).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  text: { type: string }
                required: [status, text]
        '202':
          description: Generating — client polls (suggested 2s backoff).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [generating] }
                required: [status]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: |
            `subscription_required` · `insufficient_scope` · `account_pending_deletion` — **branch on
            `code`, not on the status.**

            **`subscription_required`** — the caller has no active `baseSubscription` covering the
            question's track. AI explanations are a paid feature. Show this popup, using this
            approved copy verbatim:

            > "AI explanations are available with a Level Up subscription. Subscribe to get
            > step-by-step explanations and more learning features."

            (Arabic rendering comes from your normal localization of the stable `code`; the English
            above is the approved source copy.) The `flashcardSubscription` is irrelevant here —
            the two subscriptions are independent and only `baseSubscription` opens this surface.
            This is the only `403` on this operation that needs handling of its own.

            **`insufficient_scope`** — covers several deliberately COLLAPSED causes, returned
            byte-identically: you have not yet submitted an answer to this question; the question id
            is outside your scope or names nothing at all; or the surface has been temporarily
            withdrawn by the operator. **Do not try to distinguish them, do not build an existence
            probe on this endpoint, and do not report the identical bodies as a defect.** Treat it
            as: no explanation is available to you for this question — no popup, no error toast.

            Note the ORDER, because it is deliberate: a withdrawn surface answers
            `insufficient_scope` for **every** caller including a subscriber, so a withdrawal never
            solicits a subscription; and an unsubscribed caller gets `subscription_required` whether
            or not they have answered the question.

            **`account_pending_deletion`** — the caller's account is inside the 30-day deletion grace
            window, during which every authenticated endpoint but four is unavailable (adr-114); this
            operation is not on that allowlist, so the refusal happens before any subscription or
            scope check. It is not an error to retry and not a logout: route to the cancel screen
            from the same global interceptor that already handles this code elsewhere. Reachable
            since this operation's first implemented version, `3.14.0-m1`.

            All three codes are already registered in `error-codes.md`; this operation introduces
            none.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — per-student limit on this operation, because it is the one endpoint you POLL. The suggested ~2s backoff with a ~10-poll cap stays well inside it; a tighter loop, or several explanations opened back to back within a minute, can meet it. Honour `Retry-After`, do not retry in a tight loop, and do NOT treat it as a generation failure — the explanation is unaffected and the same GET succeeds after the window."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
