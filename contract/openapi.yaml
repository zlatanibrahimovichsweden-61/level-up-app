# Level Up — API contract (OWNED ARTIFACT, ADR-026)
# Owner: Seif. The Flutter partner builds ONLY against this file (x-stability: stable paths).
# Contract-first: endpoints exist here BEFORE they exist in code. If code and this file
# disagree, the code is wrong. Every change gets an entry in contract-changelog.md.
#
# Conventions (ADR-026):
#   - Base path /api/v1 (URI versioning; additive changes don't bump)
#   - camelCase JSON properties; enums as camelCase strings; UTC ISO 8601 timestamps
#   - IDs: UUIDv7 strings, opaque to the client
#   - Errors: RFC 9457 ProblemDetails + stable `code` (registry: error-codes.md); client localizes AR/EN
#   - Pagination: cursor-based on every OPEN-ENDED list — ?cursor=&limit= (default 20, max 100)
#     → { "items": [...], "nextCursor": "...", "hasMore": true }
#     Closed reference sets (countries, governorates, systems, universities, avatars) are
#     returned as whole bare arrays — documented exception, they are pickers, not feeds.
#   - Auth: Authorization: Bearer <JWT>; 401 = refresh or forced logout (see `code`), 403 = forbidden
#   - Realtime (SignalR) documented in realtime.md, not here
openapi: 3.1.0
info:
  title: Level Up API
  version: 1.0.0-m1
  description: >
    Milestone-1 surface. Paths marked `x-stability: draft` are NOT safe to build against;
    paths marked `stable` are frozen (changes announced via contract-changelog.md).


    ## Global auth behavior (adr-019 + contract session 2026-07-19)

    Access JWT ~15 min; rotating refresh token, TTL 60 days. **Session eviction is instant**:
    the server checks the session version (Redis) on every authenticated request, so ANY
    endpoint may return `401` + `code: session_superseded` at any moment (logged in on another
    device). Client: one global interceptor — on `session_superseded` purge tokens and show the
    forced-logout screen; on `authentication_required` run the refresh flow, then retry once.


    **OTP parameters:** 6 digits, 5-minute expiry, 60s resend cooldown, 5 failed verifies →
    15-minute lock (`otp_throttled`). One active code per phone; requesting again invalidates
    the previous code (after cooldown).


    **Registration ordering — phone-verify-first:** no PII is submitted before phone possession
    is proven. `otp/verify` returns full tokens for an existing account or a short-lived
    `registrationToken` (10 min) for a new phone; `POST /auth/register` consumes it.


    **Staging test numbers:** reserved fake numbers (+20100000000xx) are whitelisted in staging
    config only — fixed OTP `000000`, no SMS/WhatsApp ever sent, rate limits identical to prod
    (so throttle/lock states are testable). Absent from production configuration. See security.md.


    **Anti-enumeration:** `otp/request` responds `202` whether or not an account exists — the
    existing/new fork happens inside `otp/verify`'s response, after possession is proven.


    **Question text format:** plain text; the ONLY inline markup is `<u>…</u>` for underline
    (contract v2 rich-text scope). No other HTML/Markdown is ever sent.
servers:
  - url: https://staging.TBD.example/api/v1
    description: staging (URL TBD — announced via contract-changelog.md)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: OTP login, registration, refresh, device binding, recovery (adr-019, adr-010)
  - name: reference
    description: Public lookup data for registration pickers (no auth)
  - name: profile
    description: Student profile, avatar, privacy toggles, FCM token
  - name: catalog
    description: Content taxonomy scoped to the caller's registration (track/system/stage or university/faculty/year)
  - name: quiz
    description: Quiz build → per-question answer → finish; history; favorites; AI explanation
  - name: entitlements
    description: Subscription state (extensible set, adr-018)
  - name: commerce
    description: Paymob checkout handoff (adr-020) + subscription-code redemption (adr-016)
  - name: leaderboard
    description: Scoped boards (adr-015) with privacy filtering (adr-023)
paths:
  /auth/otp/request:
    post:
      tags: [auth]
      x-stability: stable
      operationId: requestOtp
      summary: Send a login OTP to a phone (SMS with WhatsApp failover)
      description: >
        Always `202` for a well-formed phone, whether or not an account exists (anti-enumeration).
        Server picks the channel and fails over SMS↔WhatsApp; the client is not told which.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
              required: [phone]
      responses:
        '202':
          description: OTP dispatched (or silently ignored for abuse-flagged numbers).
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [resendAfterSeconds, expiresInSeconds]
        '400':
          description: "`validation_failed` (malformed phone)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (cooldown or per-identifier/device/IP limit)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/otp/verify:
    post:
      tags: [auth]
      x-stability: stable
      operationId: verifyOtp
      summary: Verify OTP — returns tokens (existing account) or a registrationToken (new phone)
      description: >
        Proving possession forks the flow: `authenticated` = tokens + profile, and if this is a
        NEW device the previous device's session is revoked HERE (it starts seeing
        `session_superseded`). `registrationRequired` = short-lived registrationToken (10 min);
        no account exists yet. 5 failed attempts → 15-min lock (`otp_throttled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, minLength: 6, maxLength: 6, example: "482913" }
                device: { $ref: '#/components/schemas/DeviceInfo' }
              required: [phone, code, device]
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticatedResult'
                  - $ref: '#/components/schemas/RegistrationRequiredResult'
                discriminator:
                  propertyName: result
                  mapping:
                    authenticated: '#/components/schemas/AuthenticatedResult'
                    registrationRequired: '#/components/schemas/RegistrationRequiredResult'
        '400':
          description: "`otp_invalid` · `otp_expired` · `validation_failed`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (attempt lockout)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/register:
    post:
      tags: [auth]
      x-stability: stable
      operationId: completeRegistration
      summary: Complete registration (consumes registrationToken) — one endpoint, track-discriminated body
      description: >
        Single endpoint per contract session 2026-07-19; `track` discriminates the body.
        University is Egypt-only BY SHAPE (no country field — adr-010). School: `country` drives
        conditionality — Egypt requires governorateId+cityId+schoolId (coded list); other countries
        require cityId, school is optional free text, never blocked. Must be called from the same
        device that verified the OTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SchoolRegistration'
                - $ref: '#/components/schemas/UniversityRegistration'
              discriminator:
                propertyName: track
                mapping:
                  school: '#/components/schemas/SchoolRegistration'
                  university: '#/components/schemas/UniversityRegistration'
      responses:
        '201':
          description: Account created; session issued (device bound).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedResult' }
        '400':
          description: "`validation_failed` (field map in `errors` — incl. geography conditionality)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid` (expired/consumed/wrong device — restart at otp/request)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`phone_already_registered` (account appeared since verify — client restarts login)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/refresh:
    post:
      tags: [auth]
      x-stability: stable
      operationId: refreshTokens
      summary: Rotate the refresh token, mint a new access token
      description: >
        Rotation with reuse detection: replaying an already-rotated token revokes the whole chain
        (`refresh_token_invalid` — full re-login). If a newer device session exists, the answer is
        `session_superseded` (forced-logout flow, adr-019 eviction).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                deviceId: { type: string, description: Same client-generated stable id sent at verify. }
              required: [refreshToken, deviceId]
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: "`refresh_token_invalid` (expired/revoked/reused → full re-login) · `session_superseded` (evicted by newer device)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/logout:
    post:
      tags: [auth]
      x-stability: stable
      operationId: logout
      summary: Revoke this session (access + refresh chain)
      responses:
        '204': { description: Session revoked. Idempotent. }
        '401':
          description: "`authentication_required`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/start:
    post:
      tags: [auth]
      x-stability: draft
      operationId: startRecovery
      summary: "Recovery step 1: look up the account, send OTP to the parent phone (masked)"
      description: >
        adr-019 primary recovery path (lost/changed number). Returns the parent number MASKED
        (UI/UX handoff: never the full number). Heavily rate-limited + audited — this endpoint
        inherently confirms account existence, which is why limits here are stricter than login.
        `recovery_unavailable` covers BOTH unknown phone and no-parent-number-on-file (single
        code on purpose — less enumeration signal); the app routes to the support path.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone', description: The OLD (lost/changed) registered phone. }
              required: [phone]
      responses:
        '200':
          description: Parent OTP dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryId: { $ref: '#/components/schemas/Uuid' }
                  parentPhoneMasked: { type: string, example: "•••• ••• 1234" }
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [recoveryId, parentPhoneMasked, resendAfterSeconds, expiresInSeconds]
        '404':
          description: "`recovery_unavailable` → app shows the support path (Path 2)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/verify-parent:
    post:
      tags: [auth]
      x-stability: draft
      operationId: verifyParentOtp
      summary: "Recovery step 2: verify the parent-phone OTP"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryId: { $ref: '#/components/schemas/Uuid' }
                code: { type: string, minLength: 6, maxLength: 6 }
              required: [recoveryId, code]
      responses:
        '200':
          description: Guardianship proven; short-lived rebind token issued (10 min).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rebindToken: { type: string }
                  expiresInSeconds: { type: integer, example: 600 }
                required: [rebindToken, expiresInSeconds]
        '400':
          description: "`otp_invalid` · `otp_expired`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid` (rebind/recovery token expired — restart)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/new-phone:
    post:
      tags: [auth]
      x-stability: draft
      operationId: submitNewPhone
      summary: "Recovery step 3: submit the NEW phone — OTP is sent to it"
      description: >
        Parent OTP proves guardianship; this step proves possession of the NEW number (otherwise a
        typo re-locks the student). `phone_already_registered` if the new number belongs to another account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rebindToken: { type: string }
                newPhone: { $ref: '#/components/schemas/Phone' }
              required: [rebindToken, newPhone]
      responses:
        '202':
          description: OTP dispatched to the new phone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [resendAfterSeconds, expiresInSeconds]
        '401':
          description: "`registration_token_invalid` (rebind token expired — restart recovery)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`phone_already_registered`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/confirm:
    post:
      tags: [auth]
      x-stability: draft
      operationId: confirmRecovery
      summary: "Recovery step 4: verify new-phone OTP — rebinds phone + device, resets THE single session"
      description: >
        On success the account's phone is replaced, the new device becomes the one active device,
        any previous session is revoked, and the event is audited (adr-019 anti-sharing guard —
        recovery never grants a second concurrent session).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rebindToken: { type: string }
                code: { type: string, minLength: 6, maxLength: 6 }
                device: { $ref: '#/components/schemas/DeviceInfo' }
              required: [rebindToken, code, device]
      responses:
        '200':
          description: Rebound; fresh session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedResult' }
        '400':
          description: "`otp_invalid` · `otp_expired`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /reference/countries:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listCountries
      summary: Launch countries (EG, AE, SA, OM — extensible, adr-010)
      description: Closed set, bare array (documented pagination exception). School track only; university is Egypt-only.
      security: []
      responses:
        '200':
          description: All countries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, example: "EG", description: ISO 3166-1 alpha-2. }
                    nameAr: { type: string, example: "مصر" }
                    nameEn: { type: string, example: "Egypt" }
                    requiresGovernorate: { type: boolean, description: true only for EG — drives the registration UI branch. }
                  required: [code, nameAr, nameEn, requiresGovernorate]
  /reference/countries/{countryCode}/governorates:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listGovernorates
      summary: Governorates for a country (empty array for non-EG)
      security: []
      parameters:
        - { name: countryCode, in: path, required: true, schema: { type: string, example: "EG" } }
      responses:
        '200':
          description: Bare array (closed set).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedRef' }
  /reference/cities:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listCities
      summary: Coded city list (adr-010 — no free-text cities)
      description: For EG pass governorateId; for other countries pass countryCode only.
      security: []
      parameters:
        - { name: countryCode, in: query, required: true, schema: { type: string } }
        - { name: governorateId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Bare array (closed set per scope).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NamedRef' }
        '400':
          description: "`validation_failed` (EG without governorateId)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /reference/schools:
    get:
      tags: [reference]
      x-stability: stable
      operationId: searchSchools
      summary: Search the Egyptian coded school list (cursor-paginated)
      description: >
        Egypt only — Egyptian students MUST pick from this list; non-Egypt students use optional
        free text in registration instead (adr-010, never blocked).
      security: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Name search (AR or EN). }
        - { name: governorateId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: cityId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of schools.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/NamedRef' }
  /reference/education-systems:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listEducationSystems
      summary: School education systems (National AR/Languages, IG, American, IB; STEM future)
      security: []
      responses:
        '200':
          description: Bare array (closed set). `code` values are the wire enum used in registration.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { $ref: '#/components/schemas/EducationSystem' }
                    nameAr: { type: string }
                    nameEn: { type: string }
                  required: [code, nameAr, nameEn]
  /reference/universities:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listUniversities
      summary: Universities → data-driven faculties → data-driven years (adr-018)
      description: Years carry status `active|soon` — "soon" years are shown but not selectable at registration.
      security: []
      responses:
        '200':
          description: Bare array, nested (small closed set).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    nameAr: { type: string }
                    nameEn: { type: string }
                    faculties:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          nameAr: { type: string }
                          nameEn: { type: string }
                          years:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { $ref: '#/components/schemas/Uuid' }
                                yearNumber: { type: integer, example: 1 }
                                status: { type: string, enum: [active, soon] }
                              required: [id, yearNumber, status]
                        required: [id, nameAr, nameEn, years]
                  required: [id, nameAr, nameEn, faculties]
  /reference/avatars:
    get:
      tags: [reference]
      x-stability: stable
      operationId: listDefaultAvatars
      summary: The 20 default avatars (public — needed at registration)
      security: []
      responses:
        '200':
          description: Bare array (closed set).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    url: { type: string, format: uri }
                  required: [id, url]
  /me:
    get:
      tags: [profile]
      x-stability: stable
      operationId: getMyProfile
      summary: Full profile — identity, geography, points/level/badges, privacy, embedded entitlements
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    patch:
      tags: [profile]
      x-stability: stable
      operationId: updateMyProfile
      summary: Update editable fields (name, email, default avatar, privacy toggles)
      description: >
        Privacy toggles per adr-023 — both default to visible; enforcement is server-side.
        Custom avatar upload is the separate PUT /me/avatar (moderated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields optional; absent = unchanged.
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: [string, "null"], format: email, description: null clears it (email is optional, never a login channel — adr-019). }
                avatarId: { $ref: '#/components/schemas/Uuid' }
                leaderboardVisible: { type: boolean }
                scoreHidden: { type: boolean }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '400':
          description: "`validation_failed`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/avatar:
    put:
      tags: [profile]
      x-stability: draft
      operationId: uploadCustomAvatar
      summary: Upload a custom avatar (SafeSearch-moderated, adr-021 pipeline)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: JPEG/PNG/WebP ≤ 5 MB. }
              required: [image]
      responses:
        '200':
          description: Accepted and set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl: { type: string, format: uri }
                required: [avatarUrl]
        '422':
          description: "`image_rejected_by_moderation`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/fcm-token:
    put:
      tags: [profile]
      x-stability: draft
      operationId: registerFcmToken
      summary: Register/replace this device's FCM push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '204': { description: Stored (idempotent; one token per the single active device). }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/entitlements:
    get:
      tags: [entitlements]
      x-stability: stable
      operationId: getMyEntitlements
      summary: Subscription state — the paywall signal (extensible set, adr-018)
      description: >
        Refetch on app resume and when the checkout deep link returns (adr-020 — no `pending`
        state exists; a card payment is verified-paid or it isn't). Also embedded read-only in
        GET /me for first paint. Types are additively extensible (future finalRevision — no
        version bump).
      responses:
        '200':
          description: All entitlement states for the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntitlementState' }
                required: [items]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /catalog/subjects:
    get:
      tags: [catalog]
      x-stability: stable
      operationId: listSubjects
      summary: Subjects scoped to the caller's registration (server-derived — no scope params)
      description: >
        School — scoped by (education system, stage); University — by (university, faculty, year).
        The client never sends scope; it comes from the authenticated student (adr-013 scoping).
      responses:
        '200':
          description: Bare array (closed per-student set). `name` is in the content language (adr-018).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                  required: [id, name, questionCounter]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /catalog/subjects/{subjectId}/tree:
    get:
      tags: [catalog]
      x-stability: stable
      operationId: getSubjectTree
      summary: The quiz-build tree — school (units→chapters→lessons) or university (lectures + quiz types)
      description: >
        Per-lesson/lecture `questionCounter` is the contract-v2 answered/total counter — DISPLAY
        ONLY, never locks retakes. University trees additionally list the quiz types available.
      parameters:
        - { name: subjectId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Track-shaped tree.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SchoolSubjectTree'
                  - $ref: '#/components/schemas/UniversitySubjectTree'
                discriminator:
                  propertyName: track
                  mapping:
                    school: '#/components/schemas/SchoolSubjectTree'
                    university: '#/components/schemas/UniversitySubjectTree'
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope` (subject outside the caller's scope)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /quizzes:
    post:
      tags: [quiz]
      x-stability: stable
      operationId: createQuiz
      summary: Build a quiz — returns questions WITHOUT correct answers (per-question submit model)
      description: >
        Correct answers never ship with questions (content protection — the bank is the product).
        `mode: normal` requires a lessonId (school) or lectureId+quizType (university);
        `retakeWrong`/`favorites` build from the student's own pool (scope optional filter) and may
        return fewer than `length`. Free plan: 50 questions/WEEK — creation that would exceed it
        fails with `weekly_question_limit_reached`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [normal, retakeWrong, favorites], default: normal }
                lessonId: { $ref: '#/components/schemas/Uuid', description: School normal mode. }
                lectureId: { $ref: '#/components/schemas/Uuid', description: University normal mode. }
                quizType: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision], description: University only; default normal. }
                length: { type: integer, enum: [10, 30, 50] }
              required: [mode, length]
      responses:
        '201':
          description: Quiz created (questions in serving order).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quiz' }
        '400':
          description: "`validation_failed` (mode/track/scope mismatch)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`weekly_question_limit_reached` (free plan) · `subscription_required` · `insufficient_scope`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '422':
          description: "`not_enough_questions` (normal mode: scope pool < length)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    get:
      tags: [quiz]
      x-stability: draft
      operationId: listQuizHistory
      summary: Full quiz history (adr-017), newest first, cursor-paginated
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of past quizzes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/QuizHistoryItem' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /quizzes/{quizId}:
    get:
      tags: [quiz]
      x-stability: draft
      operationId: getQuizReview
      summary: Review a FINISHED quiz — questions, the student's answers, correct answers
      description: Correct answers appear here because the quiz is complete (adr-017 history review; feeds retake-wrong).
      parameters:
        - { name: quizId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Full review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizReview' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope` (not the caller's quiz)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`validation_failed`-style not-found (unknown id) — plain 404 ProblemDetails, code `not_found`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /quizzes/{quizId}/answers:
    post:
      tags: [quiz]
      x-stability: stable
      operationId: submitAnswer
      summary: Submit ONE answer — idempotent; returns correctness + points delta immediately
      description: >
        Idempotency key = (quizId, questionId): a network retry returns the ORIGINAL result and
        never double-awards points (grill decision 2026-07-19). Points are awarded server-side
        only (+1 per correct — dual pool per track, adr-003). `correctOptionId` is revealed only
        now, after the student committed.
      parameters:
        - { name: quizId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionId: { $ref: '#/components/schemas/Uuid' }
                optionId: { $ref: '#/components/schemas/Uuid' }
              required: [questionId, optionId]
      responses:
        '200':
          description: Graded (or the original grade on retry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerResult' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`weekly_question_limit_reached` · `insufficient_scope`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`quiz_already_finished`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /quizzes/{quizId}/finish:
    post:
      tags: [quiz]
      x-stability: stable
      operationId: finishQuiz
      summary: Close the quiz — summary, points awarded, level/badge changes. Idempotent.
      description: >
        Unanswered questions are recorded unanswered (not counted wrong). Repeat calls return the
        same summary (safe on retry). Unfinished quizzes auto-finish server-side after 24h.
      parameters:
        - { name: quizId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizSummary' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /questions/{questionId}/explanation:
    get:
      tags: [quiz]
      x-stability: stable
      operationId: getExplanation
      summary: AI explanation (GPT-4o-mini, generated once, cached — only after answering)
      parameters:
        - { name: questionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Ready (cached).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  text: { type: string }
                required: [status, text]
        '202':
          description: Generating — client polls (suggested 2s backoff).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [generating] }
                required: [status]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope` (question not yet answered by the caller)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /questions/{questionId}/favorite:
    put:
      tags: [quiz]
      x-stability: draft
      operationId: addFavorite
      summary: Favorite a question (idempotent)
      parameters:
        - { name: questionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '204': { description: Favorited. }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    delete:
      tags: [quiz]
      x-stability: draft
      operationId: removeFavorite
      summary: Unfavorite (idempotent)
      parameters:
        - { name: questionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '204': { description: Removed. }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/favorites:
    get:
      tags: [quiz]
      x-stability: draft
      operationId: listFavorites
      summary: The favorites pool (cursor-paginated) — also a quiz-build source (mode=favorites)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of favorited questions (no correct answers for unanswered ones).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId: { $ref: '#/components/schemas/Uuid' }
                            text: { type: string }
                            subjectName: { type: string }
                            favoritedAt: { type: string, format: date-time }
                          required: [questionId, text, subjectName, favoritedAt]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /checkout/sessions:
    post:
      tags: [commerce]
      x-stability: draft
      operationId: createCheckoutSession
      summary: Start Paymob web checkout — returns checkoutUrl; result read via /me/entitlements
      description: >
        adr-020/026 §10 — the app opens `checkoutUrl` externally (card-only Paymob, incl. Tier-1
        foreign cards), returns via deep link, then REFETCHES /me/entitlements. There is NO
        pending state and the payment webhook is backend-internal (Interfaces §2 boundary).
        School students requesting flashcardSubscription get `insufficient_scope` (university-only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entitlementType: { $ref: '#/components/schemas/EntitlementType' }
              required: [entitlementType]
      responses:
        '201':
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                required: [checkoutUrl]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`insufficient_scope` (flashcards for a school student)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '502':
          description: "`payment_initiation_failed` (Paymob unavailable — client offers retry)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /subscription-codes/redemptions:
    post:
      tags: [commerce]
      x-stability: draft
      operationId: redeemSubscriptionCode
      summary: Redeem a prepaid subscription code (adr-016 — single-use, 4-month, atomic)
      description: Same entitlement-grant path as a verified payment; single-use enforced atomically server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: The voucher code as printed/sold. }
              required: [code]
      responses:
        '201':
          description: Redeemed — the granted entitlement state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementState' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`code_invalid` (unknown code)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`code_already_redeemed`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard:
    get:
      tags: [leaderboard]
      x-stability: draft
      operationId: getLeaderboard
      summary: Scoped board (adr-015), privacy-filtered (adr-023), cursor over rank order
      description: >
        The concrete board is derived from the CALLER's registration — no cross-picking.
        School scopes: `system` (own education system + country) · `governorate` (Egypt-only
        sub-scope). University scopes: `cohort` (الدفعة — university+faculty+year) · `global`.
        Invisible students (adr-023) are excluded before ranking is returned; therefore peer
        ranks are DENSE over visible students and may differ from self-rank. Entries on a board
        inherently show points; `scoreHidden` affects profiles/friends, not board rows.
        Cursor = opaque rank position; a page may shift between calls (live sets) — the client
        should tolerate duplicates/gaps at page seams.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
          description: Must be valid for the caller's track — else `validation_failed`.
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of ranked entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
        '400':
          description: "`validation_failed` (scope invalid for track, e.g. governorate for non-EG or university caller)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard/me:
    get:
      tags: [leaderboard]
      x-stability: draft
      operationId: getMyRank
      summary: Self-rank — computed against the UNFILTERED board (adr-023 private rank)
      description: >
        The only path that sees the caller's position on the full board (including while
        invisible). May differ from the peer-visible dense ranking on /leaderboard.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
      responses:
        '200':
          description: The caller's own rank.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rank: { type: integer, example: 1234 }
                  points: { type: integer }
                  boardSize: { type: integer, description: Total ranked students on the unfiltered board. }
                required: [rank, points, boardSize]
        '400':
          description: "`validation_failed` (scope invalid for track)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (~15 min). 401 `authentication_required` → refresh; 401 `session_superseded` → forced logout.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque (base64 keyset). Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100, minimum: 1 }
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 + Level Up extensions (ADR-026 §5). EVERY non-2xx body has this shape.
      properties:
        type: { type: string }
        title: { type: string, description: Developer-facing English. Never shown to users. }
        status: { type: integer }
        detail: { type: string, description: Developer-facing English. Never shown to users. }
        code: { type: string, description: "Stable machine code from error-codes.md, e.g. otp_expired. The client maps this to AR/EN copy." }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Field → messages (validation_failed only)
        traceId: { type: string }
      required: [title, status, code]
    CursorPage:
      type: object
      description: The one open-ended-list wrapper (ADR-026 §6). items' type varies per endpoint.
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, "null"], description: Opaque. Absent/null = no more pages. }
        hasMore: { type: boolean }
      required: [items, hasMore]
    Uuid:
      type: string
      format: uuid
      description: UUIDv7, opaque to the client (ADR-026 §7).
      example: "0197b2f3-8a11-7cc3-9b4e-3f2a1d6e8c01"
    Phone:
      type: string
      description: E.164 with country code.
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: "+201001234567"
    DeviceInfo:
      type: object
      description: Client-generated STABLE id (survives app restarts, regenerated on reinstall) — the device-binding key (adr-019).
      properties:
        deviceId: { type: string, maxLength: 64 }
        platform: { type: string, enum: [android, ios] }
        model: { type: string, maxLength: 100, description: "Display label for eviction messaging, e.g. \"Redmi Note 12\"." }
      required: [deviceId, platform]
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: JWT, ~15 min. }
        accessExpiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Rotates on every refresh; TTL 60 days. }
        refreshExpiresInSeconds: { type: integer, example: 5184000 }
      required: [accessToken, accessExpiresInSeconds, refreshToken, refreshExpiresInSeconds]
    AuthenticatedResult:
      type: object
      properties:
        result: { type: string, enum: [authenticated] }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        profile: { $ref: '#/components/schemas/StudentProfile' }
      required: [result, tokens, profile]
    RegistrationRequiredResult:
      type: object
      description: New phone — no account. Proceed to POST /auth/register within expiresInSeconds.
      properties:
        result: { type: string, enum: [registrationRequired] }
        registrationToken: { type: string }
        expiresInSeconds: { type: integer, example: 600 }
      required: [result, registrationToken, expiresInSeconds]
    EducationSystem:
      type: string
      description: Extensible — new values may appear additively (STEM future); clients must tolerate unknown values.
      enum: [nationalArabic, nationalLanguages, ig, american, ib]
    Stage:
      type: string
      enum: [prep1, prep2, prep3, secondary1, secondary2, secondary3]
    SchoolRegistration:
      type: object
      description: >
        Geography conditionality (adr-010): country EG → governorateId, cityId, schoolId ALL
        required (schoolName forbidden). Other countries → cityId required, schoolName optional
        free text (schoolId forbidden), governorateId forbidden. Violations → validation_failed
        with a field map.
      properties:
        track: { type: string, enum: [school] }
        registrationToken: { type: string }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string, example: "EG" }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid' }
        schoolId: { $ref: '#/components/schemas/Uuid' }
        schoolName: { type: string, maxLength: 200, description: Non-Egypt only; optional; never blocks registration. }
        stage: { $ref: '#/components/schemas/Stage' }
        educationSystem: { $ref: '#/components/schemas/EducationSystem' }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email, description: Optional — receipts/notifications only, never login (adr-019). }
        avatarId: { $ref: '#/components/schemas/Uuid', description: One of the 20 defaults; omit for server default. }
      required: [track, registrationToken, name, dateOfBirth, countryCode, cityId, stage, educationSystem, parentPhone]
    UniversityRegistration:
      type: object
      description: Egypt-only by shape (no country field — adr-010). Years/faculties are data-driven ids from /reference/universities.
      properties:
        track: { type: string, enum: [university] }
        registrationToken: { type: string }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        universityId: { $ref: '#/components/schemas/Uuid' }
        facultyId: { $ref: '#/components/schemas/Uuid' }
        studyYearId: { $ref: '#/components/schemas/Uuid', description: Must be an `active` year (soon → validation_failed). }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid' }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email }
        avatarId: { $ref: '#/components/schemas/Uuid' }
      required: [track, registrationToken, name, dateOfBirth, universityId, facultyId, studyYearId, governorateId, cityId, parentPhone]
    NamedRef:
      type: object
      description: Generic bilingual reference row (governorate, city, school).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nameAr: { type: string }
        nameEn: { type: string }
      required: [id, nameAr, nameEn]
    StudentProfile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        track: { type: string, enum: [school, university] }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, "null"], format: email }
        dateOfBirth: { type: string, format: date }
        avatar:
          type: object
          properties:
            type: { type: string, enum: [default, custom] }
            id: { $ref: '#/components/schemas/Uuid', description: Present for default avatars. }
            url: { type: string, format: uri }
          required: [type, url]
        geography:
          type: object
          properties:
            countryCode: { type: string, example: "EG" }
            governorate: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }] }
            city: { $ref: '#/components/schemas/NamedRef' }
          required: [countryCode, city]
        school:
          type: [object, "null"]
          description: School-track block (null for university students).
          properties:
            school: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }] }
            schoolName: { type: [string, "null"], description: Free-text school (non-Egypt). }
            stage: { $ref: '#/components/schemas/Stage' }
            educationSystem: { $ref: '#/components/schemas/EducationSystem' }
          required: [stage, educationSystem]
        university:
          type: [object, "null"]
          description: University-track block (null for school students).
          properties:
            university: { $ref: '#/components/schemas/NamedRef' }
            faculty: { $ref: '#/components/schemas/NamedRef' }
            yearNumber: { type: integer }
          required: [university, faculty, yearNumber]
        points:
          type: object
          description: Server-authoritative (adr-003 dual pools). Never computed client-side.
          properties:
            school: { type: integer }
            university: { type: integer }
            total: { type: integer }
          required: [school, university, total]
        level: { type: integer, description: "1–12, thresholds every 500 points; static, not configurable." }
        badges: { type: integer, description: Post-level-12 badges (every 5,000 points; first at 11,000). }
        privacy:
          type: object
          description: adr-023 toggles; defaults preserve visible behavior.
          properties:
            leaderboardVisible: { type: boolean, default: true }
            scoreHidden: { type: boolean, default: false }
          required: [leaderboardVisible, scoreHidden]
        entitlements:
          type: array
          description: Read-only embed for first paint; the paywall source of truth is GET /me/entitlements.
          items: { $ref: '#/components/schemas/EntitlementState' }
        createdAt: { type: string, format: date-time }
      required: [id, track, name, phone, dateOfBirth, avatar, geography, points, level, badges, privacy, entitlements, createdAt]
    EntitlementType:
      type: string
      description: Extensible set (adr-018) — clients must tolerate unknown values additively.
      enum: [baseSubscription, flashcardSubscription]
    EntitlementState:
      type: object
      properties:
        type: { $ref: '#/components/schemas/EntitlementType' }
        active: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
        inGrace: { type: boolean, description: 2-day grace after expiry (requirements §5). }
        graceEndsAt: { type: [string, "null"], format: date-time }
      required: [type, active, inGrace]
    QuestionCounter:
      type: object
      description: Contract-v2 per-lesson/lecture counter — display only, never locks retakes.
      properties:
        answered: { type: integer, description: Distinct questions this student has ever answered in scope. }
        total: { type: integer }
      required: [answered, total]
    SchoolSubjectTree:
      type: object
      properties:
        track: { type: string, enum: [school] }
        units:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                        required: [id, name, questionCounter]
                  required: [id, name, lessons]
            required: [id, name, chapters]
      required: [track, units]
    UniversitySubjectTree:
      type: object
      properties:
        track: { type: string, enum: [university] }
        quizTypes:
          type: array
          items: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision] }
        lectures:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
            required: [id, name, questionCounter]
      required: [track, quizTypes, lectures]
    QuizQuestion:
      type: object
      description: NO correct answer here — grading is server-side on submit.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        text: { type: string, description: Plain text; only <u>…</u> markup allowed. }
        imageUrl: { type: [string, "null"], format: uri, description: Full image (DO Spaces CDN, WebP). }
        thumbnailUrl: { type: [string, "null"], format: uri }
        options:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              text: { type: string }
            required: [id, text]
        isFavorite: { type: boolean }
      required: [id, order, text, options, isFavorite]
    Quiz:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        quizType: { type: [string, "null"], enum: [normal, midTermRevision, finalRevision, practicalRevision, null], description: University only. }
        scopeName: { type: string, description: Lesson/lecture display name (or "Retake wrong"/"Favorites" client-side by mode). }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        createdAt: { type: string, format: date-time }
      required: [id, mode, scopeName, questions, createdAt]
    AnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        correctOptionId: { $ref: '#/components/schemas/Uuid' }
        pointsDelta: { type: integer, description: "0 or 1 (server-side award; 0 on retry replay or free-plan edge)." }
        explanationAvailable: { type: boolean, description: "If true, GET /questions/{questionId}/explanation returns 200/202." }
      required: [correct, correctOptionId, pointsDelta, explanationAvailable]
    QuizSummary:
      type: object
      properties:
        quizId: { $ref: '#/components/schemas/Uuid' }
        score: { type: integer, description: Correct answers. }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        pointsAwarded: { type: integer }
        totalPoints: { type: integer, description: New total after award. }
        level: { type: integer }
        leveledUp: { type: boolean }
        newBadge: { type: boolean }
        questions:
          type: array
          description: Recap rows (full review at GET /quizzes/{id}).
          items:
            type: object
            properties:
              questionId: { $ref: '#/components/schemas/Uuid' }
              answered: { type: boolean }
              correct: { type: [boolean, "null"], description: null when unanswered. }
            required: [questionId, answered]
      required: [quizId, score, totalQuestions, answeredCount, pointsAwarded, totalPoints, level, leveledUp, newBadge, questions]
    QuizHistoryItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
      required: [id, subjectName, scopeName, mode, score, totalQuestions, finishedAt]
    QuizReview:
      type: object
      description: Post-completion review — includes the student's answer AND the correct answer per question (adr-017).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuizQuestion'
              - type: object
                properties:
                  selectedOptionId: { type: [string, "null"], description: null = unanswered. }
                  correctOptionId: { $ref: '#/components/schemas/Uuid' }
                  correct: { type: [boolean, "null"] }
                  explanationAvailable: { type: boolean }
                required: [correctOptionId, explanationAvailable]
      required: [id, subjectName, scopeName, score, totalQuestions, finishedAt, questions]
    LeaderboardEntry:
      type: object
      description: "Privacy-filtered (adr-023): invisible students never appear; board rows inherently show points."
      properties:
        rank: { type: integer, description: Dense rank over VISIBLE students (may differ from self-rank). }
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
        points: { type: integer }
        isMe: { type: boolean }
      required: [rank, studentId, name, avatarUrl, points, isMe]
