        **BEHAVIOURAL CHANGE in 2.3.0-m1 (adr-091).** The subject is gated by **release only** — see
        `GET /catalog/subjects`; **entitlement is not consulted on this read.** A `subjectId` that
        was reachable yesterday can still return `403 insufficient_scope` today, without any schema
