        '400':
          description: "`validation_failed` — `body` missing, over 4000 characters, or empty after trimming with no `attachmentIds`; or `attachmentIds` holds more than 3 ids or repeats one (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114); route to the cancel screen. · `terms_acceptance_required` (spec-067) — the reply carries `attachmentIds` and the caller has not accepted the current Terms; a text reply is never gated."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`not_found` — no such ticket for this caller (unknown, malformed and foreign ids are indistinguishable). · `attachment_not_found` (spec-067) — an id in `attachmentIds` is unknown, malformed, another student's, not `ready`, already attached or older than 24 hours; no reply was written."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`ticket_closed` — the caller's own ticket is closed and takes no reply. There is no reopen: offer to file a new ticket. Checked after ownership, so this never describes someone else's ticket. · `attachment_limit_reached` (spec-067) — the photos would take the ticket over 10; no reply was written."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 60 replies per student per hour. Honour `Retry-After`. Ticket creation has its own, separate budget."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /support/attachments:
    post:
      tags: [support]
      x-stability: stable
      operationId: createSupportAttachmentUpload
      summary: Start a support-photo upload (presigned PUT into private storage)
      description: >
        spec-067. Step 1 of attaching a photo. Declare the photo — its `contentType` (JPEG, PNG or WebP),
        its exact `sizeBytes` (at most 7,000,000) and the lowercase-or-uppercase hex SHA-256 of its bytes —
        and receive an `attachmentId` plus a presigned `upload`: PUT the bytes to `upload.url` with
        EXACTLY the headers in `upload.headers` (they are signed; a missing or changed header fails), before
        `upload.expiresAt` (at most 15 minutes). The bytes go straight to storage, never through the API.
        Then call `completeSupportAttachment`. Nothing is visible to anyone until that call verifies and
        scans the photo.


        Downscale before uploading (about 2048 px on the long edge, JPEG) so a photo stays well under the
        cap. A student may hold at most 10 photos that are not yet attached to a ticket; an unattached
        photo is deleted 24 hours after this call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportAttachmentUploadRequest' }
      responses:
        '201':
          description: Created. No `Location` header. The upload URL is a short-lived write capability for this one photo — never log or share it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAttachmentUpload' }
        '400':
          description: "`validation_failed` — `contentType` not one of the three, `sizeBytes` missing or below 1, or `sha256` not 64 hex characters (field map in `errors`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114). · `terms_acceptance_required` — the caller has not accepted the current Terms; photos need it, text support does not."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`attachment_limit_reached` — the caller already holds 10 photos that are not attached to a ticket. Attach or wait for them to expire (24 hours)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '413':
          description: "`image_too_large` — `sizeBytes` is above 7,000,000."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 30 photo uploads per student per hour. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '503':
          description: "`image_upload_unavailable` — photo storage is not configured or not reachable. Try later; text support still works."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /support/attachments/{attachmentId}/complete:
    post:
      tags: [support]
      x-stability: stable
      operationId: completeSupportAttachment
      summary: Verify and safety-check an uploaded support photo
      description: >
        spec-067. Step 2, after the PUT. The server checks the stored bytes — size, SHA-256, real type
        (magic bytes, so the declared `contentType` must be true), readable dimensions (at most 50
        megapixels), not animated — and then checks the photo with Google SafeSearch. On success the photo
        is `ready` and can be sent with `createSupportTicket` or `postMySupportTicketMessage` (within 24
        hours). Idempotent once `ready`: a repeat call returns the same photo.


        🔴 **A refused photo is gone.** After `413` or either `422` the photo has been deleted and the id is
        dead — nothing is kept and no one ever sees it; to try again, start a fresh upload. A `503` keeps the
        upload: retry this call later. No body.
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: The verified photo, `ready`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAttachment' }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`attachment_not_found` — unknown, malformed, another student's, or already refused (one answer)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '413':
          description: "`image_too_large` — the stored object is above 7,000,000 bytes. The photo was deleted; start a fresh upload."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '422':
          description: "`image_content_invalid` — the stored bytes are not the declared photo (wrong type, size or digest, unreadable or out-of-range dimensions, animated); one answer for every cause. · `image_rejected_by_moderation` — the photo was flagged by the safety check: show \"this photo can't be sent\". Either way the photo was deleted; start a fresh upload."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 30 completes per student per hour, and after 5 refused photos (422) in an hour every complete is refused until the hour clears. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '503':
          description: "`image_upload_unavailable` — storage or the safety check is not configured, down, timed out or gave no usable answer (never treated as a pass). The upload is kept: retry this call later. Text support still works."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /support/tickets/{ticketId}/attachments/{attachmentId}/content:
    get:
      tags: [support]
      x-stability: stable
      operationId: getMySupportAttachmentContent
      summary: The bytes of one photo on one of the caller's own tickets
      description: >
        spec-067. Streams the photo itself (`image/jpeg`, `image/png` or `image/webp`) with
        `X-Content-Type-Options: nosniff` and `Cache-Control: private, max-age=3600`. There is no URL for a
        photo anywhere: this authenticated call is the only way to read one. Before any byte is sent the
        server re-reads and re-hashes the photo; if it is not the photo that was checked, nothing is sent
        and the answer is `410`. Send `Accept: image/*, application/problem+json` so an error body keeps its
        `code`.
      parameters:
        - { name: ticketId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: attachmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: The photo's bytes.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — inside the deletion grace window (adr-114)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`not_found` — no such ticket for this caller (unknown, malformed and foreign ids are indistinguishable). · `attachment_not_found` — the ticket is the caller's but this photo is not on it."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '410':
          description: "`attachment_gone` — the photo existed but is expired (90 days after the ticket closed), was removed by Customer Service at the student's request, or failed its integrity check. Show \"attachment expired\" / \"removed\"."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — at most 300 photo reads per student per hour. Honour `Retry-After`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '503':
          description: "`image_upload_unavailable` — photo storage is not configured or not reachable. Try later."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
