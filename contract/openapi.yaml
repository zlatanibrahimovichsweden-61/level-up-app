        🔴 **A page may come back SHORTER than `pageSize`, and that is not the end of the list.**
        When your remaining allowance cannot pay for the whole page, the server delivers the prefix
        it can pay for, sets `hasMore: true` and returns a `nextCursor` pointing at the first card
        you did NOT receive. **Branch on `hasMore`, never on `items.length`.** When zero cards can be
        delivered the response is `403 flashcard_subscription_required`, not an empty page — an empty
        `items` array means the lecture genuinely has no active cards.


        **A base subscription changes nothing here.** The two subscriptions are independent
        (adr-004/adr-060) — a `baseSubscription` holder without `flashcardSubscription` previews
        exactly like a free student and draws the same shared counter, which their own quiz usage
        does not touch.


        `selfGrade` is YOUR latest grade for that card (see `setFlashcardSelfGrade`) and is `null`
        until you have graded it. `imageUrl` is `null` until a card image CDN origin is configured —
        **nothing is provisioned today, so it is `null` in every environment**, permanently and
        legally; do not treat it as an error.
      parameters:
        - name: lectureId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
          description: >
            Opaque lecture id, from `getSubjectTree`. It grants nothing by being well-formed: it is
            re-resolved against your released enrolment scope on every request.
        - { $ref: '#/components/parameters/Cursor' }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 50, minimum: 1 }
          description: >
            **Max 50, not 100** — narrower than the shared `Limit` parameter on purpose, because a
            page is charged per distinct card against a 50/week allowance and a 100-card page could
            spend a non-holder's whole week in one request.
      responses:
        '200':
          description: >
            A page of cards, possibly EMPTY (the lecture has no active cards) and possibly SHORTER
            than `pageSize` (the weekly allowance truncated it). Order is stable and resumable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FlashcardCard' }
        '400':
          description: "`validation_failed` — a malformed `cursor`, or a `pageSize` outside 1..50."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >
            `insufficient_scope` · `flashcard_subscription_required` · `account_pending_deletion`.


            🔴 **The `insufficient_scope` body is byte-identical for four causes and they are
            deliberately indistinguishable, permanently**: you are on the School track; the lecture
            belongs to another cohort; the lecture's university term is not released for your cohort;
            or that UUID names nothing at all. Do not try to tell them apart and do not build an
            existence probe on this endpoint.


            `flashcard_subscription_required` means the free weekly preview is used up. It is NOT
            `weekly_question_limit_reached` — that code stays quiz-only, because the cure here is the
            flashcard subscription rather than next week.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /flashcards/cards/{flashcardId}/self-grade:
    put:
      tags: [flashcards]
      x-stability: stable
      operationId: setFlashcardSelfGrade
      summary: Record how the student graded themselves on one card — latest value only
      description: >
        Stores YOUR latest grade for one card and answers `204`. Idempotent: sending the same value
        twice is `204` both times.


        🔴 **The server keeps the LATEST grade and nothing else.** There is no history, no score, no
        streak and no review schedule — a second grade replaces the first. The value exists so the
        client can offer a "show me my *again* cards" filter that survives a reinstall or a second
        device. Do not build spaced repetition on it; none is specified anywhere.


        **Same gate as the card list.** You may grade a card you could currently be delivered: in
        released scope, and either covered by an active `flashcardSubscription` or already delivered
        to you this week. Anything else is the same `403 insufficient_scope` the list returns —
        including a card that exists but was never shown to you, for the same no-existence-oracle
        reason.
      parameters:
        - name: flashcardId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
          description: Opaque card id, from `getFlashcardsForLecture`. Treated as hostile and re-resolved server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grade: { $ref: '#/components/schemas/FlashcardSelfGrade' }
              required: [grade]
      responses:
        '204':
          description: Recorded. The next `getFlashcardsForLecture` page echoes it back in `selfGrade`.
        '400':
          description: "`validation_failed` — `grade` missing, or not one of `gotIt` / `again`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >
            `insufficient_scope` · `account_pending_deletion`. The four indistinguishable causes on
            `getFlashcardsForLecture` apply here too, plus a fifth that collapses into them: a card in
            released scope that you have neither a subscription for nor were delivered this week.


            **`flashcard_subscription_required` is deliberately NOT returned here.** Grading a card
            you were never shown has exhausted nothing, so saying "a subscription would fix it" would
            be both false and a confirmation that the card exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /subscription-codes/redemptions:
    post:
      tags: [commerce]
      x-stability: stable
      x-consumers: [web]   # adr-049 §4 — the app never mentions voucher redemption
      x-behaviour-changed: 3.32.0-m1
      operationId: redeemSubscriptionCode
      summary: Redeem a prepaid subscription code (adr-016 — single-use, 4-month, atomic)
      description: >
        Same entitlement-grant path as a verified payment; single-use enforced atomically
        server-side.


        **BEHAVIOURAL CHANGE in 3.21.0-m1 (adr-174 D5) — a submission that is STILL RUNNING no
        longer claims to have finished.** While one submission for a redemption session is in
        flight, a second one now answers `403 redemption_in_progress` instead of `403
        redemption_scope_only`. Both are refusals and the one-redemption-per-session bound is
        byte-unchanged; what moved is that the old answer told the student their redemption had
        *already completed* and sent them to read a grant that did not exist yet. **It is not a
        `409`** — `409` is `code_already_redeemed` on this operation and reusing it would put two
        causes behind one code again. **Corrected in 3.32.0-m1:** `redemption_in_progress` means a
        submission for this session has **not been recorded as finished** — usually it is still
        running; rarely it finished but its completion could not be recorded, so something may
        already be granted. On `redemption_in_progress`: wait, then read `GET /me/entitlements`. Do
        not re-submit — a second submission cannot win and it is counted against the attempt limit.


        **BEHAVIOURAL CHANGE in 3.20.0-m1 (adr-171 D7.3), restated because it still stands — the
        schema did not move, the MEANING did.** Re-posting a code **that this same student already
        redeemed** is answered as a replay of their own redemption: `201` with the student's
        **current** entitlement state for the type that code funded, recomputed now. **Corrected in
        3.32.0-m1:** it is not a copy of the first response, so it can differ from it — for example
        the entitlement may have been extended, or may have lapsed since. It used to answer `409
        code_already_redeemed`. A code still funds exactly one grant — the replay writes nothing —
        and a **different** student posting a spent code still receives `409
        code_already_redeemed`, byte-identical to before.


        🔴 **WHICH SESSION replays — corrected in 3.21.0-m1 and again in 3.32.0-m1; the
        difference decides what you build.** Within **one** web redemption session the replay is
        never reached: that session spends its one redemption and then refuses this operation with
        `403 redemption_scope_only` for the rest of its ten minutes, before the replay path is
        entered. A **new** web redemption session (a fresh OTP verify) does reach it: the same
        student re-entering the same code there is answered with the `201` above.


        **Web: never re-submit automatically, at any layer (adr-171 D7.1). After an unknown
        outcome (a `500`, a timeout or a dropped connection), first read `GET /me/entitlements`
        (D7.4). It shows current access, not proof that this code was used. If the student chooses
        to start again, re-entering the same code in a NEW redemption session is safe: it returns
        `201` (a replay of their own earlier redemption, or a first redemption if the earlier one
        never committed) or `409` if another student holds it. It never grants twice. Within ONE
        session, a submission after one that reached its commit is refused `403`.**


        **Why the client must care.** A response lost in flight after the server committed used to
        be indistinguishable, on retry, from somebody else's spent code; there is no code revocation
        in v1, so a student whose redemption *succeeded* was shown a failure with no remedy. Recover
        a lost or unknown response by re-reading `GET /me/entitlements` — never by asking the
        student to type the code again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: The voucher code as printed/sold. }
              required: [code]
      responses:
        '201':
          description: Redeemed — the granted entitlement state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementState' }
        '400':
          description: >-
            `validation_failed` — `code` is absent, empty, or not a well-formed code (wrong length,
            or a character outside the alphabet). **A typo is a `400`, never a `404`**: the
            not-found answer means "this code does not exist", and collapsing an unreadable input
            into it would make that answer say less than it does. A body that is not JSON, or that
            is sent without a `Content-Type`, lands here too rather than on a `415` this operation
            does not declare.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`code_invalid` (unknown code)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >-
            TWO codes since 3.21.0-m1, and they mean different things — **branch on `code`, never on
            the status** (adr-174 D5).


            `redemption_scope_only` — the caller holds a redemption-scoped web session whose one
            redemption **reached its commit** (adr-171 D3.7); it almost always committed, and if the
            commit itself failed it may not have — read `GET /me/entitlements` to see what was
            granted. The session stays alive and read-only until its ten minutes elapse. Do **not**
            re-submit and do **not** ask the student to re-type the code.


            `redemption_in_progress` — a submission for this session has **not been recorded as
            finished**: usually it is still running; rarely it finished but its completion could not
            be recorded, so something may already be granted. Wait, then read `GET
            /me/entitlements`. Do **not** re-submit: a second submission cannot win, and it is
            counted against the `429` attempt limit below. **This was previously
            `redemption_scope_only` too**, which told the student their redemption had finished
            when it had not.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: >-
            `code_already_redeemed` — the code was redeemed by a **different** student. Unchanged in
            3.20.0-m1; the caller's OWN earlier redemption now replays as `201` instead (see the
            operation description).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: >-
            `rate_limited` — a per-student limit on redemption attempts, **counted on failures and
            successes alike**. A code is a bearer instrument, so this bounds guessing rather than
            load; a student redeeming a code they were sold types it once, twice if they mistyped
            it, and will never meet it. **Honour `Retry-After`** and do not retry in a loop.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '500':
          description: >-
            `internal_error` — **declared in 3.21.0-m1. The operation has always been able to answer
            it; the contract did not say so** (adr-174 D3.1). **Corrected in 3.32.0-m1: a `500` here
            has more than one cause and the client cannot tell them apart, so treat every `500` —
            and every timeout or dropped connection on this call — as an UNKNOWN outcome.** If the
            session store was unreachable, the request failed closed and mutated nothing (adr-171
            D7.5). But a `500` can also follow the redemption being saved — for example the commit
            went through and only its acknowledgement was lost — and then the grant may be durable
            even though the response says `internal_error`.


            🔴 **Recovery, and what to tell the student.** Read `GET /me/entitlements`: it shows the
            student's current access, which is not proof of what happened to this code. Build an
            unknown-outcome state with neutral, actionable copy that sends the student to check their
            current access; the contract does not prescribe the words. Keep adr-171 D7.8's rule —
            never tell the student their code may have been used — and the app's vocabulary rules
            (no price, no "buy", no "purchase", no "payment", no provider name).


            🔴 **Retry guidance, corrected in 3.21.0-m1 and again in 3.32.0-m1** (adr-174
            D3.2/D3.3). Earlier copy said to *retry after the store recovers*. That is not literally
            available: the redemption session, its OTP and the per-request check are all held in the
            same store behind a ten-minute lifetime, so a long outage means **start the redemption
            again from the beginning**, not resume. And **do not retry in a loop** — the `429`
            attempt limit above is enforced in the API process, keeps counting straight through the
            outage, and an obedient retry loop will spend the student's attempts and earn a `429` the
            moment the store comes back. **Do not retry automatically; read `GET /me/entitlements`
            first; try once more only on the student's action, then start again** (adr-174 D3.2).
            Starting again is safe: re-entering the same code in a new redemption session never
            grants twice (see the operation description).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard:
    get:
      tags: [leaderboard]
      x-stability: stable
      x-behaviour-changed: 3.4.0-m1
      operationId: getLeaderboard
      summary: Scoped board (adr-015), privacy-filtered (adr-023), cursor over rank order
      description: >
        The concrete board is derived from the CALLER's registration — no cross-picking.
        School scopes: `system` (own education system + country) · `governorate` (Egypt-only
        sub-scope). University scopes: `cohort` (الدفعة — university+faculty+year) · `global`.
        BOTH adr-023 privacy toggles remove a student from this board (adr-111): a student with
        `leaderboardVisible: false` AND a student with `scoreHidden: true` are excluded before
        ranking, so *visible* here means NEITHER invisible NOR score-hidden. Peer ranks are
        therefore DENSE over visible students. Each caller's board ALSO excludes every student
        blocked in either direction between them and the caller (adr-185 D8), exactly as an
        invisible student is excluded, so ranks stay dense from the caller's point of view and a
        block never shows as a gap. Since 3.2.0-m1, board rank and self-rank are
        computed over the same caller-visible population and agree by construction. A score-hidden
        student is never rendered with a blanked score — the row is absent entirely, which is why
        `points` stays required on `LeaderboardEntry`. The exclusion is unconditional and applies
        to the CALLER too: a score-hidden or invisible caller does not appear on their own page.
        An INVISIBLE caller reads their own standing from `/leaderboard/me`, which since 3.2.0-m1
        ranks over this same visible population; a SCORE-HIDDEN caller gets `403` there and has no
        self-rank to render at all (adr-113).
        BOUNDED LIST (new in 3.4.0-m1): this endpoint renders AT MOST THE TOP 200 students visible to the caller
        across a complete page-walk. It is a bound on rows emitted — not on the board and not on the
        ranking. `rank` still means the student's exact position in the caller-visible population, so the
        last row you can ever reach is `rank: 200`.
        `hasMore: false` therefore has TWO causes now — the end of the visible board, OR the 200-row
        limit — and a client cannot tell them apart, nor does it need to: either way there is no
        further page and `nextCursor` is `null`.
        IMPORTANT for the client: a caller ranked below 200 appears on NO page, so `isMe` may never
        be true on any row. A client that wants the caller's own standing calls `GET /leaderboard/me`
        — DO NOT page looking for `isMe`, because for such a student that loop never terminates.
        Consequence for the client: a page may carry FEWER rows than `limit` even when
        `hasMore` is false, and the set of students on a board can shrink without anyone leaving it.
        SHORT PAGES (clarified in 3.7.0-m1): this endpoint bounds the work ONE request will do, so a
        page may return FEWER ROWS THAN YOU ASKED FOR — including zero — while `hasMore` is `true`.
        KEEP PAGING UNTIL `hasMore` IS `false`. A short page is not the end of the list and never
        was: `hasMore` has always been the terminal signal and `nextCursor` the resume token. This
        is a clarification of a state the schema already permitted, not a new field, code, `rank`
        meaning, `boardSize` meaning or cursor semantic — nothing on the wire moved.
        `limit` IS VALIDATED, NOT CLAMPED (clarified in 3.7.0-m1): on THIS operation a `limit`
        outside `1…100` is rejected with `400 validation_failed` on field `limit` — it is not
        quietly reduced to `100`. That is what the published `minimum: 1, maximum: 100` schema has
        said all along; it is stated here in prose because the schema alone left it ambiguous.
        Figma rendering: this endpoint is ONE ranked board. The top three entries may be rendered
        as the podium and the remaining entries as the ordinary ranked rows shown below it; those
        are two visual treatments of the same ordered list, not two ranking systems. Do not add a
        synthetic self-rank row to the board. If the client needs the caller's exact standing below
        the published display bound (currently 200), call `GET /leaderboard/me` as a separate optional read; a `scoreHidden` caller
        receives its documented `403` and the board is rendered without a self-rank element.
        Cursor: an OPAQUE, server-signed token resuming after the last row you were shown. It is
        not decodable, not constructible client-side, and expires — treat it as a value to echo
        back unchanged, never to parse, store long-term, or share. A cursor is valid only for the
        `scope` it was issued for; an altered, expired, foreign-scope or hand-made cursor is
        `validation_failed` on field `cursor`, and the remedy is always the same: request page one
        again. A page may also shift between calls (live sets) — tolerate duplicates/gaps at page
        seams.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
          description: Must be valid for the caller's track — else `validation_failed`.
        # Declared inline instead of $ref'ing components.parameters.Cursor: that shared description
        # says "base64 keyset", which is true of the other paginated lists and NOT of this one. A
        # generated client renders the parameter description, not the operation prose, so a $ref
        # here would publish "decode me" next to a token that must never be decoded.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >
            Opaque, server-signed and EXPIRING. Echo it back unchanged; it is not decodable and
            cannot be constructed client-side. Omit for the first page. Valid only for the `scope`
            it was issued for. Altered, expired, foreign-scope or hand-made ⇒ `validation_failed`
            on field `cursor`; the remedy is always to request page one again.
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of ranked entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
        '400':
          description: "`validation_failed` (scope invalid for track, e.g. governorate for non-EG or university caller)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114). Not an error to retry and not a logout; route to the cancel screen from the same global interceptor that already handles this code elsewhere. DECLARED from 3.5.1-m1, but REACHABLE since 3.3.0-m1 — this operation simply failed to declare it."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — per-student limit on the leaderboard reads. Honour `Retry-After`; do not retry in a tight loop."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '500':
          description: "`internal_error` — the board's projection could not be reached. `traceId` is the support handle."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard/me:
    get:
      tags: [leaderboard]
      x-stability: stable
      x-behaviour-changed: 3.9.0-m1
      operationId: getMyRank
      summary: Self-rank — computed over the VISIBLE leaderboard population (adr-113)
      description: >
        The caller's own position among the students the caller's board actually shows (students blocked
        either way with the caller are excluded, adr-185 D8). Since adr-113 this is
        the SAME population `GET /leaderboard` pages, so `rank` here and the caller's rank there
        agree — they used to be able to disagree, and differencing them recovered how many students
        the board was hiding. A caller with `leaderboardVisible: false` still gets a rank: their
        notional position within the visible population, since hiding from peers has never meant
        hiding from yourself. A caller with `scoreHidden: true` gets `403`; see below.
        UNAFFECTED by `GET /leaderboard`'s 200-row display limit (new in 3.4.0-m1): `rank` here is
        exact and uncapped for every caller, so a student at position 5,000 is told 5,000. This is
        the endpoint to call for the caller's own standing, and below the published display bound
        (currently 200) it is the only one that can answer.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
      responses:
        '200':
          description: The caller's own rank among the visible population.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rank:
                    type: integer
                    minimum: 1
                    example: 1234
                    description: >
                      1-based position among the students VISIBLE to the caller (blocked either way excluded,
                      adr-185 D8), ordered exactly as GET /leaderboard
                      orders them. Changed in 3.2.0-m1 — it was the position on the unfiltered board.
                      Guaranteed `>= 1` and `<= boardSize + 1` on every 200, bounded at the response
                      boundary since 3.9.0-m1 (adr-120). The upper bound is a relationship between
                      two fields and cannot be expressed as a schema `maximum`, so it is stated here.
                  points:
                    type: integer
                    description: >
                      The caller's score on this board's pool. Deliberately carries NO `minimum`:
                      unlike `rank` and `boardSize` it is not bounded at the response boundary, so a
                      lower bound here would be a promise the server does not enforce.
                  boardSize:
                    type: integer
                    minimum: 0
                    description: >
                      Number of students on the board VISIBLE to the caller (not invisible, not score-hidden, not
                      blocked either way with the caller, adr-185 D8). Changed in 3.2.0-m1 — it was the
                      unfiltered total, so this number is now SMALLER for any board holding a
                      student who has opted out. It is the TOTAL visible population and MAY EXCEED
                      the number of rows `GET /leaderboard` will ever render (200) — it is not a
                      page count and must not be used to predict how far the list can be paged.
                      Guaranteed `>= 0` on every 200, bounded at the response boundary since
                      3.9.0-m1 (adr-120).
                required: [rank, points, boardSize]
        '400':
          description: "`validation_failed` (scope invalid for track)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`score_hidden_leaderboard_unavailable` — the caller has `scoreHidden: true`, so this operation is unavailable to them. Not an error to retry; render the board without a self-rank row. · `account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114); route to the cancel screen, do not log out and do not retry. DECLARED from 3.5.1-m1, but REACHABLE since 3.3.0-m1 — this operation simply failed to name it. Read `code` to tell the two apart."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`not_ranked` — the caller has never been awarded points, so they are on no leaderboard and have no rank. This is NOT an error to retry and NOT a missing endpoint: it is the ordinary state of a student who has not answered a question yet. Render the board without a self-rank element — the same display state you already use for `403 score_hidden_leaderboard_unavailable` — and show the not-ranked-yet copy. A caller who has scored ALWAYS receives 200, including a caller with 0 points in this board's pool and a caller with `leaderboardVisible: false`, who still receives their notional position (adr-113)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — per-student limit on the leaderboard reads. Honour `Retry-After`; do not retry in a tight loop."
