      summary: The caller's own tickets, most recently active first (cursor-paginated)
      description: >
        The caller's tickets only — never anyone else's. Ordered by `lastActivityAt` descending, ties
        broken by `ticketId` descending; pages of 20 (this operation takes no `limit`). A reply bumps
        its ticket's `lastActivityAt`, so a ticket can move to the top between pages; page with the
        returned cursor and branch on `hasMore`, never on `items.length`.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
      responses:
