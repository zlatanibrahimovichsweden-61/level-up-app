        The Anatomy Flashcards study surface. **University track only**, and the refusal for
        everyone else is deliberately indistinguishable — see the `403` below.


        **Two ways to receive cards.** With an ACTIVE `flashcardSubscription` (see
        `GET /me/entitlements`) every page is delivered in full and nothing is counted. Without one,
        each card you have not already been shown THIS WEEK consumes one unit of the **same 50/week
        free allowance quiz questions draw from** — one allowance across both surfaces, not 50 each.
        A card you were already charged for this week re-delivers **free**, so paging back and forth
        through a lecture never costs twice.


        🔴 **A page may come back SHORTER than `pageSize`, and that is not the end of the list.**
        When your remaining allowance cannot pay for the whole page, the server delivers the prefix
        it can pay for, sets `hasMore: true` and returns a `nextCursor` pointing at the first card
        you did NOT receive. **Branch on `hasMore`, never on `items.length`.** When zero cards can be
        delivered the response is `403 flashcard_subscription_required`, not an empty page — an empty
        `items` array means the lecture genuinely has no active cards.


        **A base subscription changes nothing here.** The two subscriptions are independent
        (adr-004/adr-060) — a `baseSubscription` holder without `flashcardSubscription` previews
        exactly like a free student and draws the same shared counter, which their own quiz usage
        does not touch.


        `selfGrade` is YOUR latest grade for that card (see `setFlashcardSelfGrade`) and is `null`
        until you have graded it. `imageUrl` is `null` until a card image CDN origin is configured —
        **nothing is provisioned today, so it is `null` in every environment**, permanently and
        legally; do not treat it as an error.
      parameters:
        - name: lectureId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
          description: >
            Opaque lecture id, from `getSubjectTree`. It grants nothing by being well-formed: it is
            re-resolved against your released enrolment scope on every request.
        - { $ref: '#/components/parameters/Cursor' }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 50, minimum: 1 }
          description: >
            **Max 50, not 100** — narrower than the shared `Limit` parameter on purpose, because a
            page is charged per distinct card against a 50/week allowance and a 100-card page could
            spend a non-holder's whole week in one request.
      responses:
        '200':
          description: >
            A page of cards, possibly EMPTY (the lecture has no active cards) and possibly SHORTER
            than `pageSize` (the weekly allowance truncated it). Order is stable and resumable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FlashcardCard' }
        '400':
          description: "`validation_failed` — a malformed `cursor`, or a `pageSize` outside 1..50."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >
            `insufficient_scope` · `flashcard_subscription_required` · `account_pending_deletion`.


            🔴 **The `insufficient_scope` body is byte-identical for four causes and they are
            deliberately indistinguishable, permanently**: you are on the School track; the lecture
            belongs to another cohort; the lecture's university term is not released for your cohort;
            or that UUID names nothing at all. Do not try to tell them apart and do not build an
            existence probe on this endpoint.


            `flashcard_subscription_required` means the free weekly preview is used up. It is NOT
            `weekly_question_limit_reached` — that code stays quiz-only, because the cure here is the
            flashcard subscription rather than next week.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /flashcards/cards/{flashcardId}/self-grade:
    put:
      tags: [flashcards]
      x-stability: stable
      operationId: setFlashcardSelfGrade
      summary: Record how the student graded themselves on one card — latest value only
      description: >
        Stores YOUR latest grade for one card and answers `204`. Idempotent: sending the same value
        twice is `204` both times.


        🔴 **The server keeps the LATEST grade and nothing else.** There is no history, no score, no
        streak and no review schedule — a second grade replaces the first. The value exists so the
        client can offer a "show me my *again* cards" filter that survives a reinstall or a second
        device. Do not build spaced repetition on it; none is specified anywhere.


        **Same gate as the card list.** You may grade a card you could currently be delivered: in
        released scope, and either covered by an active `flashcardSubscription` or already delivered
        to you this week. Anything else is the same `403 insufficient_scope` the list returns —
        including a card that exists but was never shown to you, for the same no-existence-oracle
        reason.
      parameters:
        - name: flashcardId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
          description: Opaque card id, from `getFlashcardsForLecture`. Treated as hostile and re-resolved server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grade: { $ref: '#/components/schemas/FlashcardSelfGrade' }
              required: [grade]
      responses:
        '204':
          description: Recorded. The next `getFlashcardsForLecture` page echoes it back in `selfGrade`.
        '400':
          description: "`validation_failed` — `grade` missing, or not one of `gotIt` / `again`."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >
            `insufficient_scope` · `account_pending_deletion`. The four indistinguishable causes on
            `getFlashcardsForLecture` apply here too, plus a fifth that collapses into them: a card in
            released scope that you have neither a subscription for nor were delivered this week.


            **`flashcard_subscription_required` is deliberately NOT returned here.** Grading a card
            you were never shown has exhausted nothing, so saying "a subscription would fix it" would
            be both false and a confirmation that the card exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /subscription-codes/redemptions:
    post:
      tags: [commerce]
      x-stability: stable
      x-consumers: [web]   # adr-049 §4 — the app never mentions voucher redemption
      x-behaviour-changed: 3.21.0-m1
      operationId: redeemSubscriptionCode
      summary: Redeem a prepaid subscription code (adr-016 — single-use, 4-month, atomic)
      description: >
        Same entitlement-grant path as a verified payment; single-use enforced atomically
        server-side.


        **BEHAVIOURAL CHANGE in 3.21.0-m1 (adr-174 D5) — a submission that is STILL RUNNING no
        longer claims to have finished.** While one submission for a redemption session is in
        flight, a second one now answers `403 redemption_in_progress` instead of `403
        redemption_scope_only`. Both are refusals and the one-redemption-per-session bound is
        byte-unchanged; what moved is that the old answer told the student their redemption had
        *already completed* and sent them to read a grant that did not exist yet. **It is not a
        `409`** — `409` is `code_already_redeemed` on this operation and reusing it would put two
        causes behind one code again. On `redemption_in_progress`: wait, then read `GET
        /me/entitlements`. Do not re-submit — a second submission cannot win and it is counted
        against the attempt limit.


        **BEHAVIOURAL CHANGE in 3.20.0-m1 (adr-171 D7.3), restated because it still stands — the
        schema did not move, the MEANING did.** Re-posting a code **that this same student already
        redeemed** replays the original success: `201` with the entitlement state that code funded,
        exactly as the first call returned it. It used to answer `409 code_already_redeemed`. A code
        still funds exactly one grant — the replay writes nothing — and a **different** student
        posting a spent code still receives `409 code_already_redeemed`, byte-identical to before.


        🔴 **WHICH SESSION replays, corrected in 3.21.0-m1 — the 3.20.0-m1 entry did not say, and
        the difference decides what you build.** The `201` replay above is reached by an **app
        session**. On the **web redemption session** — the only consumer this operation declares —
        it is **NOT reachable**: that session spends its one redemption and then refuses this
        operation with `403 redemption_scope_only` for the rest of its ten minutes, before the
        replay path is ever entered. **Web: do not build a re-submit-is-safe retry. Your recovery
        is `GET /me/entitlements`, which that session keeps answering, and it is the only one.**


        **Why the client must care.** A response lost in flight after the server committed used to
        be indistinguishable, on retry, from somebody else's spent code; there is no code revocation
        in v1, so a student whose redemption *succeeded* was shown a failure with no remedy. Recover
        a lost or unknown response by re-reading `GET /me/entitlements` — never by asking the
        student to type the code again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: The voucher code as printed/sold. }
              required: [code]
      responses:
        '201':
          description: Redeemed — the granted entitlement state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementState' }
        '400':
          description: >-
            `validation_failed` — `code` is absent, empty, or not a well-formed code (wrong length,
            or a character outside the alphabet). **A typo is a `400`, never a `404`**: the
            not-found answer means "this code does not exist", and collapsing an unreadable input
            into it would make that answer say less than it does. A body that is not JSON, or that
            is sent without a `Content-Type`, lands here too rather than on a `415` this operation
            does not declare.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`code_invalid` (unknown code)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: >-
            TWO codes since 3.21.0-m1, and they mean different things — **branch on `code`, never on
            the status** (adr-174 D5).


            `redemption_scope_only` — the caller holds a redemption-scoped web session whose one
            redemption has **already COMMITTED** (adr-171 D3.7). The session stays alive and
            read-only until its ten minutes elapse: read `GET /me/entitlements` to see what was
            granted. Do **not** re-submit and do **not** ask the student to re-type the code.


            `redemption_in_progress` — a submission for this session is **running right now** and
            nothing has been granted yet. Wait for it, then read `GET /me/entitlements`. Do **not**
            re-submit: a second submission cannot win, and it is counted against the `429` attempt
            limit below. **This was previously `redemption_scope_only` too**, which told the student
            their redemption had finished when it had not.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: >-
            `code_already_redeemed` — the code was redeemed by a **different** student. Unchanged in
            3.20.0-m1; the caller's OWN earlier redemption now replays as `201` instead (see the
            operation description).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: >-
            `rate_limited` — a per-student limit on redemption attempts, **counted on failures and
            successes alike**. A code is a bearer instrument, so this bounds guessing rather than
            load; a student redeeming a code they were sold types it once, twice if they mistyped
            it, and will never meet it. **Honour `Retry-After`** and do not retry in a loop.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '500':
          description: >-
            `internal_error` — **declared in 3.21.0-m1. The operation has always been able to answer
            it; the contract did not say so** (adr-174 D3.1). The session store was unreachable, so
            this request **granted nothing and consumed no code** — it fails closed and mutates
            nothing (adr-171 D7.5). The student's code is untouched and still redeemable.


            🔴 **What to tell the student, and what NOT to.** Never say the code may have been used:
            it was not. Neutral, actionable copy only, under the app's vocabulary rules (no price,
            no "buy", no "purchase", no "payment", no provider name).


            🔴 **Retry guidance, corrected in 3.21.0-m1** (adr-174 D3.2/D3.3). Earlier copy said to
            *retry after the store recovers*. That is not literally available: the redemption
            session, its OTP and the per-request check are all held in the same store behind a
            ten-minute lifetime, so a long outage means **start the redemption again from the
            beginning**, not resume. And **do not retry in a loop** — the `429` attempt limit above
            is enforced in the API process, keeps counting straight through the outage, and an
            obedient retry loop will spend the student's attempts and earn a `429` the moment the
            store comes back. **Try once more after a moment; if it keeps failing, start again.**
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard:
    get:
      tags: [leaderboard]
      x-stability: stable
      x-behaviour-changed: 3.4.0-m1
      operationId: getLeaderboard
      summary: Scoped board (adr-015), privacy-filtered (adr-023), cursor over rank order
      description: >
        The concrete board is derived from the CALLER's registration — no cross-picking.
        School scopes: `system` (own education system + country) · `governorate` (Egypt-only
        sub-scope). University scopes: `cohort` (الدفعة — university+faculty+year) · `global`.
        BOTH adr-023 privacy toggles remove a student from this board (adr-111): a student with
        `leaderboardVisible: false` AND a student with `scoreHidden: true` are excluded before
        ranking, so *visible* here means NEITHER invisible NOR score-hidden. Peer ranks are
        therefore DENSE over visible students. Since 3.2.0-m1, board rank and self-rank are
        computed over the same visible population and agree by construction. A score-hidden
        student is never rendered with a blanked score — the row is absent entirely, which is why
        `points` stays required on `LeaderboardEntry`. The exclusion is unconditional and applies
        to the CALLER too: a score-hidden or invisible caller does not appear on their own page.
        An INVISIBLE caller reads their own standing from `/leaderboard/me`, which since 3.2.0-m1
        ranks over this same visible population; a SCORE-HIDDEN caller gets `403` there and has no
        self-rank to render at all (adr-113).
        BOUNDED LIST (new in 3.4.0-m1): this endpoint renders AT MOST THE TOP 200 visible students
        across a complete page-walk. It is a bound on rows emitted — not on the board and not on the
        ranking. `rank` still means the student's exact position in the visible population, so the
        last row you can ever reach is `rank: 200`.
        `hasMore: false` therefore has TWO causes now — the end of the visible board, OR the 200-row
        limit — and a client cannot tell them apart, nor does it need to: either way there is no
        further page and `nextCursor` is `null`.
        IMPORTANT for the client: a caller ranked below 200 appears on NO page, so `isMe` may never
        be true on any row. A client that wants the caller's own standing calls `GET /leaderboard/me`
        — DO NOT page looking for `isMe`, because for such a student that loop never terminates.
        Consequence for the client: a page may carry FEWER rows than `limit` even when
        `hasMore` is false, and the set of students on a board can shrink without anyone leaving it.
        SHORT PAGES (clarified in 3.7.0-m1): this endpoint bounds the work ONE request will do, so a
        page may return FEWER ROWS THAN YOU ASKED FOR — including zero — while `hasMore` is `true`.
        KEEP PAGING UNTIL `hasMore` IS `false`. A short page is not the end of the list and never
        was: `hasMore` has always been the terminal signal and `nextCursor` the resume token. This
        is a clarification of a state the schema already permitted, not a new field, code, `rank`
        meaning, `boardSize` meaning or cursor semantic — nothing on the wire moved.
        `limit` IS VALIDATED, NOT CLAMPED (clarified in 3.7.0-m1): on THIS operation a `limit`
        outside `1…100` is rejected with `400 validation_failed` on field `limit` — it is not
        quietly reduced to `100`. That is what the published `minimum: 1, maximum: 100` schema has
        said all along; it is stated here in prose because the schema alone left it ambiguous.
        Figma rendering: this endpoint is ONE ranked board. The top three entries may be rendered
        as the podium and the remaining entries as the ordinary ranked rows shown below it; those
        are two visual treatments of the same ordered list, not two ranking systems. Do not add a
        synthetic self-rank row to the board. If the client needs the caller's exact standing below
        the published display bound (currently 200), call `GET /leaderboard/me` as a separate optional read; a `scoreHidden` caller
        receives its documented `403` and the board is rendered without a self-rank element.
        Cursor: an OPAQUE, server-signed token resuming after the last row you were shown. It is
        not decodable, not constructible client-side, and expires — treat it as a value to echo
        back unchanged, never to parse, store long-term, or share. A cursor is valid only for the
        `scope` it was issued for; an altered, expired, foreign-scope or hand-made cursor is
        `validation_failed` on field `cursor`, and the remedy is always the same: request page one
        again. A page may also shift between calls (live sets) — tolerate duplicates/gaps at page
        seams.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
          description: Must be valid for the caller's track — else `validation_failed`.
        # Declared inline instead of $ref'ing components.parameters.Cursor: that shared description
        # says "base64 keyset", which is true of the other paginated lists and NOT of this one. A
        # generated client renders the parameter description, not the operation prose, so a $ref
        # here would publish "decode me" next to a token that must never be decoded.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: >
            Opaque, server-signed and EXPIRING. Echo it back unchanged; it is not decodable and
            cannot be constructed client-side. Omit for the first page. Valid only for the `scope`
            it was issued for. Altered, expired, foreign-scope or hand-made ⇒ `validation_failed`
            on field `cursor`; the remedy is always to request page one again.
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of ranked entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
        '400':
          description: "`validation_failed` (scope invalid for track, e.g. governorate for non-EG or university caller)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114). Not an error to retry and not a logout; route to the cancel screen from the same global interceptor that already handles this code elsewhere. DECLARED from 3.5.1-m1, but REACHABLE since 3.3.0-m1 — this operation simply failed to declare it."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — per-student limit on the leaderboard reads. Honour `Retry-After`; do not retry in a tight loop."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '500':
          description: "`internal_error` — the board's projection could not be reached. `traceId` is the support handle."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /leaderboard/me:
    get:
      tags: [leaderboard]
      x-stability: stable
      x-behaviour-changed: 3.9.0-m1
      operationId: getMyRank
      summary: Self-rank — computed over the VISIBLE leaderboard population (adr-113)
      description: >
        The caller's own position among the students a board actually shows. Since adr-113 this is
        the SAME population `GET /leaderboard` pages, so `rank` here and the caller's rank there
        agree — they used to be able to disagree, and differencing them recovered how many students
        the board was hiding. A caller with `leaderboardVisible: false` still gets a rank: their
        notional position within the visible population, since hiding from peers has never meant
        hiding from yourself. A caller with `scoreHidden: true` gets `403`; see below.
        UNAFFECTED by `GET /leaderboard`'s 200-row display limit (new in 3.4.0-m1): `rank` here is
        exact and uncapped for every caller, so a student at position 5,000 is told 5,000. This is
        the endpoint to call for the caller's own standing, and below the published display bound
        (currently 200) it is the only one that can answer.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [system, governorate, cohort, global] }
      responses:
        '200':
          description: The caller's own rank among the visible population.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rank:
                    type: integer
                    minimum: 1
                    example: 1234
                    description: >
                      1-based position among VISIBLE students, ordered exactly as GET /leaderboard
                      orders them. Changed in 3.2.0-m1 — it was the position on the unfiltered board.
                      Guaranteed `>= 1` and `<= boardSize + 1` on every 200, bounded at the response
                      boundary since 3.9.0-m1 (adr-120). The upper bound is a relationship between
                      two fields and cannot be expressed as a schema `maximum`, so it is stated here.
                  points:
                    type: integer
                    description: >
                      The caller's score on this board's pool. Deliberately carries NO `minimum`:
                      unlike `rank` and `boardSize` it is not bounded at the response boundary, so a
                      lower bound here would be a promise the server does not enforce.
                  boardSize:
                    type: integer
                    minimum: 0
                    description: >
                      Number of VISIBLE students on the board. Changed in 3.2.0-m1 — it was the
                      unfiltered total, so this number is now SMALLER for any board holding a
                      student who has opted out. It is the TOTAL visible population and MAY EXCEED
                      the number of rows `GET /leaderboard` will ever render (200) — it is not a
                      page count and must not be used to predict how far the list can be paged.
                      Guaranteed `>= 0` on every 200, bounded at the response boundary since
                      3.9.0-m1 (adr-120).
                required: [rank, points, boardSize]
        '400':
          description: "`validation_failed` (scope invalid for track)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`score_hidden_leaderboard_unavailable` — the caller has `scoreHidden: true`, so this operation is unavailable to them. Not an error to retry; render the board without a self-rank row. · `account_pending_deletion` — the caller's account is inside the 30-day deletion grace window, during which every authenticated endpoint but four is unavailable (adr-114); route to the cancel screen, do not log out and do not retry. DECLARED from 3.5.1-m1, but REACHABLE since 3.3.0-m1 — this operation simply failed to name it. Read `code` to tell the two apart."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404':
          description: "`not_ranked` — the caller has never been awarded points, so they are on no leaderboard and have no rank. This is NOT an error to retry and NOT a missing endpoint: it is the ordinary state of a student who has not answered a question yet. Render the board without a self-rank element — the same display state you already use for `403 score_hidden_leaderboard_unavailable` — and show the not-ranked-yet copy. A caller who has scored ALWAYS receives 200, including a caller with 0 points in this board's pool and a caller with `leaderboardVisible: false`, who still receives their notional position (adr-113)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`rate_limited` — per-student limit on the leaderboard reads. Honour `Retry-After`; do not retry in a tight loop."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '500':
          description: "`internal_error` — the board's projection could not be reached. `traceId` is the support handle."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT (~15 min). 401 `authentication_required` → refresh; 401 `session_superseded` → forced logout.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque (base64 keyset). Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100, minimum: 1 }
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 + Level Up extensions (ADR-026 §5). EVERY non-2xx body has this shape.
      properties:
        type: { type: string }
        title: { type: string, description: Developer-facing English. Never shown to users. }
        status: { type: integer }
        detail: { type: string, description: Developer-facing English. Never shown to users. }
        code: { type: string, description: "Stable machine code from error-codes.md, e.g. otp_expired. The client maps this to AR/EN copy." }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Field → messages (validation_failed only)
        traceId: { type: string }
      required: [title, status, code]
    CursorPage:
      type: object
      description: The one open-ended-list wrapper (ADR-026 §6). items' type varies per endpoint.
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, "null"], description: Opaque. Absent/null = no more pages. }
        hasMore: { type: boolean }
      required: [items, hasMore]
    Uuid:
      type: string
      format: uuid
      description: UUIDv7, opaque to the client (ADR-026 §7).
      example: "0197b2f3-8a11-7cc3-9b4e-3f2a1d6e8c01"
    Phone:
      type: string
      description: E.164 with country code.
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: "+201001234567"
    DeviceInfo:
      type: object
      description: Client-generated STABLE id (survives app restarts, regenerated on reinstall) — the device-binding key (adr-019).
      properties:
        deviceId: { type: string, maxLength: 64 }
        platform: { type: string, enum: [android, ios] }
        model: { type: string, maxLength: 100, description: "Display label for eviction messaging, e.g. \"Redmi Note 12\"." }
      required: [deviceId, platform]
    TokenPair:
      type: object
      properties:
        accessToken: { type: string, description: "JWT, ~15 min." }
        accessExpiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Rotates on every refresh; TTL 60 days. }
        refreshExpiresInSeconds: { type: integer, example: 5184000 }
      required: [accessToken, accessExpiresInSeconds, refreshToken, refreshExpiresInSeconds]
    AuthenticatedResult:
      type: object
      properties:
        result: { type: string, enum: [authenticated] }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        profile: { $ref: '#/components/schemas/StudentProfile' }
      required: [result, tokens, profile]
    RegistrationRequiredResult:
      type: object
      description: New phone — no account. Proceed to POST /auth/register within expiresInSeconds.
      properties:
        result: { type: string, enum: [registrationRequired] }
        registrationToken: { type: string }
        expiresInSeconds: { type: integer, example: 600 }
      required: [result, registrationToken, expiresInSeconds]
    EducationSystem:
      type: string
      description: Extensible — new values may appear additively (STEM future); clients must tolerate unknown values.
      enum: [nationalArabic, nationalLanguages, ig, american, ib]
    Stage:
      type: string
      enum: [prep1, prep2, prep3, secondary1, secondary2, secondary3]
    SchoolRegistration:
      type: object
      description: >
        City (adr-028 §1 — supersedes adr-010's rejection of free-text city): `cityId` (coded,
        from `/reference/cities`, preferred) OR `cityName` (free text, max 100 — the "my city
        isn't listed" fallback). At least one is required; supplying both → `validation_failed`.
        Registration is never blocked by a missing city row.


        School (adr-028 §2 — supersedes adr-010's Egypt-required schoolId): `schoolId` is
        OPTIONAL for every school-track student, Egypt included — pick from the coded list
        (`/reference/schools`) if the school is there, omit it if not. Free-text `schoolName`
        does not exist on this contract; unverifiable strings buy no feature.


        `governorateId` conditionality is unchanged from adr-010: required when `countryCode` is
        EG (`requiresGovernorate: true` on `/reference/countries`), forbidden otherwise.
        Violations → `validation_failed` with a field map.
      properties:
        track: { type: string, enum: [school] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string, example: "EG" }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        schoolId: { $ref: '#/components/schemas/Uuid', description: Optional for every school student (adr-028 §2 — no longer Egypt-required). Omit if the school isn't in the coded list — including when the student is outside Egypt. }
        stage: { $ref: '#/components/schemas/Stage' }
        educationSystem: { $ref: '#/components/schemas/EducationSystem' }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email, description: "Optional — receipts/notifications only, never login (adr-019)." }
        avatarId: { $ref: '#/components/schemas/Uuid', description: One of the 20 defaults; omit for server default. }
      required: [track, registrationToken, device, name, dateOfBirth, countryCode, stage, educationSystem, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    UniversityRegistration:
      type: object
      description: >
        Egypt-only by shape (no country field — adr-010). Years/faculties are data-driven ids
        from /reference/universities. City (adr-028 §1 — same rule as SchoolRegistration):
        `cityId` (coded, preferred) OR `cityName` (free text, max 100 — "my city isn't listed"
        fallback). At least one is required; supplying both → `validation_failed`.
      properties:
        track: { type: string, enum: [university] }
        registrationToken: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo', description: "MUST be the same device that called `/auth/otp/verify` — the `registrationToken` is device-bound. A mismatch → `registration_token_invalid` (restart at `/auth/otp/request`). Same shape as the `device` on `/auth/otp/verify` and `/auth/recovery/confirm`." }
        name: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        universityId: { $ref: '#/components/schemas/Uuid' }
        facultyId: { $ref: '#/components/schemas/Uuid' }
        studyYearId: { $ref: '#/components/schemas/Uuid', description: Must be an `active` year (soon → validation_failed). }
        governorateId: { $ref: '#/components/schemas/Uuid' }
        cityId: { $ref: '#/components/schemas/Uuid', description: Coded city (preferred). At least one of cityId/cityName required; both → validation_failed. }
        cityName: { type: string, maxLength: 100, description: Free-text city fallback (adr-028 §1) — used when the student's city isn't in the coded list. At least one of cityId/cityName required; both → validation_failed. }
        parentPhone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email }
        avatarId: { $ref: '#/components/schemas/Uuid' }
      required: [track, registrationToken, device, name, dateOfBirth, universityId, facultyId, studyYearId, governorateId, parentPhone]
      anyOf:
        - required: [cityId]
        - required: [cityName]
    NamedRef:
      type: object
      description: Generic bilingual reference row (governorate, city, school).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nameAr: { type: string }
        nameEn: { type: string }
      required: [id, nameAr, nameEn]
    StudentProfile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        track: { type: string, enum: [school, university] }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, "null"], format: email }
        dateOfBirth: { type: string, format: date }
        avatar:
          type: object
          properties:
            type: { type: string, enum: [default, custom] }
            id: { $ref: '#/components/schemas/Uuid', description: Present for default avatars. }
            url: { type: string, format: uri }
          required: [type, url]
        geography:
          type: object
          properties:
            countryCode: { type: string, example: "EG" }
            governorate: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }] }
            city:
              description: >
                Union (adr-028 §1): a `NamedRef` (has `id`) when the student picked a coded
                city, or `{ name }` free text when they used the "my city isn't listed"
                fallback. Always present — every student has a city, one way or the other.
              oneOf:
                - $ref: '#/components/schemas/NamedRef'
                - type: object
                  properties:
                    name: { type: string, maxLength: 100 }
                  required: [name]
          required: [countryCode, city]
        school:
          type: [object, "null"]
          description: School-track block (null for university students).
          properties:
            school: { oneOf: [{ $ref: '#/components/schemas/NamedRef' }, { type: "null" }], description: Coded school (adr-028 §2 — optional; null if the student didn't pick one — Egypt included). }
            stage: { $ref: '#/components/schemas/Stage' }
            educationSystem: { $ref: '#/components/schemas/EducationSystem' }
            parentReportStatus:
              type: string
              enum: [active, inactive]
              description: >
                adr-165 D7 — the ACTUAL parent-report status. `active` only once parent-report delivery is
                switched on; `inactive` otherwise. There is deliberately no pending state: no parent-side
                opt-in exists, so there is nothing to pend on. School track only; the whole `school` block is
                null for university students.
          required: [stage, educationSystem]
        university:
          type: [object, "null"]
          description: University-track block (null for school students).
          properties:
            university: { $ref: '#/components/schemas/NamedRef' }
            faculty: { $ref: '#/components/schemas/NamedRef' }
            yearNumber: { type: integer }
            termId: { $ref: '#/components/schemas/TermId' }
            termNumber: { $ref: '#/components/schemas/TermNumber' }
          required: [university, faculty, yearNumber]
        points:
          type: object
          description: Server-authoritative (adr-003 dual pools). Never computed client-side.
          properties:
            school: { type: integer }
            university: { type: integer }
            total: { type: integer }
          required: [school, university, total]
        level: { type: integer, description: "1–12, thresholds every 500 points; static, not configurable." }
        badges: { type: integer, description: "Post-level-12 badges (every 5,000 points; first at 11,000)." }
        privacy:
          type: object
          description: adr-023 toggles; defaults preserve visible behavior.
          properties:
            leaderboardVisible: { type: boolean, default: true }
            scoreHidden: { type: boolean, default: false }
          required: [leaderboardVisible, scoreHidden]
        entitlements:
          type: array
          description: Read-only embed for first paint; the entitlement-state source of truth is GET /me/entitlements.
          items: { $ref: '#/components/schemas/EntitlementState' }
        createdAt: { type: string, format: date-time }
        pendingDeletion:
          type: object
          description: >
            Present ONLY while an account-deletion request is pending (adr-114). **Absent
            otherwise — never `null`**, so presence is the flag: if the key is there, draw the
            cancel screen. Not in `required`, and adding it does not change any existing field.
          properties:
            effectiveAt: { type: string, format: date-time, description: "UTC — erasure runs no earlier than this. Cancel with DELETE /me/deletion-request before then." }
          required: [effectiveAt]
      required: [id, track, name, phone, dateOfBirth, avatar, geography, points, level, badges, privacy, entitlements, createdAt]
    EntitlementType:
      type: string
      description: Extensible set (adr-018) — clients must tolerate unknown values additively.
      enum: [baseSubscription, flashcardSubscription]
    EntitlementState:
      type: object
      properties:
        type: { $ref: '#/components/schemas/EntitlementType' }
        active: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
        inGrace: { type: boolean, description: 2-day grace after expiry (requirements §5). }
        graceEndsAt: { type: [string, "null"], format: date-time }
      required: [type, active, inGrace]
    TermId:
      type: [string, "null"]
      format: uuid
      description: >
        Opaque id of the term (adr-036). **Nullable, and null is normal** — null for every
        school-track resource, and null on a university profile during the summer gap or when the
        cohort has no schedule row. Opaque per adr-026 §7: do NOT hardcode term ids or derive an
        order from them — order and label on `termNumber`.
    TermNumber:
      type: [integer, "null"]
      description: >
        The term's ordinal within the academic year — `1` or `2` today (adr-036 §1 keeps the door
        open to more). Null exactly when `termId` is null. This is the ONLY orderable/labellable
        term signal on the wire: term NAMES are never sent, so the client renders its own localized
        AR/EN label, per adr-026 §5. Needed because a year-long course is two subjects with the same
        `name` (adr-036 §2).
    FlashcardSelfGrade:
      type: string
      description: >
        The two self-grades. **A CLOSED set, unlike `EntitlementType`** — the server stores the
        latest value per (student, card) and the client filters on `again`; a third value would
        render as neither and decides product behaviour nobody has specified.
      enum: [gotIt, again]
    FlashcardCard:
      type: object
      description: One flashcard as the study surface serves it (spec-028).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        front: { type: string, description: The prompt side. }
        back:
          type: string
          description: >
            The answer side. **Free multi-line text, and it may hold several answers** — render it as
            a block, not as a single label.
        imageUrl:
          type: [string, "null"]
          description: >
            Absolute CDN URL for the card's image, or `null`. **`null` is normal and is the answer in
            every environment today** — no card-image CDN origin is provisioned anywhere. Do not treat
            it as an error or as a missing image. When a value does appear it is content-addressed and
            immutable: a corrected image produces a DIFFERENT URL, never new bytes at the same one, so
            it is safe to cache forever.
        selfGrade:
          oneOf:
            - $ref: '#/components/schemas/FlashcardSelfGrade'
            - type: "null"
          description: >
            YOUR latest grade for this card, or `null` if you have never graded it. It is a property
            of the reader, not of the card — two students holding the same page see different values.
      required: [id, front, back, imageUrl, selfGrade]
    QuestionCounter:
      type: object
      description: Contract-v2 per-lesson/lecture counter — display only, never locks retakes.
      properties:
        answered: { type: integer, description: Distinct questions this student has ever answered in scope. }
        total: { type: integer }
      required: [answered, total]
    SchoolSubjectTree:
      type: object
      properties:
        track: { type: string, enum: [school] }
        units:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
                        required: [id, name, questionCounter]
                  required: [id, name, lessons]
            required: [id, name, chapters]
      required: [track, units]
    UniversitySubjectTree:
      type: object
      properties:
        track: { type: string, enum: [university] }
        quizTypes:
          type: array
          items: { type: string, enum: [normal, midTermRevision, finalRevision, practicalRevision] }
        lectures:
          type: array
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              questionCounter: { $ref: '#/components/schemas/QuestionCounter' }
              hasFlashcards:
                type: boolean
                description: >
                  Whether this lecture has at least one active flashcard — the signal that decides
                  whether to draw the Flashcards affordance. **Content presence, never subscription
                  state**: it is `true` for a free student too, and tapping through then hits the
                  weekly preview or `403 flashcard_subscription_required` on
                  `getFlashcardsForLecture`. A faculty whose whole tree returns `false` everywhere
                  has no flashcard content, and the surface should not be offered at all.


                  Added additively in `3.12.0-m1`. **It is NOT on `SchoolSubjectTree` and never will
                  be** — flashcards are university-track only, and a school tree carries no signal
                  that they exist.
            required: [id, name, questionCounter, hasFlashcards]
      required: [track, quizTypes, lectures]
    SchoolMistakesTree:
      type: object
      description: >
        The school Mistakes tree — PRUNED and SUMMED. Deliberately not `SchoolSubjectTree`: that one
        is the whole catalogue with an answered/total counter, this one is only the branches the
        student currently has mistakes in.
      properties:
        track: { type: string, enum: [school] }
        mistakeCount:
          type: integer
          minimum: 0
          description: Sum over the whole subject. `0` exactly when `units` is empty.
        units:
          type: array
          description: >
            Only units containing at least one mistake. May be EMPTY — that is a normal response for
            an in-scope subject the student has nothing outstanding in.
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              mistakeCount: { type: integer, minimum: 1, description: Sum over this unit's chapters. }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/Uuid' }
                    name: { type: string }
                    mistakeCount: { type: integer, minimum: 1, description: Sum over this chapter's lessons. }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          name: { type: string }
                          mistakeCount: { type: integer, minimum: 1 }
                        required: [id, name, mistakeCount]
                  required: [id, name, mistakeCount, lessons]
            required: [id, name, mistakeCount, chapters]
      required: [track, mistakeCount, units]
    UniversityMistakesTree:
      type: object
      description: >
        The university Mistakes tree — PRUNED. There is deliberately no `quizTypes` here, unlike
        `UniversitySubjectTree`: a mistakes tree is a history view, not a quiz-build tree.
      properties:
        track: { type: string, enum: [university] }
        mistakeCount:
          type: integer
          minimum: 0
          description: Sum over the whole subject. `0` exactly when `lectures` is empty.
        lectures:
          type: array
          description: Only lectures containing at least one mistake. May be EMPTY.
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              name: { type: string }
              mistakeCount: { type: integer, minimum: 1 }
            required: [id, name, mistakeCount]
      required: [track, mistakeCount, lectures]
    QuizQuestion:
      type: object
      description: NO correct answer here — grading is server-side on submit.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer }
        text: { type: string, description: Plain text; only <u>…</u> markup allowed. }
        imageUrl: { type: [string, "null"], format: uri, description: "Full image (DO Spaces CDN, WebP). Composed from the configured CDN origin and a content-addressed object key; null when the question has no published image or the environment has no CDN origin configured." }
        thumbnailUrl: { type: [string, "null"], format: uri, description: "Deliberately null in every environment: no thumbnail rendition is generated yet. A value appears only after a future contract change announces it." }
        options:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              text: { type: string }
            required: [id, text]
        isFavorite: { type: boolean }
      required: [id, order, text, options, isFavorite]
    Quiz:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        quizType: { type: [string, "null"], enum: [normal, midTermRevision, finalRevision, practicalRevision, null], description: University only. }
        scopeName: { type: string, description: Lesson/lecture display name (or "Retake wrong"/"Favorites" client-side by mode). }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        createdAt: { type: string, format: date-time }
      required: [id, mode, scopeName, questions, createdAt]
    AnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        correctOptionId: { $ref: '#/components/schemas/Uuid' }
        pointsDelta: { type: integer, description: "0 or 1 (server-side award; 0 on retry replay or free-plan edge)." }
        explanationAvailable:
          type: boolean
          description: >-
            Whether an AI explanation surface exists for this question — i.e. whether GET
            /questions/{questionId}/explanation would answer 200 or 202. Render the Explain
            affordance when true; when false, do not render it and do not call the endpoint.
            INDEPENDENT OF SUBSCRIPTION STATE (the hasFlashcards pattern): a free student sees true
            too, and the tap yields 403 subscription_required with the approved popup copy. It is
            true after correct AND incorrect answers alike. It reads false wherever the feature is
            not enabled for the question's track, and false everywhere while the surface is
            withdrawn.
      required: [correct, correctOptionId, pointsDelta, explanationAvailable]
    QuizSummary:
      type: object
      properties:
        quizId: { $ref: '#/components/schemas/Uuid' }
        score: { type: integer, description: Correct answers. }
        totalQuestions: { type: integer }
        answeredCount: { type: integer }
        pointsAwarded: { type: integer }
        leveledUp:
          type: boolean
          description: >
            Whether THIS attempt's awards crossed a level threshold. An EVENT, frozen on the attempt
            when it happened — it never changes afterwards, and a later quiz cannot turn it on or off.
            The student's CURRENT level and total are state, not events: read them from GET /me.
        newBadge:
          type: boolean
          description: >
            Whether THIS attempt's awards earned a badge. Frozen at the moment it happened, on the
            same rule as leveledUp.
        questions:
          type: array
          description: Recap rows (full review at GET /quizzes/{id}).
          items:
            type: object
            properties:
              questionId: { $ref: '#/components/schemas/Uuid' }
              answered: { type: boolean }
              correct: { type: [boolean, "null"], description: null when unanswered. }
            required: [questionId, answered]
      required: [quizId, score, totalQuestions, answeredCount, pointsAwarded, leveledUp, newBadge, questions]
    QuizHistoryItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        mode: { type: string, enum: [normal, retakeWrong, favorites] }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
      required: [id, subjectName, scopeName, mode, score, totalQuestions, finishedAt]
    QuizReview:
      type: object
      description: Post-completion review — includes the student's answer AND the correct answer per question (adr-017).
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        scopeName: { type: string }
        score: { type: integer }
        totalQuestions: { type: integer }
        finishedAt: { type: string, format: date-time }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuizQuestion'
              - type: object
                properties:
                  selectedOptionId: { type: [string, "null"], description: null = unanswered. }
                  correctOptionId: { $ref: '#/components/schemas/Uuid' }
                  correct: { type: [boolean, "null"] }
                  explanationAvailable: { type: boolean }
                required: [correctOptionId, explanationAvailable]
      required: [id, subjectName, scopeName, score, totalQuestions, finishedAt, questions]
    LeaderboardEntry:
      type: object
      description: >-
        Privacy-filtered (adr-023, adr-111): neither invisible students nor score-hidden students
        ever appear. Every row that IS emitted shows points — suppression removes the row, not the
        score — which is why `points` is required.
      properties:
        rank:
          type: integer
          description: >-
            Dense rank over VISIBLE students, where *visible* means NEITHER `leaderboardVisible:
            false` NOR `scoreHidden: true` (adr-111). Excluded students are removed from the rank
            population, so the ranks around them close and leave no gap. It is the student's exact
            position in that population, NOT a position within the page — so on a board with more
            than 200 visible students the last row this endpoint will ever render is `rank: 200`.
            Since 3.2.0-m1 it AGREES with `GET /leaderboard/me`'s `rank` by construction; the two
            are computed over the same population and cannot differ.
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        avatarUrl: { type: string, format: uri }
        points: { type: integer }
        isMe: { type: boolean }
      required: [rank, studentId, name, avatarUrl, points, isMe]
