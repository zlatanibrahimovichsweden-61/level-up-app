# Level Up — API contract (OWNED ARTIFACT, ADR-026)
# Owner: Seif. Two partners build against this file: the Flutter mobile app and the website.
# Both are bound by the same gate — they build ONLY against x-stability: stable paths.
# Contract-first: endpoints exist here BEFORE they exist in code. If code and this file
# disagree, the code is wrong. Every change gets an entry in contract-changelog.md.
#
# Conventions (ADR-026):
#   - Base path /api/v1 (URI versioning; additive changes don't bump)
#   - camelCase JSON properties; enums as camelCase strings; UTC ISO 8601 timestamps
#   - IDs: UUIDv7 strings, opaque to the client
#   - Errors: RFC 9457 ProblemDetails + stable `code` (registry: error-codes.md); client localizes AR/EN
#   - Pagination: cursor-based on every OPEN-ENDED list — ?cursor=&limit= (default 20, max 100)
#     → { "items": [...], "nextCursor": "...", "hasMore": true }
#     Closed reference sets (countries, governorates, systems, universities, avatars) are
#     returned as whole bare arrays — documented exception, they are pickers, not feeds.
#   - Auth: Authorization: Bearer <JWT>; 401 = refresh or forced logout (see `code`), 403 = forbidden
#   - Realtime (SignalR) documented in realtime.md, not here
#
# `x-behaviour-changed: <version>` (ADR-038) — READ THIS BEFORE IMPLEMENTING A MARKED OPERATION.
#   The operation's SCHEMA did not break, but its MEANING moved in the named version: it returns a
#   different set, or returns under different conditions, than it did before. Code generators,
#   the contract drift diff (adr-030) and Schemathesis are ALL blind to this class of change —
#   they compare shapes. The marker plus the operation's own `description` are the only signal.
#   An implementation that satisfies the schema and ignores the description is WRONG.
openapi: 3.1.0
info:
  title: Level Up API
  version: 3.46.0-m1
  description: >
    Milestone-1 surface. Paths marked `x-stability: draft` are NOT safe to build against;
    paths marked `stable` are frozen (changes announced via contract-changelog.md).


    ## Consumers

    **Operations are mobile-consumed by default.** Therefore the **absence** of `x-consumers`
    means **mobile-only** — it does not mean "unknown" or "not yet annotated"; an operation
    without the key is correctly annotated, and no tooling may require it.


    **When `x-consumers` IS present it is the COMPLETE consumer set for that operation, and it
    REPLACES the mobile default rather than adding to it.** So `x-consumers: [mobile, web]` means
    both consume the operation, while `x-consumers: [web]` means web only — the mobile app does
    **not** consume it. A value that omits `mobile` is a deliberate statement that the app is not
    a consumer, not an omission.


    `x-consumers` is **documentation metadata only**: it names who must be told when the
    operation changes. It is **not** an authorization source, **not** a routing input, and
    **not** a stability signal, and nothing may read it as one. Annotating an operation does not
    change its `x-stability`.


    ## Global auth behavior (adr-019 + contract session 2026-07-19)

    Access JWT ~15 min; rotating refresh token, TTL 60 days. **Session eviction is instant**:
    the server checks the session version (Redis) on every authenticated request, so ANY
    endpoint may return `401` + `code: session_superseded` at any moment (logged in on another
    device). Client: one global interceptor — on `session_superseded` purge tokens and show the
    forced-logout screen; on `authentication_required` run the refresh flow, then retry once.


    ## Account deletion during grace (adr-114)

    A student with a pending deletion request can still log in, but the account offers **exactly
    one action**, and that is enforced server-side rather than by the client. Every authenticated
    `/api/v1` endpoint answers `403` + `code: account_pending_deletion` **except these four**:
    `GET /me`, `POST /me/deletion-request` (so its `409` is reachable and never shadowed by the
    `403`), `DELETE /me/deletion-request`, and `POST /auth/logout`. The rule is **default-deny** —
    an endpoint added to this document later is blocked during grace unless it is added to that
    list, so do not read the four as a category.


    The whole **anonymous** ladder is outside the restriction by construction, because it carries
    no authenticated principal: `POST /auth/otp/request`, `/auth/otp/verify`, `/auth/register`,
    `/auth/refresh`, `/auth/recovery/start`, `/auth/recovery/verify-parent`,
    `/auth/recovery/new-phone` and `/auth/recovery/confirm` all behave normally during grace. That
    is deliberate and load-bearing: a student who lost their device must be able to recover an
    account in order to cancel its deletion.


    Client rule: on `403` `account_pending_deletion`, do **not** log the user out and do **not**
    retry — route to the cancel screen, drawn from `GET /me`'s `pendingDeletion.effectiveAt`.


    **OTP parameters:** 6 digits, 5-minute expiry, 60s resend cooldown, 5 failed verifies →
    15-minute lock (`otp_throttled`). One active code per phone; requesting again invalidates
    the previous code (after cooldown).


    **Registration ordering — phone-verify-first:** no PII is submitted before phone possession
    is proven. `otp/verify` returns full tokens for an existing account or a short-lived
    `registrationToken` (10 min) for a new phone; `POST /auth/register` consumes it.


    **Staging test numbers:** reserved fake numbers (+20100000000xx) are whitelisted in staging
    config only — fixed OTP `000000`, no SMS ever sent, rate limits identical to prod
    (so throttle/lock states are testable). Absent from production configuration. See security.md.


    **Anti-enumeration:** `otp/request` responds `202` whether or not an account exists — the
    existing/new fork happens inside `otp/verify`'s response, after possession is proven.


    **Question text format:** plain text; the ONLY inline markup is `<u>…</u>` for underline
    (contract v2 rich-text scope). No other HTML/Markdown is ever sent.
servers:
  - url: https://level-up-backend-staging.up.railway.app/api/v1
    description: staging
security:
  - bearerAuth: []
tags:
  - name: auth
    description: OTP login, registration, refresh, device binding, recovery (adr-019, adr-010)
  - name: reference
    description: Public lookup data for registration pickers (no auth)
  - name: profile
    description: Student profile, avatar, privacy toggles, FCM token
  - name: catalog
    description: Content taxonomy scoped to the caller's registration (track/system/stage or university/faculty/year)
  - name: quiz
    description: Quiz build → per-question answer → finish; history; favorites; AI explanation
  - name: flashcards
    description: >
      Anatomy Flashcards study surface — university track only, behind the SECOND subscription
      (adr-004, adr-060) with a shared weekly free preview (adr-091, adr-142)
  - name: entitlements
    description: Subscription state (extensible set, adr-018)
  - name: commerce
    description: Subscription-code redemption (adr-016)
  - name: leaderboard
    description: Scoped boards (adr-015) with privacy filtering (adr-023)
  - name: support
    description: >
      The student's own support tickets — create, list, read the thread, reply (adr-009, spec-045
      Group A). Text only for launch (Seif 2026-10-07, amending adr-187): attachments arrive later as
      an additive change in their own spec. Every operation here is `stable`.
  - name: social
    description: >
      The student's friend graph — friend requests, friends, suggestions, exact phone lookup, and a
      peer block (spec-042, adr-185). Owner-only: no operation reads another student's graph. Free
      for every student. No chat, photos or streaks here. Every operation here is `stable`.
  - name: chat
    description: >
      One-to-one friend TEXT chat (spec-055, adr-196). One conversation per friendship: it exists from
      the moment two students become friends and is deleted, with every message, on unfriend, block
      or Track transfer. A message expires 24 hours after the recipient reads it or 30 days after it
      is sent, whichever is first. Every state change is REST; the `chat` SignalR hub
      (`realtime.md`, also `stable`) only pushes. No photo, voice, group chat or streaks. Every
      operation here is `stable`.
paths:
  /auth/otp/request:
    post:
      tags: [auth]
      x-stability: stable
      x-consumers: [mobile, web]
      operationId: requestOtp
      summary: Send a login OTP to a phone (SMS)
      description: >
        Always `202` for a well-formed phone, whether or not an account exists (anti-enumeration).
        Delivered by SMS; the client is not told the provider.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
              required: [phone]
      responses:
        '202':
          description: OTP dispatched (or silently ignored for abuse-flagged numbers).
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [resendAfterSeconds, expiresInSeconds]
        '400':
          description: "`validation_failed` (malformed phone)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (cooldown or per-identifier/device/IP limit)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/otp/verify:
    post:
      tags: [auth]
      x-stability: stable
      x-consumers: [mobile, web]
      operationId: verifyOtp
      summary: Verify OTP — returns tokens (existing account) or a registrationToken (new phone)
      description: >
        Proving possession forks the flow: `authenticated` = tokens + profile, and if this is a
        NEW device the previous device's session is revoked HERE (it starts seeing
        `session_superseded`). `registrationRequired` = short-lived registrationToken (10 min);
        no account exists yet. 5 failed attempts → 15-min lock (`otp_throttled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, minLength: 6, maxLength: 6, example: "482913" }
                device: { $ref: '#/components/schemas/DeviceInfo' }
              required: [phone, code, device]
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthenticatedResult'
                  - $ref: '#/components/schemas/RegistrationRequiredResult'
                discriminator:
                  propertyName: result
                  mapping:
                    authenticated: '#/components/schemas/AuthenticatedResult'
                    registrationRequired: '#/components/schemas/RegistrationRequiredResult'
        '400':
          description: "`otp_invalid` · `otp_expired` · `validation_failed`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_banned` — the code was verified, but the account has been banned by Support; the code is consumed and no tokens or session were issued (spec-062 §8). Never returned before a code is proven."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (attempt lockout)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  # ---------------------------------------------------------------------------------------------
  # The REDEMPTION-SCOPED WEB SESSION (adr-171, spec-036). A SECOND credential kind, for the web
  # redemption journey only.
  #
  # Read adr-171 D3 before building against these. In one paragraph: a student who redeems a
  # subscription code in the browser must not be logged out of the app as a side effect, and the
  # session that makes that true can do nothing else. The pair below mints a credential that reaches
  # EXACTLY THREE operations — `redeemSubscriptionCode`, `getMyEntitlements` and `logout` — and
  # answers `403 redemption_scope_only` on every other authenticated `/api/v1` operation, present or
  # future. It carries NO refresh token, cannot be renewed, lives ten minutes, and spends its one
  # redemption on first success (after which it stays readable so a lost response can be recovered by
  # RE-READING entitlement state rather than by re-submitting the code).
  #
  # `POST /auth/otp/request`, `POST /auth/otp/verify` and `DeviceInfo` are UNCHANGED by this pair and
  # must stay that way: the native app is deliberately incapable of minting this credential. An OTP
  # minted here cannot be verified at `/auth/otp/verify`, and a sign-in OTP cannot be verified here;
  # both answer the operation's ordinary opaque failure.
  #
  # Nothing on this journey may appear in a URL — no token, no session id, no code, in either
  # direction.
  # ---------------------------------------------------------------------------------------------
  /auth/redemption-session/otp/request:
    post:
      tags: [auth]
      x-stability: stable
      x-consumers: [web]
      operationId: requestRedemptionSessionOtp
      summary: Send a REDEMPTION-purpose OTP to a phone (adr-171 D3.2)
      description: >
        Always `202` for a well-formed phone, whether or not an account exists (anti-enumeration) —
        the body is two constants and never varies by phone. Delivered by SMS; the client is not told
        the provider.


        The code this mints is **purpose-bound**: it can only ever become a redemption session. It
        cannot be verified at `POST /auth/otp/verify`, so the value a student types into the
        redemption page is never a full sign-in credential — which is what makes it safe for that
        page to be operated by a third party.


        A second request inside a live flow is permitted and simply replaces the pending code; it
        does not extend anything. Same throttle posture as `requestOtp` (60s resend cooldown, 5
        failed verifies → 15-minute lock) over its OWN counters, so nothing here can lock a student
        out of signing in to the app.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
              required: [phone]
      responses:
        '202':
          description: OTP dispatched (or silently ignored for abuse-flagged numbers).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  expiresInSeconds: { type: integer, example: 300 }
                required: [expiresInSeconds]
        '400':
          description: "`validation_failed` (malformed phone, or a property this schema does not declare)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (60-second resend cooldown, the 15-minute phone lock, or the per-address limit shared with `verifyRedemptionSessionOtp`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/redemption-session/otp/verify:
    post:
      tags: [auth]
      x-stability: stable
      x-consumers: [web]
      operationId: verifyRedemptionSessionOtp
      summary: Verify a redemption OTP — returns a redemption-scoped access token and nothing else
      description: >
        Returns `{ accessToken, expiresInSeconds }`. **There is no `refreshToken`, no profile and no
        entitlement payload** — the confirmation page reads state from `GET /me/entitlements`, and
        the browser (and any server-side proxy in front of it) therefore never receives a minor's
        name, phone, school or enrolment.


        **The request body takes no `device` and no field naming a student** — absent, not ignored:
        `additionalProperties: false`, and a body carrying `device`, `deviceId`, `studentId` or
        `enrolmentId` is answered `400 validation_failed` naming the property. The redemption lands
        on the token's subject and nowhere else.


        **This does NOT evict the student's app session, and is not evicted by one.** A second
        verify replaces the previous *redemption* session only. The token lives exactly ten minutes,
        has no refresh path, and fails at `POST /auth/refresh`.


        An unknown phone and a wrong code are **byte-identical** here, including at the lockout
        threshold. There is no `registrationRequired` arm: a redemption session is only ever minted
        for an existing student.


        ⚠ **A timed-out verify is UNKNOWN, not failed. Never replay it automatically** — the code
        may have been consumed and the answer lost. Request a fresh code instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                code: { type: string, minLength: 6, maxLength: 6, example: "482913" }
              required: [phone, code]
      responses:
        '200':
          description: Verified — a redemption-scoped session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accessToken: { type: string, description: Bearer token. Reaches exactly three operations. Never put it in a URL. }
                  expiresInSeconds: { type: integer, example: 600 }
                required: [accessToken, expiresInSeconds]
        '400':
          description: >-
            `otp_invalid` · `otp_expired` · `validation_failed`. `otp_invalid` covers a wrong code
            AND an unknown phone, indistinguishably; `otp_expired` covers never-requested, expired,
            already-consumed, and a code minted for sign-in rather than for redemption.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_banned` — the code was verified, but the account has been banned by Support; the code is consumed and no tokens or session were issued (spec-062 §8). Never returned before a code is proven."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled` (the 15-minute phone lock after 5 failed verifies, or the per-address limit shared with `requestRedemptionSessionOtp`)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/register:
    post:
      tags: [auth]
      x-stability: stable
      operationId: completeRegistration
      summary: Complete registration (consumes registrationToken) — one endpoint, track-discriminated body
      description: >
        Single endpoint per contract session 2026-07-19; `track` discriminates the body.
        University is Egypt-only BY SHAPE (no country field — adr-010). School: `country` drives
        `governorateId` conditionality (EG only). City is `cityId` OR `cityName`, at least one
        required (adr-028 — registration is never blocked by a missing city row); `schoolId` is
        optional for every school-track student, Egypt included, and free-text `schoolName` does
        not exist on this contract. Must be called from the same device that verified the OTP.

        `inviteCode` (optional, spec-047, `stable` since 3.44.0-m1): a friend's Refer a Friend code. It never fails
        registration — see `inviteCodeApplied` on the 201 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SchoolRegistration'
                - $ref: '#/components/schemas/UniversityRegistration'
              discriminator:
                propertyName: track
                mapping:
                  school: '#/components/schemas/SchoolRegistration'
                  university: '#/components/schemas/UniversityRegistration'
      responses:
        '201':
          description: Account created; session issued (device bound).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedResult' }
        '400':
          description: "`validation_failed` (field map in `errors` — incl. geography conditionality)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid` (expired/consumed/wrong device — restart at otp/request)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`phone_already_registered` (account appeared since verify — client restarts login)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/refresh:
    post:
      tags: [auth]
      x-stability: stable
      operationId: refreshTokens
      summary: Rotate the refresh token, mint a new access token
      description: >
        Rotation with reuse detection: replaying an already-rotated token revokes the whole chain
        (`refresh_token_invalid` — full re-login). If a newer device session exists, the answer is
        `session_superseded` (forced-logout flow, adr-019 eviction).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                deviceId: { type: string, description: Same client-generated stable id sent at verify. }
              required: [refreshToken, deviceId]
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: "`refresh_token_invalid` (expired/revoked/reused → full re-login) · `session_superseded` (evicted by newer device)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/logout:
    post:
      tags: [auth]
      x-stability: stable
      operationId: logout
      summary: Revoke this session (access + refresh chain)
      responses:
        '204': { description: Session revoked. Idempotent. }
        '401':
          description: "`authentication_required`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/start:
    post:
      tags: [auth]
      x-stability: stable
      operationId: startRecovery
      summary: "Recovery step 1: look up the account, send OTP to the parent phone (masked)"
      description: >
        adr-019 primary recovery path (lost/changed number). Returns the parent number MASKED
        (UI/UX handoff: never the full number). Heavily rate-limited + audited — this endpoint
        inherently confirms account existence, which is why limits here are stricter than login.
        `recovery_unavailable` is ONE shared code for every reason the parent-phone rung cannot
        run — an unknown phone, and an account whose parent number is unusable — and stays shared
        on purpose: the cases are meant to be indistinguishable, so there is less enumeration
        signal. Since adr-053 made the stored parent number mandatory, the second case is
        unreachable in practice; the code is deliberately NOT split, so nothing about the
        behaviour changes. Either way the app routes to the support path.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/Phone', description: The OLD (lost/changed) registered phone. }
              required: [phone]
      responses:
        '200':
          description: Parent OTP dispatched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryId: { $ref: '#/components/schemas/Uuid' }
                  parentPhoneMasked: { type: string, example: "•••• ••• 1234" }
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [recoveryId, parentPhoneMasked, resendAfterSeconds, expiresInSeconds]
        '404':
          description: "`recovery_unavailable` → app shows the support path (Path 2)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/verify-parent:
    post:
      tags: [auth]
      x-stability: stable
      operationId: verifyParentOtp
      summary: "Recovery step 2: verify the parent-phone OTP"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryId: { $ref: '#/components/schemas/Uuid' }
                code: { type: string, minLength: 6, maxLength: 6 }
              required: [recoveryId, code]
      responses:
        '200':
          description: Guardianship proven; short-lived rebind token issued (10 min).
          content:
            application/json:
              schema:
                type: object
                properties:
                  rebindToken: { type: string }
                  expiresInSeconds: { type: integer, example: 600 }
                required: [rebindToken, expiresInSeconds]
        '400':
          description: "`otp_invalid` · `otp_expired`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid` (rebind/recovery token expired — restart)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: "`account_banned` — the code was verified, but the account has been banned by Support; no tokens or session were issued (spec-062 §8). Never returned before a code is proven."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429':
          description: "`otp_throttled`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /auth/recovery/new-phone:
    post:
      tags: [auth]
      x-stability: stable
      operationId: submitNewPhone
      summary: "Recovery step 3: submit the NEW phone — OTP is sent to it"
      description: >
        Parent OTP proves guardianship; this step proves possession of the NEW number (otherwise a
        typo re-locks the student). `phone_already_registered` if the new number belongs to another account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rebindToken: { type: string }
                newPhone: { $ref: '#/components/schemas/Phone' }
              required: [rebindToken, newPhone]
      responses:
        '202':
          description: OTP dispatched to the new phone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAfterSeconds: { type: integer, example: 60 }
                  expiresInSeconds: { type: integer, example: 300 }
                required: [resendAfterSeconds, expiresInSeconds]
        '400':
          description: "`validation_failed` — `newPhone` is missing or not a valid E.164 number."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`registration_token_invalid` (rebind token expired — restart recovery)"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "`phone_already_registered`"
