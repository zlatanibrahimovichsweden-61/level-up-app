  /me/terms-acceptance:
    get:
      tags: [profile]
      x-stability: stable
      operationId: getTermsAcceptance
      summary: The currently required Terms version, and what the caller has accepted
      description: >-
        The caller's own record only — the student is taken from the access token; there is no id in
        the path, the query or a body. `currentVersion` is the server-configured version the student
        must accept, or `null` when none is configured (the feature is inert until one is — every
        accept is then refused). `acceptedVersion` / `acceptedAtUtc` are the caller's most recent
        acceptance, or `null`. `isCurrent` is `true` only when `currentVersion` is non-null and equals
        `acceptedVersion`. The version is an opaque identifier; the backend serves no Terms text and
        no link. This records the student's own acceptance; it is not parent consent.
      responses:
        '200':
          description: The caller's Terms acceptance state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentVersion:  { type: [string, "null"], maxLength: 32 }
                  acceptedVersion: { type: [string, "null"], maxLength: 32 }
                  acceptedAtUtc:   { type: [string, "null"], format: date-time, description: Server-recorded UTC time of that acceptance. }
                  isCurrent:       { type: boolean }
                required: [currentVersion, acceptedVersion, acceptedAtUtc, isCurrent]
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    post:
      tags: [profile]
      x-stability: stable
      operationId: acceptTerms
      summary: Record that the caller accepts the currently required Terms version (idempotent)
      description: >-
        `termsVersion` must equal the `currentVersion` returned by `getTermsAcceptance`. The server
        records the time — no timestamp is accepted from the client. Accepting a version already
        accepted is `204` and changes nothing: the first acceptance time stands. A later version adds
        a new record; earlier acceptances are kept. Acceptance is recorded, not enforced: no other
        operation refuses a student who has not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                termsVersion: { type: string, maxLength: 32 }
              required: [termsVersion]
      responses:
        '204': { description: Recorded (idempotent — a repeat of an accepted version is a no-op). }
        '400':
          description: >-
            `validation_failed` with a field error on `termsVersion` — absent, empty, not a string, or
            not equal to the currently required version (including when no version is configured). The
            response never states the required version; read it from `getTermsAcceptance`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/notifications:
    get:
      tags: [profile]
      x-stability: stable
      operationId: listMyNotifications
      summary: The caller's own notification inbox (cursor-paginated, newest first)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: category
          in: query
          required: false
          description: >-
            Narrow the page to one inbox tab. Absent means All. A category no kind maps to yet
            returns an empty page. The unread count is unaffected: it is always the total.
          schema: { type: string, enum: [system, announcements, support] }
      responses:
        '200':
          description: >-
            A page of the caller's inbox items, newest first. `kind` + `data` are a LOCALIZATION
            CONTRACT, not display text: render the string for `kind` in the user's language and
            substitute `data`. Branch on `hasMore`, never on `items.length`. `category` is derived
            server-side from `kind`. Clients MUST ignore an item whose `kind` they do not recognise,
            and MUST ignore an unknown `category` value, so new values can be added without a
            breaking change. **The one exception to the localization contract is `kind:
            announcement`** (`category: announcements`, spec-052): its `data` always carries exactly
            five keys — `announcementId`, `titleAr`, `titleEn`, `bodyAr`, `bodyEn` — and the four
            text values ARE display text, written by an Admin. Show `titleAr`/`bodyAr` when the UI
            is in Arabic and `titleEn`/`bodyEn` when it is in English, render them as **plain text**
            (keep line breaks), and **never auto-link** anything in them. The localization contract
            stands for every other kind. **`kind: moderation_warning`** (`category: system`,
            spec-062) is a fixed warning from Support after a report about content from the
            student's account; its `data` is always empty (no student text, no reporter, no staff
            name). Render this approved copy (approved in writing by the client, 2026-10-07) in the
            UI language. EN title: "A message about your account". EN body: "We received a report
            about content from your account that does not follow the Level Up community rules. This
            is a warning. Please keep your messages and photos respectful. If this happens again,
            your account may be banned. If you think this is a mistake, contact Support from the
            app." AR title: "رسالة بخصوص حسابك". AR body: "وصلنا بلاغ عن محتوى من حسابك لا يتوافق مع
            قواعد مجتمع Level Up. هذا تنبيه لك. من فضلك حافظ على احترام الآخرين في رسائلك وصورك. إذا
            تكرر ذلك فقد يتم إيقاف حسابك نهائيا. إذا كنت ترى أن هذا حدث بالخطأ، تواصل مع الدعم من داخل
            التطبيق."
            **`kind: support_ticket_replied`** (`category: support`, spec-045 Group C): Customer Service
            or an Admin replied to one of the caller's support tickets. Its `data` always carries
            exactly two keys — `ticketId` (open the ticket with `getMySupportTicket`) and `reference`
            (the ticket's `TK-…` label, for display only) — and never any reply text or staff name.
            One item per staff reply; the student's own messages produce none. Such an item may also
            be sent as a push notification once push delivery is enabled. Push delivery is not
            enabled in any environment today.
            **`kind: academic_year_opened`** (`category: system`, spec-068): an Admin opened a new
            academic year for the caller's track. Its `data` always carries exactly two keys —
            `track` (`school` or `university`) and `academicYear` (`YYYY/YYYY`, e.g. `2026/2027`) —
            as localization parameters, not display text. One item per opening; it may also arrive as
            a push of the same kind, which carries neither key (`realtime.md` § Push notifications).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            notificationId: { $ref: '#/components/schemas/Uuid' }
                            kind:      { type: string, enum: [enrolment_opened, announcement, moderation_warning, support_ticket_replied, academic_year_opened] }
                            category:  { type: string, enum: [system, announcements, support] }
                            data:      { type: object, additionalProperties: { type: string } }
                            createdAt: { type: string, format: date-time }
                            readAt:    { type: [string, "null"], format: date-time }
                          required: [notificationId, kind, category, data, createdAt, readAt]
        '400':
          description: "`validation_failed` — `cursor` is not a cursor this API issued, `limit` is out of range, or `category` is not a published value."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
          description: "`authentication_required` · `session_superseded`"
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /me/notifications/unread-count:
    get:
