      tags: [profile]
      x-stability: stable
      operationId: markNotificationRead
      summary: Mark one of the caller's own inbox items read (idempotent)
      parameters:
        - { name: notificationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '204':
          description: >-
            Marked read. Idempotent: `readAt` is set once and is never moved, so a client retry
            cannot rewrite history and a second call is `204` too.
        '404':
          description: >-
            `not_found` — unknown notification id, **or** an id belonging to another account. One
            code for both, deliberately: a `403` here would confirm the id exists.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401':
