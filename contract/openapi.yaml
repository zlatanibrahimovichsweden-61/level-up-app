          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    post:
      tags: [support]
      x-stability: stable
      operationId: postMySupportTicketMessage
      summary: Reply on one of the caller's own open tickets
      description: >
        Appends a reply to the thread and moves the ticket's `lastActivityAt` to the reply's
        `createdAt`. `body` is trimmed server-side and must be 1–4000 characters after trimming. A
        closed ticket takes no reply and cannot be reopened; the student files a new ticket instead.


        **Photos (spec-067, additive).** The optional `attachmentIds` (at most 3, no repeats) sends
        completed photos with the reply; with at least one photo, `body` may be an EMPTY string (a
        photo-only reply). A ticket holds at most 10 photos. Check order: ownership (`404 not_found`),
        closed (`409 ticket_closed`), then the photo checks (`403 terms_acceptance_required`,
        `409 attachment_limit_reached`, `404 attachment_not_found`). A refused photo check writes NO reply.
      parameters:
