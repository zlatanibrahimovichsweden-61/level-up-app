org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable Kotlin incremental compilation: the project lives on F:\ while the
# Flutter SDK / Gradle home / pub-cache are on C:\, and Kotlin's relocatable
# incremental cache (RelocatableFileToPathConverter) throws when relativizing
# paths across drives on Windows, corrupting the cache on close and failing the
# build ("Could not close incremental caches"). Full (non-incremental) Kotlin
# compilation is unaffected; only incremental rebuild speed changes.
kotlin.incremental=false
# Some plugins (e.g. screen_protector) pin Java to target 17 while Kotlin picks
# up JDK 21 (the only JDK on this machine — Android Studio's bundled JBR), which
# trips Gradle's "Inconsistent JVM-target compatibility" check. Android dexes all
# bytecode via D8, so the JVM class-file version is irrelevant to the APK;
# downgrade the check to a warning so the build proceeds. (Install a JDK 17 and
# point Flutter at it via `flutter config --jdk-dir` to remove this entirely.)
kotlin.jvm.target.validation.mode=warning
