# Level Up — CI
#
# Designed for THIS repo, not from a template. The shape follows three facts
# established by the DevOps audit (`.ai/audits/current/devops.md`):
#
#   1. Generated code IS committed (18 *.freezed.dart, 16 *.g.dart,
#      3 lib/l10n/app_localizations*.dart). So the default path does NOT run
#      build_runner — that would cost 60-120s on every PR to reproduce bytes
#      that are already in the tree. A *drift check* runs on push to `main`
#      only, where it is worth the minutes.
#   2. `flutter gen-l10n` is cheap (no build graph), so the l10n drift check
#      runs on every PR.
#   3. Golden tests (`test/goldens/`, 5 cases) were generated on Windows.
#      Flutter goldens are platform-specific — text shaping and AA differ
#      between the Windows and Linux Skia/Impeller backends, so a correct
#      golden WILL fail on ubuntu-latest. They are therefore excluded from the
#      Linux job and run in a separate, advisory Windows job. See the
#      `goldens` job below.
#
# Flutter version: PINNED, not floating on `stable`. See the `FLUTTER_VERSION`
# note below — read it before changing anything.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# One run per ref. A force-push to a PR branch cancels the superseded run
# instead of paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---------------------------------------------------------------------------
  # The SDK version is NOT defined here. It lives in `.flutter-version` at the
  # repo root — one file, read by every job (see the "Read pinned Flutter
  # version" step) and by `tool/validate.ps1` / `tool/validate.sh`.
  #
  # Why a file instead of a workflow `env:`: the version previously appeared in
  # the workflow only, so the local toolchain and CI could disagree silently.
  # `test/guards/workflow_test.dart` fails if CI stops reading the file.
  #
  # Currently pinned to 3.44.7 — the version the suite was actually validated
  # against (806 passing, Dart 3.12.2). PIN, do not float on `channel: stable`;
  # a silent SDK bump is the most common cause of "CI broke and nobody changed
  # code". To move it: run `flutter --version` on the dev machine, put that
  # number in `.flutter-version`, and re-run the suite before committing.
  #
  # `.metadata` records revision f6ff1529… but that is the revision the project
  # was *created* with — `flutter upgrade` does not rewrite it — so it is used
  # for a WARNING only, never as the pin. Note `pubspec.yaml` still declares
  # `sdk: ^3.10.4` while the toolchain reports Dart 3.12.2; that is a valid
  # lower bound, deliberately left alone, because raising it changes the
  # language version and therefore `dart format` output.
  FLUTTER_CHANNEL: "stable"
  METADATA_REVISION: "f6ff1529fd6d8af5f706051d9251ac9231c83407"

jobs:
  # ===========================================================================
  # The gate. Runs on every PR and every push. Must stay under ~5 minutes.
  # ===========================================================================
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the SDK version: the `.flutter-version` file
      # at the repo root. Read here rather than duplicated into a workflow `env:`
      # so there is exactly one place to change it and nothing to drift.
      # `shell: bash` because the Windows runner defaults to pwsh.
      - name: Read pinned Flutter version
        id: fv
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # The SDK cache above covers the Flutter tree. This covers ~/.pub-cache,
      # keyed on the committed lockfile, so an unchanged pubspec.lock means a
      # near-instant `pub get`.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.fv.outputs.version }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.fv.outputs.version }}-

      - name: Toolchain report
        run: |
          set -eu
          flutter --version
          dart --version
          # `--machine` occasionally prints a banner before the JSON; drop
          # anything before the first '{'.
          flutter --version --machine | sed -n '/^{/,$p' > /tmp/flutter-version.json
          have="$(jq -r '.frameworkRevision' /tmp/flutter-version.json)"
          echo "framework revision : $have"
          echo ".metadata revision : $METADATA_REVISION"
          if [ "$have" != "$METADATA_REVISION" ]; then
            echo "::warning title=Flutter revision differs from .metadata::CI is on $have, .metadata records $METADATA_REVISION. Expected if the SDK was upgraded since the project was created; a problem if nobody upgraded it. The pin lives in .flutter-version."
          fi

      # Uses the committed pubspec.lock. Never `pub upgrade` in CI — the point
      # of committing the lock for an application is that CI builds the same
      # dependency set the developer built.
      # Tier-0 finding C-1. The INTERNET permission lived only in the debug and
      # profile source sets, which merge into their own build types and NOT into
      # release — so release networking was dead while development worked
      # perfectly. Nothing in analyze or the 792-case suite can see that.
      #
      # This is the cheap deterministic half of the guard: it asserts the line is
      # in `main`, which is the only source set that reaches every build type.
      # The `release-manifest` job below proves it survives the real merge.
      # Costs milliseconds, so it runs on every PR rather than on main only.
      - name: Release manifest declares INTERNET
        run: |
          set -eu
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error file=$manifest,title=Release networking is broken::android.permission.INTERNET is missing from src/main. Declaring it in src/debug and src/profile is NOT enough — those source sets never merge into release, so every network call fails in a release build while development works perfectly. This is the exact regression recorded as Tier-0 C-1."
            exit 1
          fi
          echo "src/main declares android.permission.INTERNET"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Lockfile did not drift
        run: |
          set -eu
          if ! git diff --quiet -- pubspec.lock; then
            echo "::error title=pubspec.lock changed during pub get::The committed lockfile does not match what this SDK resolves. Run 'flutter pub get' locally and commit the result, or reconcile the pin in .flutter-version."
            git --no-pager diff -- pubspec.lock
            exit 1
          fi

      # Cheap (no build_runner, no build graph). Catches an .arb edit that was
      # never regenerated — a class of bug that shows as a missing string in
      # Arabic, which is the baseline locale here, not an edge case.
      - name: Localizations are up to date
        run: |
          set -eu
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            echo "::error title=lib/l10n is stale::An .arb file changed without regenerating. Run 'flutter gen-l10n' and commit lib/l10n/app_localizations*.dart."
            git --no-pager diff --stat -- lib/l10n
            exit 1
          fi

      # Generated files are excluded: freezed / json_serializable / gen-l10n run
      # their own formatter, and a dart-format version skew between the
      # generator and the SDK would fail CI on bytes no human wrote.
      - name: Format check (hand-written Dart only)
        run: |
          set -eu
          mapfile -t files < <(git ls-files '*.dart' \
            | grep -vE '\.(freezed|g)\.dart$' \
            | grep -vE '^lib/l10n/app_localizations')
          echo "checking ${#files[@]} files"
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze
        run: flutter analyze --no-pub

      # NO DIRECTORY LIST. This used to read
      #   flutter test test/core test/dev test/features
      # which silently skipped test/widget_test.dart — it sits at the root of
      # test/ and matched none of the three directories — and would silently
      # skip every future directory too. A test that is never run is worse than
      # a test that fails, because it reports success.
      #
      # `flutter test` with no path argument walks the whole test/ tree, so
      # discovery is driven by the repository rather than by a list somebody has
      # to remember to update. Goldens are excluded BY TAG, not by path, for the
      # platform reason in the header. test/guards/workflow_test.dart fails if a
      # path argument is ever reintroduced here.
      - name: Test (whole suite except goldens)
        run: flutter test --no-pub --reporter expanded --exclude-tags golden

  # ===========================================================================
  # Goldens. Windows, because that is where the .png baselines were produced.
  # ADVISORY (continue-on-error) until it has been green once — flip
  # continue-on-error to false at that point and add it to branch protection.
  #
  # Cost note: Windows runners bill at 2x minutes on private repos. This job is
  # 2 test files / 5 cases; setup dominates (~3 min). If that ever stops being
  # acceptable, the cheaper fix is to tag the golden tests
  # (`@Tags(['golden'])` at the top of test/goldens/*.dart) and run the whole
  # suite in one job with `--exclude-tags golden` on Linux. That edit touches
  # test/ and was out of scope for the audit pass that wrote this file.
  # ===========================================================================
  goldens:
    name: goldens (windows, advisory)
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the SDK version: the `.flutter-version` file
      # at the repo root. Read here rather than duplicated into a workflow `env:`
      # so there is exactly one place to change it and nothing to drift.
      # `shell: bash` because the Windows runner defaults to pwsh.
      - name: Read pinned Flutter version
        id: fv
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Selected by tag, so a golden added anywhere in test/ is picked up.
      - name: Golden tests
        run: flutter test --no-pub --reporter expanded --tags golden

      # A failed golden writes the actual/diff PNGs next to the baseline. Ship
      # them, otherwise "goldens failed" is an unactionable red X.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # Codegen drift. `main` only — running build_runner costs 60-120s and the
  # generated output is already committed, so on a PR it would be pure cost.
  # On `main` it is the safety net that catches a model edited without a
  # regenerate. Also runnable on demand via workflow_dispatch.
  # ===========================================================================
  codegen-drift:
    name: codegen drift (main only)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the SDK version: the `.flutter-version` file
      # at the repo root. Read here rather than duplicated into a workflow `env:`
      # so there is exactly one place to change it and nothing to drift.
      # `shell: bash` because the Windows runner defaults to pwsh.
      - name: Read pinned Flutter version
        id: fv
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.fv.outputs.version }}-${{ hashFiles('pubspec.lock') }}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate and diff
        run: |
          set -eu
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.freezed.dart' '*.g.dart'; then
            echo "::error title=Generated code is stale::A @freezed / @JsonSerializable model changed without running build_runner. Run 'dart run build_runner build --delete-conflicting-outputs' and commit."
            git --no-pager diff --stat -- '*.freezed.dart' '*.g.dart'
            exit 1
          fi
          echo "generated output matches the committed tree"

  # ===========================================================================
  # Release-mode compile gate. `main` only, and deliberately NOT on PRs — an
  # APK build is 6-10 minutes and finds almost nothing that analyze+test misses
  # on a PR-sized change. What it DOES find is release-only breakage: icon
  # tree-shaking on a non-const IconData, const-eval failures, AOT-only errors.
  #
  # No artefact is uploaded. android/key.properties is (correctly) gitignored,
  # so a release build here is UNSIGNED and cannot be installed — publishing it
  # would be a trap, not a convenience. This job is a compile check only.
  # Wire real signing via secrets when there is an actual distribution channel;
  # see docs/RELEASE_SIGNING.md.
  # ===========================================================================
  build-release-apk:
    name: release compile gate (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # android/gradle.properties asks for -Xmx8G, which is tuned for the dev
      # machine and is too close to the runner's 16 GB ceiling once the Kotlin
      # and Dart compilers are also resident. Cap it here.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for the SDK version: the `.flutter-version` file
      # at the repo root. Read here rather than duplicated into a workflow `env:`
      # so there is exactly one place to change it and nothing to drift.
      # `shell: bash` because the Windows runner defaults to pwsh.
      - name: Read pinned Flutter version
        id: fv
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.fv.outputs.version }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK (unsigned — compile gate only)
        run: flutter build apk --release --no-pub -t lib/main_prod.dart

      # The other half of the C-1 guard, and the only one that is actual proof:
      # inspect what the merge ACTUALLY produced, not what the source says. A
      # plugin, a manifest placeholder or a tools:node="remove" could in
      # principle strip a permission that is present in source.
      #
      # aapt2 reads the compiled binary manifest inside the APK, which is the
      # real shipped artefact. The merged-manifest XML is a fallback because its
      # path moves between AGP versions.
      - name: Release APK actually carries INTERNET
        run: |
          set -eu
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk" || { echo "::error::release APK not found at $apk"; exit 1; }

          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"

          if [ -n "$aapt2" ]; then
            echo "inspecting the built APK with $aapt2"
            if "$aapt2" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "VERIFIED: the release APK declares android.permission.INTERNET"
              exit 0
            fi
            echo "::error title=Release APK has no INTERNET permission::The built release artefact cannot reach the network. See Tier-0 C-1."
            "$aapt2" dump permissions "$apk" || true
            exit 1
          fi

          echo "aapt2 not found — falling back to the merged manifest"
          merged="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml 2>/dev/null | head -1 || true)"
          test -n "$merged" || { echo "::error::could not locate a merged release manifest to verify"; exit 1; }
          echo "inspecting $merged"
          if ! grep -q 'android.permission.INTERNET' "$merged"; then
            echo "::error title=Merged release manifest has no INTERNET permission::See Tier-0 C-1."
            exit 1
          fi
          echo "VERIFIED: the merged release manifest declares android.permission.INTERNET"
